      icon: mdi:lightning-bolt
      label: Power · consumption
      variables:
        accent: "#fab387"
      grid_options:
        columns: full
    - type: heading
      heading: History
      heading_style: title
      icon: mdi:chart-areaspline
    - type: grid
      grid_options:
        columns: full
      columns: 2
      square: false
      cards:
      - type: custom:stack-in-card
        mode: vertical
        cards:
        - type: custom:button-card
          template: aurora_plot_header
          entity: sensor.total_power
          name: Total power · 24 h
          label: "The home's current draw, in watts"
          state_display: |
            [[[ const v = parseFloat(entity.state); return isNaN(v) ? '—' : Math.round(v) + ' W'; ]]]
          variables:
            accent: "#fab387"
        - type: custom:apexcharts-card
          graph_span: 24h
          span:
            end: minute
          header:
            show: false
          apex_config:
            chart:
              height: 230
              animations: *apex_anim
              dropShadow:
                enabled: true
                top: 0
                left: 0
                blur: 6
                opacity: 0.7
                color: "#fab387"
            grid: *apex_grid
            fill: *apex_fill2
            legend:
              show: false
          all_series_config:
            type: area
            curve: stepline
            stroke_width: 2
            group_by:
              func: avg
              duration: 5min
          series:
          - entity: sensor.total_power
            name: Total power
            color: "#fab387"
            show:
              extremas: true
              legend_value: false
          - entity: sensor.total_power
            name: scan
            type: line
            color: "#fab387"
            stroke_width: 3
            show:
              in_legend: false
              in_header: false
              legend_value: false
      - type: custom:stack-in-card
