# ═══════════════════════════════════════════════════════════════════════════
#  Aurora Dashboard — generic English template
#  All logic runs CLIENT-side (button-card JS / auto-entities patterns).
#  Deliberately NO Jinja card templates (render_template) — see README.
#  Layout rule: max_columns 3, sections column_span 3 (full width),
#  columns come from inner grid cards -> deterministic on any desktop.
#  Search for "sensor." placeholders and adapt them to your install (see README).
# ═══════════════════════════════════════════════════════════════════════════
title: Aurora

# Wiederverwendbare Plot-Bausteine (Cockpit-Look: Neon-Glow, Scan-Puls, Animationen)
aurora_defs:
  apex_anim: &apex_anim
    enabled: true
    easing: easeinout
    speed: 900
    dynamicAnimation:
      enabled: true
      speed: 600
  apex_grid: &apex_grid
    borderColor: "rgba(180,190,254,0.07)"
    strokeDashArray: 3
  apex_fill2: &apex_fill2
    type: ["gradient", "solid"]
    opacity: [1, 1]
    gradient:
      opacityFrom: 0.4
      opacityTo: 0.03
  apex_fill3: &apex_fill3
    type: ["gradient", "gradient", "solid"]
    opacity: [1, 1, 1]
    gradient:
      opacityFrom: 0.4
      opacityTo: 0.03

button_card_templates:

  aurora_base:
    show_state: false
    show_label: false
    tap_action:
      action: none
    styles:
      card:
      - padding: 12px
      name:
      - font-weight: 600
    # KEINE extra_styles: button-card kopiert sie in JEDE erbende Karte.
    # Alle Keyframes liegen zentral im geteilten Stylesheet des Helfers.

  aurora_chip:
    template: aurora_base
    show_icon: true
    show_name: true
    show_label: true
    # These chips count across all entities, so they do need broad updates.
    # If your instance has many fast-changing sensors, replace `all` with an
    # explicit entity list per chip — that alone took one dashboard from
    # 120 re-renders/s down to a handful.
    triggers_update: all
    size: 22px
    styles:
      grid:
      - grid-template-areas: "'i n' 'i l'"
      - grid-template-columns: 48px 1fr
      - grid-template-rows: min-content min-content
      card:
      - padding: 10px 12px
      - height: 66px
      img_cell:
      - grid-area: i
      - width: 40px
      - height: 40px
      - border-radius: 12px
      - background: "rgba(137,180,250,0.08)"
      - align-self: center
      icon:
      - animation: |
          [[[
            const d = ((entity ? entity.entity_id.length : 3) % 5) * 0.6;
            return 'aurora-float 6.5s ease-in-out ' + d + 's infinite';
          ]]]
      name:
      - grid-area: n
      - justify-self: start
      - align-self: end
      - font-size: 19px
      - font-weight: 700
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - line-height: 1.1
      label:
      - grid-area: l
      - justify-self: start
      - align-self: start
      - font-size: 10.5px
      - letter-spacing: .08em
      - text-transform: uppercase
      - color: "#a6adc8"
      - margin-top: 2px

  aurora_metric:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: true
    size: 20px
    tap_action:
      action: more-info
    variables:
      accent: "#89b4fa"
      accent_bg: "rgba(137,180,250,0.10)"
    # Raw values like 4.57999992370605 kWh would overflow the tile → round them.
    state_display: |
      [[[
        const st = entity ? entity.state : null;
        if (st === null || st === undefined) return '—';
        if (entity.attributes.device_class === 'timestamp') {
          const d = new Date(st);
          return isNaN(d) ? st : d.toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit'});
        }
        if (st === 'unknown' || st === 'unavailable' || st === 'none') return '—';
        const v = parseFloat(st);
        if (isNaN(v)) {
          // let HA translate enum states (appliance programs etc.)
          try { return hass.formatEntityState(entity); } catch (e) { return st; }
        }
        const a = Math.abs(v);
        const dec = a >= 100 ? 0 : a >= 10 ? 1 : 2;
        const u = entity.attributes.unit_of_measurement;
        return parseFloat(v.toFixed(dec)) + (u ? ' ' + u : '');
      ]]]
    styles:
      grid:
      - grid-template-areas: "'i s' 'i n'"
      - grid-template-columns: 48px 1fr
      - grid-template-rows: min-content min-content
      card:
      - padding: 10px 12px
      - height: 66px
      img_cell:
      - grid-area: i
      - width: 40px
      - height: 40px
      - border-radius: 12px
      - background: "[[[ return variables.accent_bg; ]]]"
      - align-self: center
      icon:
      - color: "[[[ return variables.accent; ]]]"
      - animation: |
          [[[
            const d = ((entity ? entity.entity_id.length : 3) % 6) * 0.55;
            return 'aurora-float 7.5s ease-in-out ' + d + 's infinite';
          ]]]
      state:
      - grid-area: s
      - justify-self: start
      - align-self: end
      - font-size: "clamp(13px, 1.15vw, 18px)"
      - font-weight: 700
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - line-height: 1.1
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      name:
      - grid-area: n
      - justify-self: start
      - align-self: start
      - font-size: 10.5px
      - letter-spacing: .08em
      - text-transform: uppercase
      - color: "#a6adc8"
      - margin-top: 2px
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%

  # A trend nobody can read is decoration. Every plot carries a plain-language
  # line under its title saying what the curve means and in which unit — that is
  # what `label` is for, and why the grid has a second row for it.
  aurora_plot_header:
    template: aurora_base
    show_icon: false
    show_name: true
    show_state: true
    show_label: true
    tap_action:
      action: more-info
    variables:
      accent: "#89b4fa"
    styles:
      grid:
      - grid-template-areas: "'n s' 'l s'"
      - grid-template-columns: 1fr auto
      card:
      - padding: 12px 18px 2px 18px
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: 0
      name:
      - justify-self: start
      - align-self: center
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: "clamp(9px, 3vw, 12px)"
      - font-weight: 600
      - letter-spacing: .14em
      - text-transform: uppercase
      - color: "#a6adc8"
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - min-width: 0
      label:
      - grid-area: l
      - justify-self: start
      - text-align: left
      - font-size: "clamp(10px, 2.9vw, 12.5px)"
      - font-weight: 500
      - letter-spacing: "0"
      - text-transform: none
      - color: "#a6adc8"
      - opacity: ".7"
      - line-height: "1.35"
      - white-space: normal
      - padding: 2px 0 2px 0
      - min-width: 0
      state:
      - justify-self: end
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: "clamp(15px, 5.5vw, 24px)"
      - font-weight: 800
      - color: "[[[ return variables.accent; ]]]"
      - text-shadow: "[[[ return '0 0 14px ' + variables.accent + '80'; ]]]"

  # ─────────────────────────────────────────────────────────────────────────
  #  aurora_plot_tile — the same header squeezed for the sensor explorer, where
  #  two plots sit side by side: the name gets the full width (two lines), the
  #  time window and the value share the row below it. Same colours, no new tone.
  # ─────────────────────────────────────────────────────────────────────────
  aurora_plot_tile:
    template: aurora_plot_header
    styles:
      grid:
      - grid-template-areas: "'n n' 'l s'"
      - grid-template-columns: auto 1fr
      - row-gap: 1px
      card:
      - padding: 10px 12px 0 12px
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: 0
      name:
      - grid-area: n
      - justify-self: start
      - text-align: left
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: "clamp(9px, 2.6vw, 11px)"
      - font-weight: 600
      - letter-spacing: .08em
      - text-transform: uppercase
      - color: "#a6adc8"
      - white-space: normal
      - line-height: "1.25"
      - min-height: 2.5em
      - display: "-webkit-box"
      - "-webkit-line-clamp": "2"
      - "-webkit-box-orient": vertical
      - overflow: hidden
      - min-width: 0
      label:
      - grid-area: l
      - align-self: end
      - justify-self: start
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: 10px
      - letter-spacing: .06em
      - text-transform: none
      - color: "#a6adc8"
      - opacity: ".55"
      - white-space: nowrap
      state:
      - grid-area: s
      - justify-self: end
      - align-self: end
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: "clamp(12px, 3.6vw, 17px)"
      - font-weight: 800
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - color: "[[[ return variables.accent; ]]]"
      - text-shadow: "[[[ return '0 0 12px ' + variables.accent + '70'; ]]]"

  # ─────────────────────────────────────────────────────────────────────────
  #  aurora_sky — the drawn sky behind everything.
  #  Three scenes (Day / Dusk / Night), all drawn from scratch: plain CSS
  #  gradients and hand-placed SVG shapes. NO third-party image files.
  #
  #  What decides the scene:
  #   · switch     input_select.sky_mode (Auto/Day/Dusk/Night)
  #   · Auto       sun elevation: > 6° Day, -8°…6° Dusk, < -8° Night
  #   · sun spot   azimuth → left/right, elevation → up/down (real values)
  #   · WEATHER    weather.forecast_home: the palette follows the local
  #                conditions, the number of clouds follows the cloud cover and
  #                their speed the real wind; rain/snow/fog/lightning are drawn
  #                on top and the sun fades out behind thick cover
  #   · SEASON     the ground is a meadow — fresh in spring, deep green with
  #                poppies in summer, golden with falling leaves in autumn and
  #                snow-covered in winter (month → season, or force one via
  #                the `season` variable)
  #
  #  Performance: only ONE scene ever exists in the DOM, every animation runs
  #  on transform/opacity only (compositor). Measured figures: see README.
  # ─────────────────────────────────────────────────────────────────────────
  aurora_sky:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    variables:
      weather: weather.forecast_home
      # empty = season from the month; otherwise force one of
      # spring|summer|autumn|winter
      season: ""
    triggers_update:
    - sun.sun
    - input_select.sky_mode
    - weather.forecast_home
    custom_fields:
      scene: |
        [[[
          const V = variables;
          const S = states;
          // ── Szene bestimmen ────────────────────────────────────────────
          const sel = S['input_select.aurora_himmel'];
          let mode = sel ? sel.state : 'Automatik';
          const sun  = S['sun.sun'];
          const elev = sun ? Number(sun.attributes.elevation) : -30;
          const azi  = sun ? Number(sun.attributes.azimuth)   : 180;
          if (mode === 'Automatik' || !['Tag','Dämmerung','Nacht'].includes(mode)) {
            mode = elev > 6 ? 'Tag' : (elev > -8 ? 'Dämmerung' : 'Nacht');
          }

          // ── Wetter am Ort ─────────────────────────────────────────────
          const w    = S[V.weather];
          const cond = w ? String(w.state) : 'partlycloudy';
          const att  = w ? w.attributes : {};
          const cover = att.cloud_coverage != null ? Number(att.cloud_coverage)
                      : (cond === 'sunny' || cond === 'clear-night') ? 5
                      : cond === 'cloudy' ? 90 : 50;
          const wind = Number(att.wind_speed) || 8;
          const rain  = ['rainy','pouring','lightning-rainy','snowy-rainy','hail'].includes(cond);
          const heavy = ['pouring','lightning-rainy','hail'].includes(cond);
          const snow  = ['snowy','snowy-rainy'].includes(cond);
          const fog   = ['fog','exceptional'].includes(cond);
          const storm = ['lightning','lightning-rainy'].includes(cond);
          const clear = ['sunny','clear-night'].includes(cond);
          // Wolkenzahl folgt der Bedeckung, Tempo dem echten Wind. Bei Regen oder
          // Schnee zieht deutlich mehr durchs Bild - dort, wo es herkommt, ist der
          // Himmel eben voll.
          // Auf dem Handy laeuft die Bewegung WEITER - nur mit halb so vielen
          // Tropfen. Der Aufwand haengt an der Anzahl, nicht daran, ob sich etwas
          // bewegt; ein Einfrieren sah aus wie ein Fehler.
          const handy = !!(window.matchMedia && window.matchMedia('(max-width: 700px)').matches);
          const wenigerAufKlein = (n) => handy ? Math.max(4, Math.round(n / 2)) : n;
          const nass    = rain || snow;
          const nClouds = Math.max(0, Math.min(nass ? 13 : 6,
                          Math.round(cover / (nass ? 8 : 17)) + (nass ? 4 : 0)));
          const sail    = Math.max(80, Math.round(430 - wind * 9));

          // ── Jahreszeit (Nordhalbkugel) ────────────────────────────────
          const m = new Date().getMonth();
          const season = ['spring','summer','autumn','winter'].includes(V.season) ? V.season
                       : (m >= 2 && m <= 4) ? 'spring'
                       : (m >= 5 && m <= 7) ? 'summer'
                       : (m >= 8 && m <= 10) ? 'autumn' : 'winter';

          // ── Bausteine ─────────────────────────────────────────────────
          // Wenn es schneit, liegt Schnee - egal welcher Monat. Eine ausdrueckliche
          // Vorgabe in variables.season behaelt Vorrang (sie dient dem Ausprobieren).
          const bodenSaison = (snow && !['spring','summer','autumn','winter'].includes(V.season))
                            ? 'winter' : season;
          const clouds = (cls) => {
            let out = '';
            for (let i = 0; i < nClouds; i++) {
              // 13 Wolken x 9 % waeren 117 % - die letzten waeren unter dem Bild.
              // Deshalb umlaufend auf sieben Hoehen, leicht versetzt.
              const top   = 6 + (i % 7) * 8 + (i > 6 ? 4 : 0);
              const scale = (i % 3 === 0) ? 1.25 : (i % 3 === 1) ? 1 : .8;
              const dur   = Math.round(sail * (1 + i * 0.22));
              const delay = -Math.round(dur * (i * 0.31 % 1));
              out += `<div class="cloud ${cls}" style="top:${top}%;`
                   + `width:${Math.round(230 * scale)}px;height:${Math.round(78 * scale)}px;`
                   + `animation-duration:${dur}s;animation-delay:${delay}s;`
                   + `opacity:${(clear ? .26 : rain || cond === 'cloudy' ? .62 : .42).toFixed(2)}"></div>`;
            }
            return out;
          };
          // Naher Regen gehoert VOR die Wiese, ferner dahinter. weatherFx() legt den
            // nahen hier ab; die Vorlage liest ihn direkt nach dem Boden wieder aus.
            // (Vorlagen werden von links nach rechts ausgewertet - der Wert steht dann.)
            // Neigung von Regen und Schnee folgt dem echten Wind.
            const boeen = Math.max(.35, Math.min(1.6, (wind || 8) / 12));
            let nahFx = '';
            const weatherFx = () => {
            let out = '';
            const rainLanes = (n, weit) => {
                  let out = '';
                  // 97 ist teilerfremd zu 100 - die Bahnen streuen sich damit von selbst,
                  // ohne Zufall (der bei jedem Neuzeichnen ein anderes Bild ergaebe).
                  for (let i = 0; i < n; i++) {
                    const x    = (i * 97 + (weit ? 41 : 13)) % 100;
                    const land = weit ? 23 + (i * 7) % 5 : 4 + (i * 11) % 22;
                    const nah  = weit ? 0 : 1 - land / 30;
                    const dur  = (weit ? 1.35 : .70) + ((i * 13) % 9) / 36 - nah * .18;
                    out += '<i class="rainlane' + (weit ? ' far' : '') + '" style="'
                         + 'left:' + x + '%;bottom:' + land + '%;'
                         + '--w:'  + (weit ? 1.5 : 2.1 + nah * 1.7).toFixed(1) + 'px;'
                         + '--h:'  + (weit ? 8 : 10 + nah * 9).toFixed(0) + 'px;'
                         + '--sw:' + (10 + nah * 14).toFixed(0) + 'px;'
                         + '--o:'  + (weit ? .38 : .55 + nah * .4).toFixed(2) + ';'
                         + '--d:'  + (dur / (heavy ? 1.45 : 1)).toFixed(2) + 's;'
                         + '--t:'  + (-(i * 0.37) % dur).toFixed(2) + 's;'
                         + '--fall:' + (106 - land) + 'vh;'
                         + '--dx:' + Math.round((weit ? 26 : 44) * boeen + (i % 3) * 4) + 'px"></i>';
                  }
                  return out;
                };
                if (rain) { out += rainLanes(wenigerAufKlein(heavy ? 24 : 16), true);
                           nahFx += rainLanes(wenigerAufKlein(heavy ? 34 : 20), false); }
            const snowLanes = (n, weit) => {
                  let out = '';
                  for (let i = 0; i < n; i++) {
                    const x    = (i * 89 + (weit ? 29 : 7)) % 100;
                    const land = weit ? 23 + (i * 5) % 5 : 3 + (i * 13) % 23;
                    const nah  = weit ? 0 : 1 - land / 30;
                    const dur  = (weit ? 13 : 8.5) + ((i * 17) % 11) / 2;
                    out += '<i class="snowlane' + (weit ? ' far' : '') + '" style="'
                         + 'left:' + x + '%;bottom:' + land + '%;'
                         + '--w:'  + (weit ? 3.4 : 4.6 + nah * 3.4).toFixed(1) + 'px;'
                         + '--sw:' + (9 + nah * 11).toFixed(0) + 'px;'
                         + '--o:'  + (weit ? .5 : .72 + nah * .26).toFixed(2) + ';'
                         + '--d:'  + dur.toFixed(2) + 's;'
                         + '--t:'  + (-(i * 1.7) % dur).toFixed(2) + 's;'
                         + '--fall:' + (106 - land) + 'vh;'
                         + '--dx:' + Math.round((weit ? 22 : 38) * (1 + boeen)) + 'px"></i>';
                  }
                  return out;
                };
                if (snow) { out += snowLanes(wenigerAufKlein(24), true); nahFx += snowLanes(wenigerAufKlein(30), false); }
            if (fog)   out += '<div class="fogband f1"></div><div class="fogband f2"></div>';
            if (storm) out += '<div class="flash"></div>';
            return out;
          };
          const ground = (variant) => {
            let extra = '';
            if (bodenSaison === 'autumn' && variant !== 'night') {
              extra = '<div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div>';
            }
            if (bodenSaison === 'summer' && variant === 'night') {
              extra = '<div class="firefly f1"></div><div class="firefly f2"></div>'
                    + '<div class="firefly f3"></div><div class="firefly f4"></div>';
            }
            return `<div class="ground ${bodenSaison} ${variant}">
              <div class="treeline"></div>
              <div class="meadow"></div>
              <div class="flowers"></div>
              <div class="grass"></div>
              ${extra}
            </div>`;
          };

          // ── Mond: echte Bahn + echte Phase ────────────────────────────
          // Vereinfachte Mondposition (Meeus, Genauigkeit ~0,3° — reicht fuer ein Bild)
          // und der beleuchtete Anteil, gezeichnet als Lune. Standort kommt aus HA.
          const moonHTML = () => {
            const D = Math.PI / 180;
            const lat = (hass.config && hass.config.latitude) || 50;
            const lon = (hass.config && hass.config.longitude) || 10;
            const d = Date.now() / 86400000 + 2440587.5 - 2451545.0;
            const L = (218.316 + 13.176396 * d) * D;
            const M = (134.963 + 13.064993 * d) * D;
            const F = (93.272 + 13.229350 * d) * D;
            const lam = L + 6.289 * D * Math.sin(M);
            const bet = 5.128 * D * Math.sin(F);
            const eps = 23.4397 * D;
            const ra = Math.atan2(Math.sin(lam) * Math.cos(eps) - Math.tan(bet) * Math.sin(eps), Math.cos(lam));
            const dec = Math.asin(Math.sin(bet) * Math.cos(eps) + Math.cos(bet) * Math.sin(eps) * Math.sin(lam));
            const phi = lat * D;
            const th = (280.16 + 360.9856235 * d) * D + lon * D;
            const H = th - ra;
            const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H)) / D;
            let az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi)) / D + 180;
            az = (az + 360) % 360;
            // Sonne (grob) fuer die Phase
            const Ms = (357.5291 + 0.98560028 * d) * D;
            const Ls = (280.459 + 0.98564736 * d) * D + (1.9148 * Math.sin(Ms) + 0.0200 * Math.sin(2 * Ms)) * D;
            const elong = Math.acos(Math.cos(bet) * Math.cos(lam - Ls));
            const k = (1 - Math.cos(elong)) / 2;                 // beleuchteter Anteil 0..1
            const waxing = Math.sin(lam - Ls) > 0;               // zunehmend?
            if (alt < -3) return '';                              // unter dem Horizont
            const mx = Math.max(2, Math.min(92, ((az - 60) / 240) * 90 + 2));
            const my = Math.max(4, Math.min(78, 74 - (Math.max(alt, -3) / 55) * 68));
            const r = 46, rx = (r * Math.abs(1 - 2 * k)).toFixed(1);
            const s1 = waxing ? 1 : 0;
            const s2 = (k > 0.5) ? (waxing ? 1 : 0) : (waxing ? 0 : 1);
            const lit = `M0,${-r} A${r},${r} 0 0,${s1} 0,${r} A${rx},${r} 0 0,${s2} 0,${-r} Z`;
            const dim = Math.min(1, Math.max(0.25, 0.35 + k))
                      * Math.max(0.8, 1 - cover / 400);   // schmale Sichel + Wolken daempfen
            const NAMES = ['Neumond','zunehmende Sichel','erstes Viertel','zunehmender Mond',
                           'Vollmond','abnehmender Mond','letztes Viertel','abnehmende Sichel'];
            const idx = k < 0.04 ? 0 : k > 0.96 ? 4
                      : (Math.abs(k - 0.5) < 0.06 ? (waxing ? 2 : 6) : (k < 0.5 ? (waxing ? 1 : 7) : (waxing ? 3 : 5)));
            return `<div class="moonwrap" style="left:${mx.toFixed(1)}%;top:${my.toFixed(1)}%;opacity:${dim.toFixed(2)}"
                         title="${NAMES[idx]} · ${Math.round(k * 100)} % beleuchtet">
              <svg viewBox="-52 -52 104 104" class="moondisc">
                <defs>
                  <radialGradient id="mg" cx="38%" cy="34%" r="72%">
                    <stop offset="0%" stop-color="#fffdf2"/>
                    <stop offset="62%" stop-color="#f2ead4"/>
                    <stop offset="100%" stop-color="#d9cfb4"/>
                  </radialGradient>
                  <clipPath id="mclip"><path d="${lit}"/></clipPath>
                </defs>
                <circle r="46" fill="rgba(205,214,244,.07)"/>
                <g clip-path="url(#mclip)">
                  <circle r="46" fill="url(#mg)"/>
                  <circle cx="-14" cy="-12" r="8"  fill="rgba(140,132,110,.30)"/>
                  <circle cx="12"  cy="6"   r="11" fill="rgba(140,132,110,.24)"/>
                  <circle cx="-6"  cy="20"  r="6"  fill="rgba(140,132,110,.26)"/>
                  <circle cx="20"  cy="-20" r="5"  fill="rgba(140,132,110,.22)"/>
                </g>
              </svg>
            </div>`;
          };

          // ── Nacht ─────────────────────────────────────────────────────
          if (mode === 'Nacht') {
            const starDim = Math.max(.18, 1 - cover / 120);
            return `<div class="sky sky-night">
              <div class="stars" style="opacity:${(0.75 * starDim).toFixed(2)}"></div>
              <div class="stars2" style="opacity:${starDim.toFixed(2)}"></div>
              ${moonHTML()}
              ${clouds('night')}
              ${weatherFx()}
              ${ground('night')}
            ${nahFx}
            </div>`;
          }

          // Sonne dorthin setzen, wo sie steht: Azimut 60°–300° auf 2 %–92 %,
          // Höhe 0°–55° auf 72 %–6 % (tief stehend = knapp über dem Horizont).
          const x = Math.max(2, Math.min(92, ((azi - 60) / 240) * 90 + 2));
          const y = Math.max(6, Math.min(74, 72 - (Math.max(elev, -6) / 55) * 66));
          const pos = `left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;`;
          // Bei dichter Bedeckung verschwindet die Sonne hinter den Wolken
          const sunOp = Math.max(0, 1 - cover / 105).toFixed(2);
          const dusk  = mode === 'Dämmerung';
          const paletteFor = () => {
            if (dusk) return 'sky-dusk';
            if (rain || cond === 'cloudy') return 'sky-day wet';
            if (snow) return 'sky-day snowy';
            if (fog)  return 'sky-day foggy';
            if (clear) return 'sky-day clear';
            return 'sky-day';
          };
          return `<div class="sky ${paletteFor()}">
            <div class="rays${dusk ? ' dusk' : ''}" style="${pos}opacity:${sunOp}"></div>
            <div class="sun${dusk ? ' dusk' : ''}" style="${pos}opacity:${sunOp}"></div>
            ${dusk ? '<div class="stars2 faint"></div>' : ''}
            ${dusk ? moonHTML() : ''}
            <div class="haze"></div>
            ${clouds(dusk ? 'warm' : '')}
            ${!rain && !snow && !fog && !dusk ? '<div class="bird b1"></div><div class="bird b2"></div>' : ''}
            ${weatherFx()}
            ${ground(dusk ? 'dusk' : 'day')}
            ${nahFx}
          </div>`;
        ]]]
    styles:
      card:
      - position: fixed
      - inset: "0"
      - z-index: "0"
      - pointer-events: none
      - border: none
      - border-radius: "0"
      - box-shadow: none
      - background: none
      - backdrop-filter: none
      - overflow: hidden
      grid:
      - position: absolute
      - inset: "0"
      custom_fields:
        scene:
        - position: absolute
        - inset: "0"
    extra_styles: |
      /* fixed statt absolute: die Karte ist zwar bildschirmfüllend, ihr
         Inhalts-Grid nicht — eine absolute Ebene darin wäre nur so hoch wie
         der (leere) Karteninhalt und die Szene klebte oben am Rand. */
      .sky { position: fixed; inset: 0; overflow: hidden; }

      /* ══ HIMMEL-PALETTEN ══ folgen der Wetterlage am Ort ══════════════ */
      .sky-day        { background: linear-gradient(180deg, #12253f 0%, #1d4a75 26%, #2e7aa8 58%, #4aa3cc 100%); }
      .sky-day.clear  { background: linear-gradient(180deg, #0d2c52 0%, #1a5c92 30%, #3390c2 62%, #6fbde0 100%); }
      .sky-day.wet    { background: linear-gradient(180deg, #222c3a 0%, #3b4b5e 30%, #566a80 62%, #73879b 100%); }
      .sky-day.snowy  { background: linear-gradient(180deg, #2c3a49 0%, #4c6072 30%, #74899c 62%, #a3b5c4 100%); }
      .sky-day.foggy  { background: linear-gradient(180deg, #363d45 0%, #5e666e 30%, #868d94 62%, #aab1b8 100%); }
      .sky-dusk       { background: linear-gradient(180deg, #12122a 0%, #241f45 26%, #4a3059 52%, #7c4460 74%, #a8583f 100%); }
      .sky-night      { background: radial-gradient(120% 80% at 50% 108%, rgba(49,50,68,.5), transparent 62%); }

      /* Schleier: hält den oberen Bildbereich dunkel genug für die hellen
         Sektions-Überschriften, lässt die Wiese unten aber hell bleiben. */
      .sky-day::after, .sky-dusk::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(180deg,
          rgba(17,17,27,.16) 0%, rgba(17,17,27,.34) 42%,
          rgba(17,17,27,.28) 72%, rgba(17,17,27,.08) 100%);
      }

      /* ══ NACHT ══ Sternbilder + Streulicht. Gedriftet wird per transform
         auf einer überdimensionierten Ebene — background-position wäre eine
         Paint-Eigenschaft und ließe den Blur aller Glaskarten darüber jeden
         Frame neu rechnen. */
      .stars, .stars2 { position: absolute; inset: -30%; background-repeat: repeat; will-change: transform; }
      .stars {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><g fill='none' stroke='rgba(180,190,254,0.12)' stroke-width='0.7'><path d='M60,80 L140,58 L204,122 L298,96 L344,150'/><path d='M420,178 L502,140 L558,210 L622,188'/><path d='M118,418 L182,378 L262,430 L252,520 L176,548'/><path d='M478,478 L542,430 L612,470 L590,560 L518,584'/><path d='M320,260 L362,300 L330,360 L320,260'/><path d='M560,60 L610,96 L664,72'/></g><g fill='%23b4befe'><circle cx='60' cy='80' r='1.4' opacity='.8'/><circle cx='140' cy='58' r='1.1' opacity='.7'/><circle cx='204' cy='122' r='1.5' opacity='.9'/><circle cx='298' cy='96' r='1' opacity='.6'/><circle cx='344' cy='150' r='1.2' opacity='.7'/><circle cx='420' cy='178' r='1.3' opacity='.8'/><circle cx='502' cy='140' r='1' opacity='.6'/><circle cx='558' cy='210' r='1.5' opacity='.9'/><circle cx='622' cy='188' r='1.1' opacity='.7'/><circle cx='118' cy='418' r='1.2' opacity='.7'/><circle cx='182' cy='378' r='1.4' opacity='.85'/><circle cx='262' cy='430' r='1' opacity='.6'/><circle cx='252' cy='520' r='1.3' opacity='.8'/><circle cx='176' cy='548' r='1' opacity='.6'/><circle cx='478' cy='478' r='1.4' opacity='.8'/><circle cx='542' cy='430' r='1.1' opacity='.65'/><circle cx='612' cy='470' r='1.5' opacity='.9'/><circle cx='590' cy='560' r='1' opacity='.6'/><circle cx='518' cy='584' r='1.2' opacity='.7'/><circle cx='320' cy='260' r='1.3' opacity='.75'/><circle cx='362' cy='300' r='1' opacity='.6'/><circle cx='330' cy='360' r='1.2' opacity='.7'/><circle cx='560' cy='60' r='1.2' opacity='.7'/><circle cx='610' cy='96' r='1.4' opacity='.85'/><circle cx='664' cy='72' r='1' opacity='.6'/></g><g fill='%23cdd6f4'><circle cx='40' cy='240' r='0.8' opacity='.35'/><circle cx='96' cy='300' r='0.7' opacity='.3'/><circle cx='230' cy='210' r='0.9' opacity='.4'/><circle cx='390' cy='60' r='0.7' opacity='.3'/><circle cx='470' cy='300' r='0.8' opacity='.35'/><circle cx='540' cy='330' r='0.7' opacity='.3'/><circle cx='640' cy='320' r='0.9' opacity='.4'/><circle cx='60' cy='620' r='0.8' opacity='.35'/><circle cx='340' cy='560' r='0.7' opacity='.3'/><circle cx='400' cy='640' r='0.9' opacity='.4'/><circle cx='660' cy='620' r='0.8' opacity='.35'/><circle cx='300' cy='400' r='0.7' opacity='.3'/></g></svg>");
        background-size: 700px 700px;
        animation: sky-drift-a 420s linear infinite alternate;
      }
      .stars2 {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><g fill='%23cdd6f4'><circle cx='30' cy='50' r='1' opacity='.55'/><circle cx='120' cy='24' r='0.8' opacity='.45'/><circle cx='210' cy='90' r='1.1' opacity='.6'/><circle cx='330' cy='40' r='0.8' opacity='.45'/><circle cx='390' cy='140' r='1' opacity='.55'/><circle cx='70' cy='180' r='0.9' opacity='.5'/><circle cx='170' cy='230' r='0.7' opacity='.4'/><circle cx='280' cy='190' r='1' opacity='.55'/><circle cx='350' cy='280' r='0.8' opacity='.45'/><circle cx='40' cy='330' r='1.1' opacity='.6'/><circle cx='150' cy='370' r='0.8' opacity='.45'/><circle cx='250' cy='330' r='0.9' opacity='.5'/><circle cx='330' cy='390' r='1' opacity='.55'/><circle cx='390' cy='350' r='0.7' opacity='.4'/></g></svg>");
        background-size: 420px 420px;
        animation: sky-drift-b 300s linear infinite alternate, sky-twinkle 7s ease-in-out infinite alternate;
      }
      .stars2.faint { opacity: .45 !important; animation: sky-twinkle 9s ease-in-out infinite alternate; }
      .moon {
        /* Steht der Mond hinter einer Glaskarte, verwischt deren backdrop-filter
           ihn zu einem Lichtfleck — deshalb groß, kontrastreich und knapp unter
           dem Kopfbereich, wo meist eine Lücke bleibt. */
        position: absolute; top: 4.5%; right: 7%;
        width: 88px; height: 88px; border-radius: 50%;
        background: radial-gradient(circle at 36% 33%, #f8f4e6 0%, #e6e0cf 52%, #c6c2b1 100%);
        box-shadow: 0 0 26px 3px rgba(246,242,226,.14),
                    inset -7px -5px 13px rgba(88,86,78,.30);
        will-change: transform;
        animation: sky-breath 40s ease-in-out infinite;
      }
      .moon::after {
        content: ""; position: absolute; inset: 0; border-radius: 50%;
        background:
          radial-gradient(circle at 63% 29%, rgba(126,124,110,.30) 0 8px, transparent 9px),
          radial-gradient(circle at 39% 61%, rgba(126,124,110,.26) 0 12px, transparent 13px),
          radial-gradient(circle at 69% 68%, rgba(126,124,110,.20) 0 7px, transparent 8px);
      }

      /* ══ SONNE ══ Position kommt aus Azimut/Höhe, Deckkraft aus der Bewölkung */
      .sun {
        position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #fffae8 0%, #ffdf9a 34%, rgba(255,199,102,.42) 58%, rgba(255,199,102,0) 72%);
        will-change: opacity;
        animation: sky-breath 22s ease-in-out infinite;
      }
      .sun.dusk { background: radial-gradient(circle at 50% 50%, #ffe9c9 0%, #ffab68 32%, rgba(240,124,88,.40) 58%, rgba(240,124,88,0) 74%); }
      .rays {
        position: absolute; width: 460px; height: 460px; margin: -230px 0 0 -230px;
        border-radius: 50%;
        background: repeating-conic-gradient(rgba(255,214,130,.13) 0deg 3deg, rgba(255,214,130,0) 3deg 22deg);
        -webkit-mask: radial-gradient(circle, transparent 12%, #000 22%, #000 62%, transparent 74%);
        mask: radial-gradient(circle, transparent 12%, #000 22%, #000 62%, transparent 74%);
        will-change: transform;
        animation: sky-spin 190s linear infinite;
      }
      .rays.dusk { background: repeating-conic-gradient(rgba(255,163,110,.11) 0deg 3deg, rgba(255,163,110,0) 3deg 22deg); }

      /* Dunstband über dem Horizont — lässt die Ferne zurücktreten */
      .haze {
        position: absolute; left: 0; right: 0; bottom: 24%; height: 18%;
        background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.14) 100%);
      }

      /* ══ WOLKEN ══ drei weiche Kreise über flacher Unterkante — gezeichnet,
         nicht fotografiert. Anzahl = Bedeckungsgrad, Tempo = echter Wind. */
      .cloud {
        position: absolute;
        background:
          radial-gradient(circle at 28% 62%, rgba(205,214,244,.80) 0 30px, rgba(205,214,244,0) 31px),
          radial-gradient(circle at 52% 44%, rgba(205,214,244,.86) 0 39px, rgba(205,214,244,0) 40px),
          radial-gradient(circle at 76% 64%, rgba(205,214,244,.74) 0 27px, rgba(205,214,244,0) 28px),
          linear-gradient(to top, rgba(205,214,244,.68) 0 15px, rgba(205,214,244,0) 16px);
        background-size: cover;
        filter: blur(1.5px);
        will-change: transform;
        animation-name: sky-sail;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .cloud.warm {
        background:
          radial-gradient(circle at 28% 62%, rgba(255,196,158,.72) 0 30px, rgba(255,196,158,0) 31px),
          radial-gradient(circle at 52% 44%, rgba(255,206,172,.78) 0 39px, rgba(255,206,172,0) 40px),
          radial-gradient(circle at 76% 64%, rgba(255,186,150,.66) 0 27px, rgba(255,186,150,0) 28px),
          linear-gradient(to top, rgba(255,196,158,.60) 0 15px, rgba(255,196,158,0) 16px);
      }
      .cloud.night {
        background:
          radial-gradient(circle at 28% 62%, rgba(120,130,165,.55) 0 30px, rgba(120,130,165,0) 31px),
          radial-gradient(circle at 52% 44%, rgba(126,136,172,.62) 0 39px, rgba(126,136,172,0) 40px),
          radial-gradient(circle at 76% 64%, rgba(114,124,158,.50) 0 27px, rgba(114,124,158,0) 28px),
          linear-gradient(to top, rgba(120,130,165,.46) 0 15px, rgba(120,130,165,0) 16px);
      }

      /* Zwei Vögel, nur bei ruhigem Wetter am Tag */
      .bird {
        position: absolute; width: 26px; height: 13px;
        background-color: rgba(30,40,60,.55);
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='13'><path d='M2 9 C6 2 9 2 13 8 C17 2 20 2 24 9' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>") no-repeat center / contain;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='13'><path d='M2 9 C6 2 9 2 13 8 C17 2 20 2 24 9' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>") no-repeat center / contain;
        will-change: transform;
      }
      .bird.b1 { top: 21%; animation: sky-fly 128s linear infinite; }
      .bird.b2 { top: 25%; transform: scale(.72); animation: sky-fly 155s linear infinite; animation-delay: -44s; }

      /* ══ NIEDERSCHLAG ══ echte Tropfen: fallen, treffen auf, zerplatzen ══
         Jede Bahn ist ein unsichtbarer Marker AM AUFSCHLAGPUNKT. Der Tropfen
         (::before) kommt von oben zu ihm hin, der Aufschlag (::after) sitzt genau
         auf ihm. Beide teilen Dauer und Versatz - deshalb zerplatzt es exakt beim
         Auftreffen, ganz ohne Zeitsteuerung in JavaScript. Bewegt werden nur
         transform und opacity; die Neigung liegt in der BAHN, nicht in der Form. */
      .rainlane { position: absolute; width: 0; height: 0; pointer-events: none; }
      .rainlane::before {
        content: ""; position: absolute; left: 0; top: 0;
        width: var(--w,3px); height: var(--h,15px);
        border-radius: 50% 50% 46% 46% / 74% 74% 26% 26%;
        background: linear-gradient(180deg,
            rgba(205,214,244,.04) 0%, rgba(205,214,244,.48) 42%,
            rgba(233,239,250,.90) 76%, rgba(240,245,255,1) 100%);
        will-change: transform, opacity;
        animation: sky-drop var(--d,1.1s) linear infinite var(--t,0s);
      }
      /* Die Krone: zwei Ringe. Der zweite kommt aus box-shadow und wird EINMAL
         gezeichnet - bewegt wird nur skaliert und ausgeblendet. */
      .rainlane::after {
        content: ""; position: absolute; left: 0; bottom: 0;
        width: var(--sw,18px); height: calc(var(--sw,18px) * .32);
        margin-left: calc(var(--sw,18px) / -2); margin-bottom: -1px;
        border: 1.3px solid rgba(240,245,255,.70); border-radius: 50%;
        box-shadow: 0 0 0 2.6px rgba(240,245,255,.16);
        opacity: 0; will-change: transform, opacity;
        animation: sky-splash var(--d,1.1s) linear infinite var(--t,0s);
      }
      /* Die Ferne bekommt keinen Aufschlag - er waere kleiner als ein Bildpunkt. */
      .rainlane.far::after { display: none; }
      @keyframes sky-drop {
        0%   { transform: translate3d(var(--dx,12px), calc(var(--fall,90vh) * -1), 0) scaleY(.8); opacity: 0; }
        7%   { opacity: var(--o,.9); }
        90%  { opacity: var(--o,.9); }
        93%  { transform: translate3d(0,0,0) scaleY(1.15); opacity: var(--o,.9); }
        95%  { transform: translate3d(0,0,0) scale(1.9,.22); opacity: 0; }
        100% { transform: translate3d(0,0,0) scale(1.9,.22); opacity: 0; }
      }
      @keyframes sky-splash {
        0%,88% { transform: scale(.16,.45); opacity: 0; }
        93.5%  { transform: scale(.60,.95); opacity: .9; }
        100%   { transform: scale(1.7,1.25); opacity: 0; }
      }
      /* ══ SCHNEE ══ echte Flocken: taumeln herab und bleiben liegen ══════
         Gleiche Bauart wie der Regen - Marker am Aufschlagpunkt, Flocke als
         ::before, das Liegenbleiben als ::after. Der Seitwaerts-Versatz steckt
         in den Zwischenschritten der Bahn, deshalb pendelt die Flocke, statt
         schnurgerade zu fallen. Wieder nur transform und opacity. */
      .snowlane { position: absolute; width: 0; height: 0; pointer-events: none; }
      .snowlane::before {
        content: ""; position: absolute; left: 0; top: 0;
        width: var(--w,6px); height: var(--w,6px); border-radius: 50%;
        background: radial-gradient(circle at 40% 36%,
            #ffffff 0%, rgba(255,255,255,.86) 52%, rgba(255,255,255,0) 100%);
        will-change: transform, opacity;
        animation: sky-flake var(--d,9s) linear infinite var(--t,0s);
      }
      /* Kein Zerplatzen: die Flocke wird zu einem weichen Fleck und vergeht. */
      .snowlane::after {
        content: ""; position: absolute; left: 0; bottom: 0;
        width: var(--sw,14px); height: calc(var(--sw,14px) * .38);
        margin-left: calc(var(--sw,14px) / -2); margin-bottom: -2px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 62%,
            rgba(255,255,255,.92) 0%, rgba(255,255,255,0) 74%);
        opacity: 0; will-change: transform, opacity;
        animation: sky-settle var(--d,9s) linear infinite var(--t,0s);
      }
      .snowlane.far::after { display: none; }
      @keyframes sky-flake {
        0%   { transform: translate3d(calc(var(--dx,20px) * -1), calc(var(--fall,90vh) * -1), 0); opacity: 0; }
        6%   { opacity: var(--o,.9); }
        25%  { transform: translate3d(calc(var(--dx,20px) * .65), calc(var(--fall,90vh) * -.73), 0); }
        50%  { transform: translate3d(calc(var(--dx,20px) * -.85), calc(var(--fall,90vh) * -.49), 0); }
        75%  { transform: translate3d(calc(var(--dx,20px) * .55), calc(var(--fall,90vh) * -.24), 0); }
        92%  { transform: translate3d(0,0,0); opacity: var(--o,.9); }
        97%  { transform: translate3d(0,0,0) scale(.65); opacity: 0; }
        100% { transform: translate3d(0,0,0) scale(.65); opacity: 0; }
      }
      @keyframes sky-settle {
        0%,90% { transform: scale(.3,.4); opacity: 0; }
        94%    { transform: scale(1,1); opacity: .78; }
        100%   { transform: scale(1.18,1.06); opacity: 0; }
      }
      .fogband {
        position: absolute; left: -20%; right: -20%; height: 22%;
        background: linear-gradient(180deg, rgba(226,232,240,0), rgba(226,232,240,.30), rgba(226,232,240,0));
        will-change: transform;
      }
      .fogband.f1 { top: 38%; animation: sky-fog 90s ease-in-out infinite alternate; }
      .fogband.f2 { top: 58%; opacity: .7; animation: sky-fog 130s ease-in-out infinite alternate-reverse; }
      .flash {
        position: absolute; inset: 0;
        background: radial-gradient(58% 42% at 62% 16%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%);
        opacity: 0; will-change: opacity;
        animation: sky-flash 11s linear infinite;
      }

      /* ══ BODEN ══ leichte Wiese, Farbe folgt der Jahreszeit ═══════════ */
      .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 27%; }
      .ground.spring { --meadow-far: #6f9f57; --meadow-near: #8fc76c; --grass: #7ab760; --tree: #3f6b3a; }
      .ground.summer { --meadow-far: #55913f; --meadow-near: #7cb654; --grass: #6aa94a; --tree: #2f5c31; }
      .ground.autumn { --meadow-far: #8a7538; --meadow-near: #c69d50; --grass: #ae9249; --tree: #6b4a24; }
      .ground.winter { --meadow-far: #b3c1d0; --meadow-near: #e7eef5; --grass: #a6b6c3; --tree: #3d4a58; }

      /* Baumreihe am Horizont — von Hand gezeichnete Kronen, als Maske
         eingefärbt, damit eine SVG-Form für alle Jahreszeiten reicht. */
      .ground .treeline {
        position: absolute; left: 0; right: 0; top: -46px; height: 74px;
        background-color: var(--tree); opacity: .92;
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='74'><g fill='white'><path d='M0 74 L0 58 C10 58 12 44 22 44 C32 44 34 56 44 57 L44 74Z'/><ellipse cx='72' cy='50' rx='26' ry='19'/><rect x='68' y='52' width='8' height='22'/><path d='M112 74 L104 74 L108 40 L112 74Z'/><path d='M96 52 L108 26 L120 52Z'/><path d='M100 62 L108 40 L116 62Z'/><ellipse cx='152' cy='54' rx='30' ry='21'/><rect x='148' y='56' width='9' height='18'/><ellipse cx='206' cy='48' rx='22' ry='17'/><rect x='202' y='50' width='7' height='24'/><path d='M244 74 L236 74 L240 34 L244 74Z'/><path d='M228 50 L240 20 L252 50Z'/><path d='M232 62 L240 38 L248 62Z'/><ellipse cx='288' cy='53' rx='28' ry='20'/><rect x='284' y='55' width='8' height='19'/><ellipse cx='336' cy='49' rx='20' ry='16'/><rect x='333' y='51' width='7' height='23'/><path d='M380 74 L372 74 L376 42 L380 74Z'/><path d='M364 54 L376 28 L388 54Z'/><ellipse cx='412' cy='55' rx='24' ry='18'/></g></svg>") repeat-x bottom / 420px 74px;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='74'><g fill='white'><path d='M0 74 L0 58 C10 58 12 44 22 44 C32 44 34 56 44 57 L44 74Z'/><ellipse cx='72' cy='50' rx='26' ry='19'/><rect x='68' y='52' width='8' height='22'/><path d='M112 74 L104 74 L108 40 L112 74Z'/><path d='M96 52 L108 26 L120 52Z'/><path d='M100 62 L108 40 L116 62Z'/><ellipse cx='152' cy='54' rx='30' ry='21'/><rect x='148' y='56' width='9' height='18'/><ellipse cx='206' cy='48' rx='22' ry='17'/><rect x='202' y='50' width='7' height='24'/><path d='M244 74 L236 74 L240 34 L244 74Z'/><path d='M228 50 L240 20 L252 50Z'/><path d='M232 62 L240 38 L248 62Z'/><ellipse cx='288' cy='53' rx='28' ry='20'/><rect x='284' y='55' width='8' height='19'/><ellipse cx='336' cy='49' rx='20' ry='16'/><rect x='333' y='51' width='7' height='23'/><path d='M380 74 L372 74 L376 42 L380 74Z'/><path d='M364 54 L376 28 L388 54Z'/><ellipse cx='412' cy='55' rx='24' ry='18'/></g></svg>") repeat-x bottom / 420px 74px;
      }
      .ground .meadow {
        position: absolute; inset: 0;
        background:
          radial-gradient(120% 60% at 30% 0%, rgba(255,255,255,.14), transparent 60%),
          linear-gradient(180deg, var(--meadow-far) 0%, var(--meadow-near) 100%);
      }
      /* Blumen: gestreute Punkte, je Jahreszeit andere Farben */
      .ground .flowers { position: absolute; inset: 0; opacity: .85; }
      .ground.spring .flowers {
        background-image:
          radial-gradient(circle, #ffffff 0 2.2px, transparent 3px),
          radial-gradient(circle, #f9e2af 0 2px, transparent 2.8px),
          radial-gradient(circle, #f5c2e7 0 1.8px, transparent 2.6px);
        background-size: 96px 62px, 138px 84px, 172px 108px;
        background-position: 14px 26px, 62px 12px, 110px 48px;
      }
      .ground.summer .flowers {
        background-image:
          radial-gradient(circle, #f38ba8 0 2.4px, transparent 3.2px),
          radial-gradient(circle, #ffffff 0 2px, transparent 2.8px),
          radial-gradient(circle, #f9e2af 0 1.8px, transparent 2.6px);
        background-size: 118px 70px, 88px 56px, 164px 96px;
        background-position: 22px 30px, 54px 16px, 96px 54px;
      }
      .ground.autumn .flowers {
        background-image:
          radial-gradient(circle, #e8b45c 0 2px, transparent 2.8px),
          radial-gradient(circle, #d08b4a 0 1.6px, transparent 2.4px);
        background-size: 132px 78px, 186px 112px;
        background-position: 26px 34px, 88px 60px;
        opacity: .6;
      }
      .ground.winter .flowers { opacity: 0; }
      /* Grashalme an der Unterkante, ganz leicht im Wind */
      .ground .grass {
        position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
        background-color: var(--grass);
        transform-origin: bottom center; will-change: transform;
        animation: sky-sway 11s ease-in-out infinite;
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='210' height='44'><g fill='white'><path d='M6 44 C9 30 3 22 11 8 C8 24 12 32 12 44Z'/><path d='M24 44 C26 34 22 26 28 16 C26 28 30 34 30 44Z'/><path d='M44 44 C48 28 40 20 50 4 C45 22 52 32 50 44Z'/><path d='M66 44 C68 36 64 28 70 20 C68 30 72 36 72 44Z'/><path d='M86 44 C90 30 82 22 92 10 C87 26 94 34 92 44Z'/><path d='M108 44 C110 34 106 26 112 14 C110 28 114 34 114 44Z'/><path d='M128 44 C132 32 124 24 134 12 C129 28 136 34 134 44Z'/><path d='M150 44 C152 36 148 28 154 18 C152 30 156 36 156 44Z'/><path d='M170 44 C174 28 166 20 176 6 C171 24 178 32 176 44Z'/><path d='M192 44 C194 34 190 26 196 16 C194 28 198 34 198 44Z'/></g></svg>") repeat-x bottom / 210px 44px;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='210' height='44'><g fill='white'><path d='M6 44 C9 30 3 22 11 8 C8 24 12 32 12 44Z'/><path d='M24 44 C26 34 22 26 28 16 C26 28 30 34 30 44Z'/><path d='M44 44 C48 28 40 20 50 4 C45 22 52 32 50 44Z'/><path d='M66 44 C68 36 64 28 70 20 C68 30 72 36 72 44Z'/><path d='M86 44 C90 30 82 22 92 10 C87 26 94 34 92 44Z'/><path d='M108 44 C110 34 106 26 112 14 C110 28 114 34 114 44Z'/><path d='M128 44 C132 32 124 24 134 12 C129 28 136 34 134 44Z'/><path d='M150 44 C152 36 148 28 154 18 C152 30 156 36 156 44Z'/><path d='M170 44 C174 28 166 20 176 6 C171 24 178 32 176 44Z'/><path d='M192 44 C194 34 190 26 196 16 C194 28 198 34 198 44Z'/></g></svg>") repeat-x bottom / 210px 44px;
      }
      .ground.winter .grass { height: 30px; opacity: .75; }
      /* Abend/Nacht legen sich als ruhige Decke über die Wiese */
      .ground.dusk::after, .ground.night::after {
        content: ""; position: absolute; left: 0; right: 0; top: -46px; bottom: 0;
        pointer-events: none;
      }
      .ground.dusk::after  { background: linear-gradient(180deg, rgba(74,38,58,.60), rgba(26,16,32,.78)); }
      .ground.night::after { background: linear-gradient(180deg, rgba(12,14,30,.82), rgba(8,9,20,.93)); }

      /* Fallende Blätter im Herbst */
      .leaf {
        position: absolute; width: 9px; height: 6px; border-radius: 60% 40% 55% 45%;
        background: #d08b4a; opacity: .8; will-change: transform;
      }
      .leaf.l1 { left: 18%; top: -50%; animation: sky-leaf 17s linear infinite; }
      .leaf.l2 { left: 52%; top: -50%; background: #c2703c; animation: sky-leaf 23s linear infinite; animation-delay: -9s; }
      .leaf.l3 { left: 78%; top: -50%; background: #e8b45c; animation: sky-leaf 20s linear infinite; animation-delay: -15s; }
      /* Glühwürmchen in Sommernächten */
      .firefly {
        position: absolute; width: 5px; height: 5px; border-radius: 50%;
        background: radial-gradient(circle, #f9e2af 0%, rgba(249,226,175,0) 70%);
        will-change: transform, opacity;
      }
      .firefly.f1 { left: 16%; bottom: 34%; animation: sky-blink 5.5s ease-in-out infinite, sky-hover 19s ease-in-out infinite; }
      .firefly.f2 { left: 38%; bottom: 20%; animation: sky-blink 7s ease-in-out infinite 1.5s, sky-hover 24s ease-in-out infinite reverse; }
      .firefly.f3 { left: 63%; bottom: 41%; animation: sky-blink 6.2s ease-in-out infinite .8s, sky-hover 21s ease-in-out infinite; }
      .firefly.f4 { left: 84%; bottom: 26%; animation: sky-blink 8s ease-in-out infinite 2.4s, sky-hover 27s ease-in-out infinite reverse; }

      @keyframes sky-drift-a { from { transform: translate3d(0,0,0); }     to { transform: translate3d(-180px,-70px,0); } }
      @keyframes sky-drift-b { from { transform: translate3d(0,0,0); }     to { transform: translate3d(120px,60px,0); } }
      @keyframes sky-twinkle { from { opacity: .25; }                      to { opacity: .8; } }
      @keyframes sky-breath  { 0%,100% { opacity: .85; }                   50% { opacity: 1; } }
      @keyframes sky-spin    { to { transform: rotate(360deg); } }
      @keyframes sky-sail    { from { transform: translate3d(-32vw,0,0); } to { transform: translate3d(114vw,0,0); } }
      @keyframes sky-fly     { from { transform: translate3d(-10vw,0,0); } to { transform: translate3d(112vw,-40px,0); } }
      @keyframes sky-fog     { from { transform: translate3d(-6%,0,0); }   to { transform: translate3d(6%,0,0); } }
      @keyframes sky-flash   { 0%,92%,100% { opacity: 0; } 93% { opacity: .85; } 94% { opacity: .12; } 95% { opacity: .65; } 96.5% { opacity: 0; } }
      @keyframes sky-sway    { 0%,100% { transform: skewX(0deg); }         50% { transform: skewX(2.2deg); } }
      @keyframes sky-leaf    { from { transform: translate3d(0,0,0) rotate(0deg); } to { transform: translate3d(-70px, 150vh, 0) rotate(540deg); } }
      @keyframes sky-blink   { 0%,100% { opacity: .15; }                   50% { opacity: 1; } }
      @keyframes sky-hover   { 0%,100% { transform: translate3d(0,0,0); }  50% { transform: translate3d(26px,-18px,0); } }

      @media (prefers-reduced-motion: reduce) {
        .stars, .stars2, .moon, .sun, .rays, .cloud, .bird,
        .rainlane::before, .rainlane::after,
      .snowlane::before, .snowlane::after,
      .fogband, .flash, .grass, .leaf, .firefly { animation: none !important; }
      }
      /* Schutz vor dem Glas-Helfer: der Himmel bleibt eine feste Ebene ohne Glanz */
      ha-card { position: fixed !important; }
      ha-card::before { content: none !important; }

        .moonwrap {
          position: absolute;
          width: 132px; height: 132px;
          margin: -66px 0 0 -66px;
          pointer-events: none;
          filter: drop-shadow(0 0 18px rgba(249,226,175,.28));
          transition: left 2s linear, top 2s linear;
        }
        .moondisc { width: 100%; height: 100%; display: block; }

  aurora_light:
    template: aurora_base
    show_state: true
    show_name: true
    size: 28px
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    state_display: "[[[\n  if (entity && entity.state === 'on') {\n    const b = entity.attributes.brightness;\n    return b ? Math.round(b / 2.55) + ' %' : 'AN';\n  }\n  return entity && entity.state === 'unavailable' ? '—' : 'AUS';\n]]]\n"
    styles:
      grid:
      - grid-template-areas: '''i'' ''n'' ''s'''
      - grid-template-rows: 1fr min-content min-content
      card:
      - height: 118px
      - padding: 12px 8px
      - transition: all .25s ease
      img_cell:
      - width: 46px
      - height: 46px
      - margin: 0 auto
      - border-radius: 50%
      - background: "[[[\n\n  const A = entity ? entity.attributes : {};\n  const M = A.supported_color_modes || [];\n  const kannFarbe = M.some(m => ['hs','xy','rgb','rgbw','rgbww','rgbwww'].indexOf(m) >= 0);\n  const kannWeiss = M.indexOf('color_temp') >= 0;\n  const GELB = [249,226,175];\n  /* Farbtemperatur → sichtbarer Weisston. Bewusst KEINE physikalische Umrechnung:\n     6500 K ist in RGB fast reines Weiss und waere von 4000 K nicht zu unterscheiden.\n     Diese Rampe spreizt warm→kalt so, dass man es auf einen Blick sieht. */\n  const ct = (k) => {\n    const WARM = [255,176,110], MITTE = [255,250,244], KALT = [188,216,255];\n    const x = Math.max(2000, Math.min(6500, k));\n    if (x <= 4000) { const f = (x - 2000) / 2000; return WARM.map((v, i) => Math.round(v + (MITTE[i] - v) * f)); }\n    const f = (x - 4000) / 2500; return MITTE.map((v, i) => Math.round(v + (KALT[i] - v) * f));\n  };\n  /* Lesbar auf dunklem Glas: auf volle Helligkeit normieren, dann 35 % Richtung Weiss\n     mischen. Der Farbton (die Information) bleibt, das Pastell passt zu Catppuccin. */\n  const weich = (c) => { const m = Math.max(c[0], c[1], c[2], 1); const f = 255 / m;\n    return c.map((x) => { const y = Math.min(255, x * f); return Math.round(y + (255 - y) * 0.35); }); };\n  /* Eine Farblampe im Weissmodus meldet AUCH rgb_color (umgerechnet) — dann zaehlt\n     die Farbtemperatur, sonst saehe jedes warme Weiss wie ein blasses Orange aus. */\n  const F = (A.color_mode === 'color_temp' && A.color_temp_kelvin) ? ct(A.color_temp_kelvin)\n          : (A.rgb_color ? weich(A.rgb_color)\n          : (A.color_temp_kelvin ? ct(A.color_temp_kelvin) : GELB));\n  const rgb = (a) => 'rgba(' + F[0] + ',' + F[1] + ',' + F[2] + ',' + a + ')';\n  /* 0..1 — bei nicht dimmbaren Lampen zaehlt AN als volle Helligkeit. */\n  const h = A.brightness != null ? A.brightness / 255 : 1;\n/* \U0001F534 Auch AUS soll man sehen, was die Lampe KANN (Roberts Wunsch):\n     Farblampe = zarter Farbkreis, Weisston-Lampe = warm→kalt, sonst neutral. */\n  if (kannFarbe) return 'conic-gradient(rgba(243,139,168,0.34), rgba(250,179,135,0.34), rgba(249,226,175,0.34), rgba(166,227,161,0.34), rgba(137,220,235,0.34), rgba(203,166,247,0.34), rgba(243,139,168,0.34))';\n  if (kannWeiss) return 'linear-gradient(100deg, rgba(255,190,120,0.30), rgba(190,220,255,0.30))';\n  return 'rgba(88,91,112,0.18)';\n]]]\n"
      - transition: background .3s ease, box-shadow .3s ease
      icon:
      - color: '#585b70'
      - transition: color .3s ease, filter .3s ease
      name:
      - font-size: 12px
      - margin-top: 6px
      - white-space: normal
      - line-height: 1.15
      state:
      - font-size: 10.5px
      - font-family: ui-monospace, 'SF Mono', Menlo, monospace
