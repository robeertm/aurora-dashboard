  # ═════════════════════════ 2 · SMART HOME (overview) ═════════════════════════
  # Light landing page: key figures plus one tile per room that navigates to
  # that room's own view. The details deliberately live in separate views —
  # one giant view with every room measured ~73 % CPU while idle, split up it
  # is under 30 %. Browsers pay for every card that exists, not just visible ones.
- title: Smart Home
  path: smarthome
  icon: mdi:home-automation
  theme: Aurora
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:button-card
      template: aurora_sky
      grid_options:
        columns: full
    - type: grid
      grid_options:
        columns: full
      columns: 5
      square: false
      cards:
      - type: custom:button-card
        template: aurora_chip
        icon: mdi:thermometer
        label: "Avg room temp"
        name: |
          [[[ const vs=Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.room_temp_')).map(_i=>hass.states[_i]).filter(s=>s.entity_id.startsWith('sensor.room_temp_')).map(s=>parseFloat(s.state)).filter(v=>!isNaN(v));return vs.length?(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1)+' °C':'—'; ]]]
        styles:
          icon:
          - color: "#94e2d5"
      - type: custom:button-card
        template: aurora_chip
        icon: mdi:radiator
        label: "Heating active"
        name: |
          [[[ return String(Object.keys(hass.states).filter(_i=>_i.startsWith('climate.')).map(_i=>hass.states[_i]).filter(s=>s.entity_id.startsWith('climate.')&&s.state==='heat').length); ]]]
        styles:
          icon:
          - color: "#fab387"
      - type: custom:button-card
        template: aurora_chip
        icon: mdi:lightbulb-group
        label: "Lights on"
        name: |
          [[[ return String(Object.keys(hass.states).filter(_i=>_i.startsWith('light.')).map(_i=>hass.states[_i]).filter(s=>s.entity_id.startsWith('light.')&&s.state==='on').length); ]]]
        styles:
          icon:
          - color: "#f9e2af"
      - type: custom:button-card
        template: aurora_chip
        icon: mdi:robot
        label: "Automations on"
        name: |
          [[[ return String(Object.keys(hass.states).filter(_i=>_i.startsWith('automation.')).map(_i=>hass.states[_i]).filter(s=>s.entity_id.startsWith('automation.')&&s.state==='on').length); ]]]
        styles:
          icon:
          - color: "#a6e3a1"
      - type: custom:button-card
        template: aurora_chip
        icon: mdi:window-open-variant
        label: "Windows open"
        name: |
          [[[ return String(Object.keys(hass.states).filter(_i=>_i.startsWith('binary_sensor.')).map(_i=>hass.states[_i]).filter(s=>s.entity_id.startsWith('binary_sensor.')&&['door','window','opening'].includes(s.attributes.device_class)&&s.state==='on').length); ]]]
        styles:
          icon:
          - color: "#f38ba8"
  - type: grid
    column_span: 3
