          state_display: |
            [[[ const v = parseFloat(entity.state); return isNaN(v) ? '—' : v.toFixed(2) + ' kWh'; ]]]
          variables:
            accent: "#94e2d5"
        - type: custom:apexcharts-card
          graph_span: 14d
          span:
            end: day
          header:
            show: false
          apex_config:
            chart:
              height: 230
              animations: *apex_anim
              dropShadow:
                enabled: true
                top: 0
                left: 0
                blur: 6
                opacity: 0.7
                color: "#94e2d5"
            grid: *apex_grid
            plotOptions:
              bar:
                borderRadius: 4
                columnWidth: "55%"
          series:
          - entity: sensor.total_energy_today
            name: kWh / day
            type: column
            color: "#94e2d5"
            group_by:
              func: max
              duration: 1d
          - entity: sensor.total_energy_today
            name: scan
            type: line
            color: "#94e2d5"
            stroke_width: 3
            group_by:
