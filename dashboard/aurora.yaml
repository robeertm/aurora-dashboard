        img_cell:
        - background: "[[[\n\n  const A = entity ? entity.attributes : {};\n  const M = A.supported_color_modes || [];\n  const kannFarbe = M.some(m => ['hs','xy','rgb','rgbw','rgbww','rgbwww'].indexOf(m) >= 0);\n  const kannWeiss = M.indexOf('color_temp') >= 0;\n  const GELB = [249,226,175];\n  /* Farbtemperatur → sichtbarer Weisston. Bewusst KEINE physikalische Umrechnung:\n     6500 K ist in RGB fast reines Weiss und waere von 4000 K nicht zu unterscheiden.\n     Diese Rampe spreizt warm→kalt so, dass man es auf einen Blick sieht. */\n  const ct = (k) => {\n    const WARM = [255,176,110], MITTE = [255,250,244], KALT = [188,216,255];\n    const x = Math.max(2000, Math.min(6500, k));\n    if (x <= 4000) { const f = (x - 2000) / 2000; return WARM.map((v, i) => Math.round(v + (MITTE[i] - v) * f)); }\n    const f = (x - 4000) / 2500; return MITTE.map((v, i) => Math.round(v + (KALT[i] - v) * f));\n  };\n  /* Lesbar auf dunklem Glas: auf volle Helligkeit normieren, dann 35 % Richtung Weiss\n     mischen. Der Farbton (die Information) bleibt, das Pastell passt zu Catppuccin. */\n  const weich = (c) => { const m = Math.max(c[0], c[1], c[2], 1); const f = 255 / m;\n    return c.map((x) => { const y = Math.min(255, x * f); return Math.round(y + (255 - y) * 0.35); }); };\n  /* Eine Farblampe im Weissmodus meldet AUCH rgb_color (umgerechnet) — dann zaehlt\n     die Farbtemperatur, sonst saehe jedes warme Weiss wie ein blasses Orange aus. */\n  const F = (A.color_mode === 'color_temp' && A.color_temp_kelvin) ? ct(A.color_temp_kelvin)\n          : (A.rgb_color ? weich(A.rgb_color)\n          : (A.color_temp_kelvin ? ct(A.color_temp_kelvin) : GELB));\n  const rgb = (a) => 'rgba(' + F[0] + ',' + F[1] + ',' + F[2] + ',' + a + ')';\n  /* 0..1 — bei nicht dimmbaren Lampen zaehlt AN als volle Helligkeit. */\n  const h = A.brightness != null ? A.brightness / 255 : 1;\n/* Fuellstand wie in einem Glas: die Hoehe der Fuellung IST die Helligkeit.\n     Auf einen Blick hell/dunkel, ohne die Prozentzahl lesen zu muessen. */\n  const p = Math.round(Math.max(4, Math.min(100, h * 100)));\n  return 'linear-gradient(to top, ' + rgb(0.42) + ' 0%, ' + rgb(0.42) + ' ' + p + '%, '\n       + (kannFarbe ? 'rgba(255,255,255,0.05)' : 'rgba(88,91,112,0.16)') + ' ' + p + '%, '\n       + (kannFarbe ? 'rgba(255,255,255,0.05)' : 'rgba(88,91,112,0.16)') + ' 100%)';\n]]]\n"
        - box-shadow: "[[[\n\n  const A = entity ? entity.attributes : {};\n  const M = A.supported_color_modes || [];\n  const kannFarbe = M.some(m => ['hs','xy','rgb','rgbw','rgbww','rgbwww'].indexOf(m) >= 0);\n  const kannWeiss = M.indexOf('color_temp') >= 0;\n  const GELB = [249,226,175];\n  /* Farbtemperatur → sichtbarer Weisston. Bewusst KEINE physikalische Umrechnung:\n     6500 K ist in RGB fast reines Weiss und waere von 4000 K nicht zu unterscheiden.\n     Diese Rampe spreizt warm→kalt so, dass man es auf einen Blick sieht. */\n  const ct = (k) => {\n    const WARM = [255,176,110], MITTE = [255,250,244], KALT = [188,216,255];\n    const x = Math.max(2000, Math.min(6500, k));\n    if (x <= 4000) { const f = (x - 2000) / 2000; return WARM.map((v, i) => Math.round(v + (MITTE[i] - v) * f)); }\n    const f = (x - 4000) / 2500; return MITTE.map((v, i) => Math.round(v + (KALT[i] - v) * f));\n  };\n  /* Lesbar auf dunklem Glas: auf volle Helligkeit normieren, dann 35 % Richtung Weiss\n     mischen. Der Farbton (die Information) bleibt, das Pastell passt zu Catppuccin. */\n  const weich = (c) => { const m = Math.max(c[0], c[1], c[2], 1); const f = 255 / m;\n    return c.map((x) => { const y = Math.min(255, x * f); return Math.round(y + (255 - y) * 0.35); }); };\n  /* Eine Farblampe im Weissmodus meldet AUCH rgb_color (umgerechnet) — dann zaehlt\n     die Farbtemperatur, sonst saehe jedes warme Weiss wie ein blasses Orange aus. */\n  const F = (A.color_mode === 'color_temp' && A.color_temp_kelvin) ? ct(A.color_temp_kelvin)\n          : (A.rgb_color ? weich(A.rgb_color)\n          : (A.color_temp_kelvin ? ct(A.color_temp_kelvin) : GELB));\n  const rgb = (a) => 'rgba(' + F[0] + ',' + F[1] + ',' + F[2] + ',' + a + ')';\n  /* 0..1 — bei nicht dimmbaren Lampen zaehlt AN als volle Helligkeit. */\n  const h = A.brightness != null ? A.brightness / 255 : 1;\nreturn 'inset 0 0 0 1px ' + rgb(0.30 + 0.35 * h);\n]]]\n"
        icon:
        - color: "[[[\n\n  const A = entity ? entity.attributes : {};\n  const M = A.supported_color_modes || [];\n  const kannFarbe = M.some(m => ['hs','xy','rgb','rgbw','rgbww','rgbwww'].indexOf(m) >= 0);\n  const kannWeiss = M.indexOf('color_temp') >= 0;\n  const GELB = [249,226,175];\n  /* Farbtemperatur → sichtbarer Weisston. Bewusst KEINE physikalische Umrechnung:\n     6500 K ist in RGB fast reines Weiss und waere von 4000 K nicht zu unterscheiden.\n     Diese Rampe spreizt warm→kalt so, dass man es auf einen Blick sieht. */\n  const ct = (k) => {\n    const WARM = [255,176,110], MITTE = [255,250,244], KALT = [188,216,255];\n    const x = Math.max(2000, Math.min(6500, k));\n    if (x <= 4000) { const f = (x - 2000) / 2000; return WARM.map((v, i) => Math.round(v + (MITTE[i] - v) * f)); }\n    const f = (x - 4000) / 2500; return MITTE.map((v, i) => Math.round(v + (KALT[i] - v) * f));\n  };\n  /* Lesbar auf dunklem Glas: auf volle Helligkeit normieren, dann 35 % Richtung Weiss\n     mischen. Der Farbton (die Information) bleibt, das Pastell passt zu Catppuccin. */\n  const weich = (c) => { const m = Math.max(c[0], c[1], c[2], 1); const f = 255 / m;\n    return c.map((x) => { const y = Math.min(255, x * f); return Math.round(y + (255 - y) * 0.35); }); };\n  /* Eine Farblampe im Weissmodus meldet AUCH rgb_color (umgerechnet) — dann zaehlt\n     die Farbtemperatur, sonst saehe jedes warme Weiss wie ein blasses Orange aus. */\n  const F = (A.color_mode === 'color_temp' && A.color_temp_kelvin) ? ct(A.color_temp_kelvin)\n          : (A.rgb_color ? weich(A.rgb_color)\n          : (A.color_temp_kelvin ? ct(A.color_temp_kelvin) : GELB));\n  const rgb = (a) => 'rgba(' + F[0] + ',' + F[1] + ',' + F[2] + ',' + a + ')';\n  /* 0..1 — bei nicht dimmbaren Lampen zaehlt AN als volle Helligkeit. */\n  const h = A.brightness != null ? A.brightness / 255 : 1;\nreturn rgb(1);\n]]]\n"
        - filter: "[[[\n\n  const A = entity ? entity.attributes : {};\n  const M = A.supported_color_modes || [];\n  const kannFarbe = M.some(m => ['hs','xy','rgb','rgbw','rgbww','rgbwww'].indexOf(m) >= 0);\n  const kannWeiss = M.indexOf('color_temp') >= 0;\n  const GELB = [249,226,175];\n  /* Farbtemperatur → sichtbarer Weisston. Bewusst KEINE physikalische Umrechnung:\n     6500 K ist in RGB fast reines Weiss und waere von 4000 K nicht zu unterscheiden.\n     Diese Rampe spreizt warm→kalt so, dass man es auf einen Blick sieht. */\n  const ct = (k) => {\n    const WARM = [255,176,110], MITTE = [255,250,244], KALT = [188,216,255];\n    const x = Math.max(2000, Math.min(6500, k));\n    if (x <= 4000) { const f = (x - 2000) / 2000; return WARM.map((v, i) => Math.round(v + (MITTE[i] - v) * f)); }\n    const f = (x - 4000) / 2500; return MITTE.map((v, i) => Math.round(v + (KALT[i] - v) * f));\n  };\n  /* Lesbar auf dunklem Glas: auf volle Helligkeit normieren, dann 35 % Richtung Weiss\n     mischen. Der Farbton (die Information) bleibt, das Pastell passt zu Catppuccin. */\n  const weich = (c) => { const m = Math.max(c[0], c[1], c[2], 1); const f = 255 / m;\n    return c.map((x) => { const y = Math.min(255, x * f); return Math.round(y + (255 - y) * 0.35); }); };\n  /* Eine Farblampe im Weissmodus meldet AUCH rgb_color (umgerechnet) — dann zaehlt\n     die Farbtemperatur, sonst saehe jedes warme Weiss wie ein blasses Orange aus. */\n  const F = (A.color_mode === 'color_temp' && A.color_temp_kelvin) ? ct(A.color_temp_kelvin)\n          : (A.rgb_color ? weich(A.rgb_color)\n          : (A.color_temp_kelvin ? ct(A.color_temp_kelvin) : GELB));\n  const rgb = (a) => 'rgba(' + F[0] + ',' + F[1] + ',' + F[2] + ',' + a + ')';\n  /* 0..1 — bei nicht dimmbaren Lampen zaehlt AN als volle Helligkeit. */\n  const h = A.brightness != null ? A.brightness / 255 : 1;\nreturn 'drop-shadow(0 0 ' + (3 + 9 * h).toFixed(1) + 'px ' + rgb(0.30 + 0.60 * h) + ')';\n]]]\n"
        - animation: "[[[\n  const d = (entity.entity_id.length % 4) * 0.5;\n  const f = (entity.entity_id.length % 7) * 1.3;\n  return 'aurora-breathe 2.8s ease-in-out ' + d + 's infinite, aurora-flicker 9s ease-in-out -' + f + 's infinite';\n]]]\n"
  aurora_switch:
    template: aurora_light
    state:
    - value: "on"
      styles:
        card:
        - "--aurora-glow": "#a6e3a1"
        - border: 1px solid rgba(166,227,161,0.35)
        - box-shadow: "0 0 30px -8px rgba(166,227,161,0.4), 0 10px 40px -12px rgba(0,0,0,0.65)"
        - "--aurora-halo-anim": "aurora-halo-strong 2.4s ease-out infinite"
        - "--aurora-halo-width": "3px"
        img_cell:
        - background: "rgba(166,227,161,0.12)"
        icon:
        - color: "#a6e3a1"
        - animation: aurora-breathe 2.8s ease-in-out infinite

  aurora_scene:
    template: aurora_base
    show_icon: true
    show_name: true
    icon: mdi:palette
    size: 20px
    tap_action:
      action: toggle
    styles:
      grid:
      - grid-template-areas: "'i n'"
      - grid-template-columns: 32px 1fr
      card:
      - min-height: 54px
      - padding: 8px 12px
      icon:
      - color: "#cba6f7"
      - animation: |
          [[[
            const d = (entity.entity_id.length % 9) * 0.8;
            return 'aurora-shimmer 6s ease-in-out ' + d + 's infinite';
          ]]]
      name:
      - justify-self: start
      - text-align: left
      - font-size: 11.5px
      - white-space: normal
      - line-height: 1.2

  aurora_person:
    template: aurora_base
    show_entity_picture: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    state_display: |
      [[[
        if (entity.state === 'home') return 'Home';
        if (entity.state === 'not_home') return 'Away';
        return entity.state;
      ]]]
    styles:
      grid:
      - grid-template-areas: "'i' 'n' 's'"
      - grid-template-rows: 1fr min-content min-content
      card:
      - height: 132px
      - padding: 14px 8px
      entity_picture:
      - width: 58px
      - height: 58px
      - border-radius: 50%
      - border: "2px solid #585b70"
      - transition: all .3s ease
      name:
      - font-size: 13px
      - margin-top: 8px
      state:
      - font-size: 10.5px
      - color: "#a6adc8"
      - letter-spacing: .06em
      - text-transform: uppercase
    state:
    - value: home
      styles:
        entity_picture:
        - border: "2px solid #a6e3a1"
        - box-shadow: 0 0 18px -2px rgba(166,227,161,0.55)
        state:
        - color: "#a6e3a1"
    - value: not_home
      styles:
        entity_picture:
        - filter: grayscale(60%)

  aurora_window:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: true
    size: 24px
    tap_action:
      action: more-info
    state_display: |
      [[[ return entity.state === 'on' ? 'OPEN' : 'CLOSED'; ]]]
    styles:
      grid:
      - grid-template-areas: "'i n' 'i s'"
      - grid-template-columns: 44px 1fr
      card:
      - height: 62px
      - padding: 8px 12px
      icon:
      - color: "#a6e3a1"
      - animation: aurora-float 8s ease-in-out infinite
      name:
      - justify-self: start
      - align-self: end
      - text-align: left
      - font-size: 12px
      - white-space: normal
      - line-height: 1.1
      state:
      - justify-self: start
      - align-self: start
      - font-size: 10px
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - color: "#a6adc8"
      - letter-spacing: .1em
    state:
    - value: "on"
      styles:
        card:
        - border: 1px solid rgba(250,179,135,0.4)
        icon:
        - color: "#fab387"
        - animation: aurora-pulse 1.6s ease-in-out infinite
        state:
        - color: "#fab387"

  aurora_battery:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: true
    size: 24px
    tap_action:
      action: more-info
    styles:
      grid:
      - grid-template-areas: "'i s' 'i n'"
      - grid-template-columns: 44px 1fr
      card:
      - height: 62px
      - padding: 8px 12px
      icon:
      - color: |
          [[[
            const v = parseFloat(entity.state);
            if (isNaN(v)) return '#585b70';
            return v <= 20 ? '#f38ba8' : v <= 40 ? '#f9e2af' : '#a6e3a1';
          ]]]
      - animation: |
          [[[
            const v = parseFloat(entity.state);
            if (v <= 20) return 'aurora-pulse 1.2s ease-in-out infinite';
            if (v <= 40) return 'aurora-blink 3.4s ease-in-out infinite';
            const d = (entity.entity_id.length % 5) * 0.6;
            return 'aurora-float 8s ease-in-out ' + d + 's infinite';
          ]]]
      state:
      - justify-self: start
      - align-self: end
      - font-size: 16px
      - font-weight: 700
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      name:
      - justify-self: start
      - align-self: start
      - text-align: left
      - font-size: 10.5px
      - color: "#a6adc8"
      - white-space: normal
      - line-height: 1.1

  # Room header: icon + room name (mono uppercase) left, big glowing temperature
  # right, plus a pulsing "window open" line fed by a second entity (variables.window).
  aurora_room:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: true
    size: 22px
    # No `triggers_update: all` — that would re-render this card on EVERY state
    # change in the whole system. Bind the window sensor per instance instead.
    tap_action:
      action: more-info
    variables:
      accent: "#cba6f7"
      accent_bg: "rgba(203,166,247,0.10)"
      window: ""
    state_display: |
      [[[
        const v = parseFloat(entity ? entity.state : NaN);
        return isNaN(v) ? '' : v.toFixed(1) + ' °C';
      ]]]
    custom_fields:
      win: |
        [[[
          if (!variables.window) return '';
          const w = states[variables.window];
          return (w && w.state === 'on') ? '● WINDOW OPEN' : '';
        ]]]
    styles:
      grid:
      - grid-template-areas: "'i n s' 'i win s'"
      - grid-template-columns: 46px 1fr auto
      - grid-template-rows: min-content min-content
      card:
      - padding: 14px 16px 6px 16px
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: 0
      img_cell:
      - grid-area: i
      - width: 38px
      - height: 38px
      - border-radius: 12px
      - background: "[[[ return variables.accent_bg; ]]]"
      - align-self: center
      icon:
      - color: "[[[ return variables.accent; ]]]"
      - animation: aurora-bob 7s ease-in-out infinite
      name:
      - grid-area: n
      - justify-self: start
      - align-self: center
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: "clamp(11px, 3vw, 14px)"
      - font-weight: 700
      - letter-spacing: .14em
      - text-transform: uppercase
      - color: "#cdd6f4"
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - min-width: 0
      state:
      - grid-area: s
      - justify-self: end
      - align-self: center
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: "clamp(16px, 5vw, 24px)"
      - font-weight: 800
      - color: "[[[ return variables.accent; ]]]"
      - text-shadow: "[[[ return '0 0 14px ' + variables.accent + '80'; ]]]"
      custom_fields:
        win:
        - grid-area: win
        - justify-self: start
        - margin-top: 2px
        - font-size: 9.5px
        - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
        - letter-spacing: .12em
        - color: "#fab387"
          # own compositor layer — otherwise every pulse frame makes the browser
          # recompute the backdrop-filter of the whole room card
        - will-change: transform, opacity
          # Only pulse when a window is actually open. A permanent animation in
          # this large glass card measured ~9 % CPU on its own.
        - animation: |
            [[[
              if (!variables.window) return 'none';
              const w = states[variables.window];
              return (w && w.state === 'on') ? 'aurora-pulse 1.6s ease-in-out infinite' : 'none';
            ]]]

  # Small group header inside a room card (mono label + count).
    # On a phone the big temperature eats the room name ("LIVING ROOM" →
    # "LIV…"). Dial back letter-spacing and font sizes there. !important is
    # required because button-card writes these styles inline.
    extra_styles: |
      @media (max-width: 620px) {
        #name {
          font-size: 10px !important;
          letter-spacing: .02em !important;
          white-space: normal !important;
          overflow: visible !important;
          line-height: 1.15 !important;
        }
        #state { font-size: 17px !important; }
        #img-cell { width: 32px !important; height: 32px !important; }
      }

  aurora_group_header:
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    size: 15px
    tap_action:
      action: none
    variables:
      accent: "#cba6f7"
    styles:
      grid:
      - grid-template-areas: "'i n l'"
      - grid-template-columns: 26px 1fr auto
      card:
      - padding: 12px 16px 2px 16px
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: 0
      img_cell:
      - grid-area: i
      - justify-self: start
      icon:
      - color: "[[[ return variables.accent; ]]]"
      - animation: aurora-float 6s ease-in-out infinite
      name:
      - grid-area: n
      - justify-self: start
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: 10.5px
      - font-weight: 700
      - letter-spacing: .16em
      - text-transform: uppercase
      - color: "#a6adc8"
      label:
      - grid-area: l
      - justify-self: end
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: 11px
      - font-weight: 700
      - color: "[[[ return variables.accent; ]]]"
      - opacity: "0.85"

  # Automation tile: on = green robot with a gentle wobble, off = grey.
  aurora_automation:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: true
    size: 20px
    icon: mdi:robot
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    variables:
      accent: "#a6e3a1"
    state_display: |
      [[[ return entity.state === 'on' ? 'ACTIVE' : 'OFF'; ]]]
    name: |
      [[[
        return (entity.attributes.friendly_name || entity.entity_id)
          .replace(/^[A-Za-zÄÖÜäöü ]{3,18}[:·\-—]\s+/, '');
      ]]]
    styles:
      grid:
      - grid-template-areas: "'i n' 'i s'"
      - grid-template-columns: 38px 1fr
      card:
      - min-height: 58px
      - padding: 8px 12px
      - transition: all .25s ease
      img_cell:
      - grid-area: i
      - justify-self: start
      icon:
      - color: "#585b70"
      - transition: color .3s ease
      name:
      - grid-area: n
      - justify-self: start
      - align-self: end
      - text-align: left
      - font-size: 11.5px
      - line-height: 1.15
      - white-space: normal
      - overflow: hidden
      state:
      - grid-area: s
      - justify-self: start
      - align-self: start
      - font-size: 9px
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - letter-spacing: .14em
      - color: "#6c7086"
    state:
    - value: "on"
      styles:
        card:
        - "--aurora-glow": "[[[ return variables.accent; ]]]"
        - border: "[[[ return '1px solid ' + variables.accent + '38'; ]]]"
        icon:
        - color: "[[[ return variables.accent; ]]]"
        - animation: |
            [[[
              const d = (entity.entity_id.length % 5) * 0.7;
              return 'aurora-wobble 4.5s ease-in-out ' + d + 's infinite';
            ]]]
        state:
        - color: "[[[ return variables.accent; ]]]"

  # Valve position: the icon spins while the valve is open (faster = wider).
  aurora_valve:
    template: aurora_metric
    styles:
      icon:
      - color: |
          [[[
            const v = parseFloat(entity.state);
            if (isNaN(v) || v <= 0) return '#585b70';
            return v >= 60 ? '#f38ba8' : v >= 25 ? '#fab387' : '#f9e2af';
          ]]]
      - animation: |
          [[[
            const v = parseFloat(entity.state);
            if (isNaN(v) || v <= 0) return 'none';
            const dur = Math.max(1.2, 6 - (v / 20));
            return 'aurora-spin ' + dur.toFixed(1) + 's linear infinite';
          ]]]

  # Script / action tile: tap runs it, the icon swings while it is running.
  aurora_action:
    template: aurora_metric
    show_state: true
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    state_display: |
      [[[ return entity.state === 'on' ? 'RUNNING …' : 'RUN'; ]]]
    variables:
      accent: "#89dceb"
      accent_bg: "rgba(137,220,235,0.10)"
    styles:
      icon:
      - animation: |
          [[[
            return entity.state === 'on'
              ? 'aurora-swing 1.1s ease-in-out infinite'
              : 'aurora-float 7s ease-in-out infinite';
          ]]]
      state:
      - font-size: 13px

  # Signal tile: dBm value with traffic-light color + bar icon, pulses when
  # the signal is very weak. For any BLE / Thread / WiFi RSSI sensor.
  aurora_signal:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: true
    size: 22px
    tap_action:
      action: more-info
    state_display: |
      [[[
        const v = parseFloat(entity.state);
        return isNaN(v) ? '—' : Math.round(v) + ' dBm';
      ]]]
    icon: |
      [[[
        const v = parseFloat(entity.state);
        if (isNaN(v)) return 'mdi:signal-off';
        return v >= -60 ? 'mdi:signal-cellular-3' : v >= -75 ? 'mdi:signal-cellular-2' : 'mdi:signal-cellular-1';
      ]]]
    name: |
      [[[
        return (entity.attributes.friendly_name || entity.entity_id)
          .replace(/ Signal strength$/, '');
      ]]]
    styles:
      grid:
      - grid-template-areas: "'i s' 'i n'"
      - grid-template-columns: 44px 1fr
      card:
      - height: 62px
      - padding: 8px 12px
      icon:
      - color: |
          [[[
            const v = parseFloat(entity.state);
            if (isNaN(v)) return '#585b70';
            return v >= -60 ? '#a6e3a1' : v >= -75 ? '#f9e2af' : '#f38ba8';
          ]]]
      - animation: |
          [[[
            return parseFloat(entity.state) < -85 ? 'aurora-pulse 1.4s ease-in-out infinite' : 'none';
          ]]]
      state:
      - justify-self: start
      - align-self: end
      - font-size: 15px
      - font-weight: 700
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - color: |
          [[[
            const v = parseFloat(entity.state);
            if (isNaN(v)) return '#585b70';
            return v >= -60 ? '#a6e3a1' : v >= -75 ? '#f9e2af' : '#f38ba8';
          ]]]
      name:
      - justify-self: start
      - align-self: start
      - text-align: left
      - font-size: 10.5px
      - color: "#a6adc8"
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - line-height: 1.1

  # Radar tile: aurora_metric with a rotating radar sweep behind the icon and
  # a halo pulse. For BLE scanners / sources.
  aurora_radar:
    template: aurora_metric
    extra_styles: |
      @keyframes aurora-spin { to { transform: rotate(360deg); } }
      @keyframes aurora-halo {
        0%       { box-shadow: 0 0 0 0 color-mix(in srgb, var(--aurora-glow,#94e2d5) 45%, transparent); }
        70%,100% { box-shadow: 0 0 0 12px transparent; }
      }
      @keyframes aurora-pulse {
        0%,100% { transform: scale(1); opacity: 1; }
        50%     { transform: scale(1.22); opacity: .6; }
      }
      #img-cell { position: relative; overflow: hidden; }
      #img-cell::before {
        content: "";
        position: absolute;
        inset: -35%;
        background: conic-gradient(from 0deg, transparent 62%, var(--aurora-glow, #94e2d5) 100%);
        animation: aurora-spin 3.5s linear infinite;
        opacity: .4;
      }
      @media (prefers-reduced-motion: reduce) {
        #img-cell::before { animation: none; }
      }
    styles:
      card:
      - "--aurora-glow": "[[[ return variables.accent; ]]]"
      - "--aurora-halo-anim": "aurora-halo 2.6s ease-out infinite"
      icon:
      - z-index: "1"

  # ─────────────────────────────────────────────────────────────────────────
  #  aurora_sky_btn — ONE button of the sky switch.
  #  Four of them side by side make a visible button row: the active setting
  #  lights up, the others stay grey. Deliberately NOT a cycle-through tile —
  #  that was simply not recognised as a switch.
  #  Each card sets variables.option AND its own service_data.option.
  # ─────────────────────────────────────────────────────────────────────────
  aurora_sky_btn:
    template: aurora_base
    show_icon: true
    show_name: true
    show_label: false
    show_state: false
    size: 21px
    entity: input_select.sky_mode
    triggers_update:
    - input_select.sky_mode
    - sun.sun
    variables:
      option: Auto
      accent: "#94e2d5"
    name: |
      [[[ return variables.option; ]]]
    styles:
      grid:
      - grid-template-areas: "'i' 'n'"
      - grid-template-rows: min-content min-content
      - justify-items: center
      card:
      - padding: 10px 6px
      - height: 68px
      - cursor: pointer
      - border: |
          [[[
            const a = states['input_select.sky_mode'];
            return (a && a.state === variables.option)
              ? '1px solid ' + variables.accent
              : '1px solid rgba(180,190,254,0.10)';
          ]]]
      - background: |
          [[[
            const a = states['input_select.sky_mode'];
            return (a && a.state === variables.option)
              ? 'color-mix(in srgb, ' + variables.accent + ' 16%, transparent)'
              : 'transparent';
          ]]]
      img_cell:
      - width: 34px
      - height: 34px
      icon:
      - color: |
          [[[
            const a = states['input_select.sky_mode'];
            return (a && a.state === variables.option) ? variables.accent : '#6c7086';
          ]]]
      name:
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: 11.5px
      - font-weight: 700
      - letter-spacing: .06em
      - margin-top: 3px
      - color: |
          [[[
            const a = states['input_select.sky_mode'];
            return (a && a.state === variables.option) ? '#cdd6f4' : '#7f849c';
          ]]]

  # ─────────────────────────────────────────────────────────────────────────
  #  aurora_status — the house traffic light.
  #  Shows what needs attention rather than what is always the same. When
  #  everything is quiet it simply says "All clear".
  #  Every check runs client-side in JavaScript — not a single Jinja template
  #  that Home Assistant would have to re-render on every state change.
  #  Message order: red → orange → yellow → blue.
  # ─────────────────────────────────────────────────────────────────────────
  aurora_status:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    variables:
      rooms:
      - name: Living Room
        window: binary_sensor.window_living_room
        climate: climate.trv_living_room
      - name: Kitchen
        window: binary_sensor.window_kitchen
        climate: climate.trv_kitchen
      - name: Bedroom
        window: binary_sensor.window_bedroom
        climate: climate.trv_bedroom
      - name: Office
        window: binary_sensor.window_office
        climate: climate.trv_office
      - name: Bathroom
        window: binary_sensor.window_bathroom
        climate: climate.trv_bathroom
      persons: []
      power: sensor.total_power
      power_limit: 4500
      outside: sensor.outdoor_temperature
      laundry: []
      holiday: ""
      batt_limit: 20
      # Phones, watches and laptops stay out — they are not a house problem
      batt_ignore: []
      # Deliberately EXPLICIT instead of "everything with device_class problem":
      # "…since boot" flags would stay red forever, and "notification active"
      # is not a fault at all.
      problems: []
    custom_fields:
      body: |
        [[[
          const V = variables;
          const S = states;
          const nm = (id, fb) => {
            const s = S[id];
            return (s && s.attributes && s.attributes.friendly_name) ? s.attributes.friendly_name : (fb || id);
          };
          const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };

          // The jump targets are built from the dashboard this card is rendered in,
          // so they keep working whatever you called it when you installed it.
          const DASH = '/' + (location.pathname.split('/')[1] || 'aurora-dashboard') + '/';
          // "Living Room" -> room-living_room. A room without its own view gets no
          // jump target at all — a missing button beats a wrong one.
          const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
          const roomView = (name) =>
            (V.rooms_without_view || []).includes(name) ? null : DASH + 'room-' + slug(name);

          const items = [];
          // detail = what opens when the row is tapped: {t title, s subtitle, w why,
          // f [what you can do], n jump target, nl its label, e entity, i icon, c tone}
          const TONE = ['#f38ba8', '#fab387', '#f9e2af', '#89b4fa'];
          const add = (rank, icon, text, detail) => {
            if (detail) { detail.i = detail.i || icon; detail.c = detail.c || TONE[rank]; }
            items.push({ rank, icon, text, detail });
          };

          // ── 1. Window open while the room is heating (red) ──────────────
          const openRooms = [];
          (V.rooms || []).forEach((r) => {
            const w = S[r.window];
            if (!w || w.state !== 'on') return;
            openRooms.push(r.name);
            const c = S[r.climate];
            const heating = c && c.state !== 'off' && c.state !== 'unavailable' &&
              (c.attributes.hvac_action === 'heating' ||
               (num(c.attributes.temperature) !== null && num(c.attributes.current_temperature) !== null &&
                num(c.attributes.temperature) > num(c.attributes.current_temperature) + 0.2));
            if (heating) {
              const set = num(c.attributes.temperature), now = num(c.attributes.current_temperature);
              add(0, 'mdi:radiator-off', r.name + ': window open, heating running', {
                t: r.name + ': heating against an open window',
                s: (set !== null && now !== null) ? ('Set ' + set.toFixed(1) + ' °C · now ' + now.toFixed(1) + ' °C') : null,
                w: 'The thermostat is still working towards its setpoint and heats against the open air. ' +
                   'That warmth goes straight outside, and because the sensor inside the valve reads the ' +
                   'cooler air, it opens up even further. It cannot tell that a window is open.',
                f: ['Close the window — the thermostat settles back down on its own.',
                    'Airing for longer? Set the thermostat to "off" in the room view and back to "heat" afterwards.',
                    'If this keeps happening in one room, an automation "window open → thermostat off" is worth it.'],
                n: roomView(r.name), nl: 'To ' + r.name, e: r.window,
              });
            }
          });
          const openWindowEntity = ((V.rooms || []).find((r) => S[r.window] && S[r.window].state === 'on') || {}).window;

          // ── 2. Window open while it is cold outside (orange) ────────────
          const out = num((S[V.outside] || {}).state);
          if (openRooms.length) {
            const cold = out !== null && out < 15;
            add(cold ? 1 : 3,
                cold ? 'mdi:snowflake-alert' : 'mdi:window-open-variant',
                (openRooms.length === 1 ? 'Window open: ' : openRooms.length + ' windows open: ') +
                openRooms.join(', ') + (cold ? ' — ' + out.toFixed(1) + ' °C outside' : ''),
                {
                  t: openRooms.length === 1 ? 'A window is open' : openRooms.length + ' windows are open',
                  s: openRooms.join(' · '),
                  w: cold
                    ? ('It is ' + out.toFixed(1) + ' °C outside. Below 15 °C a room on tilt cools down fast, ' +
                       'and the walls cool with it — those cost far more energy to warm up again than the ' +
                       'air you wanted to exchange.')
                    : ('Just a note, not a problem: at ' + (out !== null ? out.toFixed(1) + ' °C' : 'this temperature') +
                       ' outside, open windows cost you nothing.'),
                  f: cold
                    ? ['Open wide for a short burst instead of tilting for hours — five minutes exchanges all the air.',
                       'Then close up: the walls stay warm and the room is back to temperature within minutes.',
                       'The climate view shows how temperature and humidity are moving in every room.']
                    : ['Nothing to do. The note disappears once every window is shut.'],
                  n: DASH + 'klima', nl: 'To the climate view', e: openWindowEntity,
                });
          }

          // ── 3. Device fault (red) ──────────────────────────────────────
          //     Tell the kinds apart: a smoke alarm is not a "fault", and a jump
          //     target is only set where a matching view really exists.
          const faultKind = (id) => {
            if (/smoke/i.test(id)) return {
              head: 'Smoke alarm triggered', tone: 'Alarm', icon: 'mdi:smoke-detector-variant-alert',
              w: 'A smoke detector reports smoke. This is the most urgent thing this dashboard knows about.',
              f: ['Go and look. If there is a fire: get out and call your emergency number.',
                  'False alarms are common — steam, dust from drilling, candle smoke. Air the room and reset the detector.',
                  'If the same detector keeps crying wolf, its chamber is usually dusty or the battery is at its end.'],
              n: null,
            };
            if (/leak|moisture|water/i.test(id)) return {
              head: 'Water where none should be', tone: 'Alarm', icon: 'mdi:water-alert',
              w: 'A water sensor got wet. Until somebody has checked, treat it as a leak.',
              f: ['Go to where the sensor sits — usually a washing machine, a boiler or a heating connection.',
                  'If water is running, shut the supply off before you do anything else.',
                  'The alert clears by itself once everything is dry again.'],
              n: null,
            };
            if (/washer|washing|dryer|dishwasher/i.test(id)) return {
              head: null, tone: 'The appliance reports a fault', icon: 'mdi:alert-octagon',
              w: 'The appliance has reported its error state. What exactly is wrong is written in plain ' +
                 'words on the device itself — this note only says THAT something is.',
              f: ['Tap "Open device" — the message is spelled out there.',
                  'Usual suspects: door not properly shut, filter blocked, tap closed, container empty.',
                  'Then switch it off and on once; if it stays, write the error code down.'],
              n: null,
            };
            if (/rpi|docker|nvme|throttl|voltage|temp_limit|cpu|disk/i.test(id)) return {
              head: null, tone: 'The server reports a problem', icon: 'mdi:server-network-off',
              w: 'The machine Home Assistant runs on reports a problem with power, temperature or storage. ' +
                 'Sooner or later that affects everything shown here.',
              f: ['The system view puts temperature, voltage and the state of the disk side by side.',
                  'Undervoltage or throttling almost always means a weak power supply or cable — not the machine.',
                  'Take storage warnings seriously: check your backup first, then replace the disk.'],
              n: DASH + 'system', nl: 'To the system view',
            };
            return {
              head: null, tone: 'The device reports a fault', icon: 'mdi:alert-octagon',
              w: 'The device reported an error state to Home Assistant. This note only says THAT something ' +
                 'is wrong — the message in plain words sits on the device itself.',
              f: ['Tap "Open device" and read the message there.',
                  'Then power the device down once and start it again.',
                  'If it persists, note the error code before you dig further.'],
              n: null,
            };
          };
          (V.problems || []).forEach((id) => {
            const s = S[id];
            if (!s || s.state !== 'on') return;
            const k = faultKind(id);
            add(0, k.icon, k.head ? k.head + ': ' + nm(id) : nm(id) + ' reports a fault', {
              t: k.head || (nm(id) + ' reports a fault'),
              s: k.head ? nm(id) : k.tone,
              w: k.w, f: k.f, n: k.n, nl: k.nl, e: id,
            });
          });

          // ── 4. Laundry finished (yellow) ───────────────────────────────
          (V.laundry || []).forEach((id) => {
            const s = S[id];
            if (!s) return;
            const st = String(s.state).toLowerCase();
            if (st.includes('end') || st.includes('finish') || st === 'programme_ended') {
              add(2, 'mdi:washing-machine', nm(id) + ' has finished', {
                t: nm(id) + ' has finished',
                s: 'Programme ended',
                w: 'The programme is done. Laundry left in the drum smells musty after a few hours, ' +
                   'especially in warm weather.',
                f: ['Empty it.', 'Then leave the door ajar, or the seal grows mould.'],
                n: null, e: id,
              });
            }
          });

          // ── 5. Nobody home but lights on (yellow) ──────────────────────
          const away = (V.persons || []).length > 0 &&
                       (V.persons || []).every((p) => S[p] && S[p].state !== 'home');
          const lightIgnore = V.light_ignore || [];
          const lightsOn = Object.values(S).filter((s) =>
            s.entity_id.startsWith('light.') && s.state === 'on' &&
            !lightIgnore.includes(s.entity_id));
          if (away && lightsOn.length) {
            add(1, 'mdi:lightbulb-alert',
                'Nobody home, but ' + lightsOn.length + ' light' + (lightsOn.length > 1 ? 's' : '') + ' still on',
                {
                  t: 'Nobody home, and the lights are on',
                  s: lightsOn.slice(0, 4).map((s) => nm(s.entity_id)).join(' · ') + (lightsOn.length > 4 ? ' …' : ''),
                  w: 'Everyone is reported away, but ' + lightsOn.length + ' lights are still burning. ' +
                     'That can be on purpose (presence simulation) — or simply forgotten.',
                  f: ['The lights view shows every lamp that is on, and you can switch them off from there.',
                      'To make it happen by itself: an automation "everyone away → lights off" with a few minutes of delay.',
                      'If it is deliberate, add that lamp to this card\'s ignore list.'],
                  n: DASH + 'licht', nl: 'To the lights view',
                });
          }

          // ── 6. Unusually high power draw (yellow) ──────────────────────
          const p = num((S[V.power] || {}).state);
          if (p !== null && p > Number(V.power_limit)) {
            add(2, 'mdi:flash-alert', 'Power draw unusually high: ' + Math.round(p) + ' W', {
              t: 'Power draw is above your threshold',
              s: Math.round(p) + ' W now · threshold ' + V.power_limit + ' W',
              w: 'The whole house is drawing more than ' + V.power_limit + ' W right now. That is not a fault — ' +
                 'it just means more is running than usual, and it is normally one large appliance.',
              f: ['The energy view shows which device is pulling the power right now.',
                  'Usual causes: oven, kettle, water heater, wallbox, a washing machine in its heating step.',
                  'If none of those is on, look at the trace — a steady value rather than a peak points at something stuck.'],
              n: DASH + 'energie', nl: 'To the energy view', e: V.power,
            });
          }

          // ── 7. Low batteries (yellow) ──────────────────────────────────
          const ignore = V.batt_ignore || [];
          const weak = Object.values(S).filter((s) => {
            if (s.attributes.device_class !== 'battery') return false;
            if (ignore.includes(s.entity_id)) return false;
            const v = num(s.state);
            return v !== null && v <= Number(V.batt_limit);
          });
          if (weak.length) {
            const names = weak.slice(0, 2).map((s) => nm(s.entity_id).replace(/ Battery.*$/i, ''));
            add(2, 'mdi:battery-alert-variant',
                (weak.length === 1 ? 'Low battery: ' : weak.length + ' low batteries: ') +
                names.join(', ') + (weak.length > 2 ? ' …' : ''),
                {
                  t: weak.length === 1 ? 'A battery is getting weak' : weak.length + ' batteries are getting weak',
                  s: weak.slice(0, 6).map((s) => nm(s.entity_id).replace(/ Battery.*$/i, '') + ' ' + s.state + ' %').join(' · '),
                  w: 'These devices report ' + V.batt_limit + ' % or less. Radio sensors rarely die cleanly: ' +
                     'they report less often, then not at all — and a window contact that stopped reporting ' +
                     'looks exactly like a closed window on a dashboard.',
                  f: ['The radio view lists every battery level side by side, sorted by charge.',
                      'Buy the cells before the first one dies — then it is two minutes of work instead of a hunt.',
                      'After a change it takes until the device next reports before the value is right again.'],
                  n: DASH + 'radio', nl: 'To the radio view', e: weak[0].entity_id,
                });
          }

          // ── 8. Updates (blue) ──────────────────────────────────────────
          const ups = Object.values(S).filter((s) =>
            s.entity_id.startsWith('update.') && s.state === 'on');
          if (ups.length) {
            add(3, 'mdi:package-up',
                ups.length + ' update' + (ups.length > 1 ? 's' : '') + ' available: ' +
                ups.slice(0, 2).map((s) => nm(s.entity_id).replace(/ Firmware.*| Update.*/i, '')).join(', ') +
                (ups.length > 2 ? ' …' : ''),
                {
                  t: ups.length + (ups.length > 1 ? ' updates are waiting' : ' update is waiting'),
                  s: ups.slice(0, 6).map((s) => nm(s.entity_id).replace(/ Firmware.*| Update.*/i, '')).join(' · '),
                  w: 'Home Assistant reports newer versions. This is not a fault and nothing urgent — ' +
                     'outside of security fixes, waiting is usually the better call.',
                  f: ['Settings → Updates shows the release notes for every entry.',
                      'Do not install a Core update on release day: the first fix release (x.y.2) usually lands within days.',
                      'Only flash device firmware that matches the hardware revision — an offer that is too new can brick it.'],
                  n: '/config/updates', nl: 'To the updates', e: ups[0].entity_id,
                });
          }

          // ── 9. Holiday mode (blue, pure info) ──────────────────────────
          const hol = S[V.holiday];
          if (hol && hol.state === 'on') add(3, 'mdi:beach', 'Holiday mode is active', {
            t: 'Holiday mode is running',
            s: 'Information only, not a problem',
            w: 'While it is on, the heating automations hold the rooms at a lowered temperature and some ' +
               'presence automations are parked.',
            f: ['Switch it off when you are back, or it stays cool.',
                'The automations view shows which rules the mode is affecting.'],
            n: DASH + 'automations', nl: 'To the automations', e: V.holiday,
          });

          items.sort((a, b) => a.rank - b.rank);

          if (!items.length) {
            return `<div class="ampel ok">
              <div class="badge"><ha-icon icon="mdi:shield-check"></ha-icon></div>
              <div class="txt"><div class="head">All clear</div>
              <div class="sub">No open windows, no flat batteries, nothing to do.</div></div>
            </div>`;
          }
          const worst = items[0].rank;
          // The onclick MUST sit on the element: without it Safari does not produce a
          // click for the delegated listener at all. The delegated listener runs in the
          // capture phase and stops propagation, so exactly one of the two ever fires.
          const attr = (d) => d ? ` data-aurora-detail="${JSON.stringify(d).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;')}"` +
            ` onclick="window.auroraDetail&&window.auroraDetail(this)" role="button" tabindex="0"` : '';
          const rows = items.slice(0, 6).map((it) =>
            `<div class="row${it.detail ? ' tap' : ''}"${attr(it.detail)}>` +
            `<ha-icon icon="${it.icon}" style="color:${TONE[it.rank]}"></ha-icon>` +
            `<span>${it.text}</span>` +
            (it.detail ? `<ha-icon class="chev" icon="mdi:chevron-right"></ha-icon>` : '') +
            `</div>`).join('');
          const more = items.length > 6 ? `<div class="row muted"><ha-icon icon="mdi:dots-horizontal"></ha-icon><span>and ${items.length - 6} more</span></div>` : '';
          return `<div class="ampel" style="--tone:${TONE[worst]}">
            <div class="badge"><ha-icon icon="mdi:alert-decagram"></ha-icon></div>
            <div class="txt">
              <div class="head">${items.length} ${items.length === 1 ? 'thing needs' : 'things need'} you</div>
              <div class="rows">${rows}${more}</div>
            </div>
          </div>`;
        ]]]
    styles:
      card:
      - padding: "0"
      grid:
      - grid-template-areas: "'body'"
    extra_styles: |
      .ampel {
        display: grid;
        grid-template-columns: 64px 1fr;
        gap: 14px;
        align-items: start;
        padding: 16px 18px;
        text-align: left;
      }
      .badge {
        width: 52px; height: 52px; border-radius: 16px;
        display: grid; place-items: center;
        background: color-mix(in srgb, var(--tone, #a6e3a1) 16%, transparent);
        color: var(--tone, #a6e3a1);
        --mdc-icon-size: 30px;
        position: relative;
      }
      /* The ring only pulses when something is actually pending — and it scales
         a pseudo element instead of animating a shadow (which would force the
         card's blur to be recomputed on every frame). */
      .badge::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit;
        box-shadow: 0 0 0 2px var(--tone, #a6e3a1);
        opacity: 0; will-change: transform, opacity;
        animation: aurora-halo 2.6s ease-out infinite;
      }
      .ampel.ok { --tone: #a6e3a1; }
      .ampel.ok .badge::after { animation: none; }
      .head {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 20px; font-weight: 700; color: #cdd6f4;
        letter-spacing: .01em; margin-bottom: 6px;
      }
      .sub { font-size: 13px; color: #a6adc8; }
      .rows { display: grid; gap: 6px; }
      .row {
        display: grid; grid-template-columns: 22px 1fr; gap: 10px;
        align-items: center; font-size: 13.5px; color: #cdd6f4;
        --mdc-icon-size: 19px;
      }
      /* button-card sets card text to nowrap — without this, long device names
         are simply cut off on a phone. */
      .row span {
        min-width: 0; white-space: normal; overflow-wrap: anywhere;
        line-height: 1.35; text-align: left;
      }
      .row.muted, .row.muted ha-icon { color: #7f849c; }
      @media (max-width: 520px) {
        .ampel { grid-template-columns: 52px 1fr; gap: 10px; padding: 14px; }
        .badge { width: 44px; height: 44px; --mdc-icon-size: 25px; }
        .head { font-size: 17px; }
        .row { font-size: 12.5px; }
      }


      /* A row that carries data-aurora-detail gets its own column for the chevron,
         so the text does not jump when one row has no target. The hit area is a
         little larger than the text — on a phone you miss it otherwise. */
      .row.tap {
        grid-template-columns: 22px 1fr 18px;
        cursor: pointer;
        /* Without `manipulation` the browser keeps a double-tap open, hesitates,
           and sends pointercancel while it waits. */
        touch-action: manipulation;
        -webkit-tap-highlight-color: rgba(205,214,244,.14);
        margin: -3px -6px; padding: 3px 6px; border-radius: 9px;
        transition: background .14s ease;
      }
      .row.tap:hover { background: rgba(205,214,244,.07); }
      .row.tap:active { background: rgba(205,214,244,.13); }
      .row.tap:focus-visible { outline: 2px solid var(--tone, #89b4fa); outline-offset: 1px; }
      .row.tap .chev { color: #6c7086; --mdc-icon-size: 17px; }
      .row.tap:hover .chev { color: #cdd6f4; }
      /* Touch has no hover — the tone would stick after the tap. */
      @media (hover: none) { .row.tap:hover { background: none; } .row.tap:hover .chev { color: #6c7086; } }

      /* button-card sets `disabled` on the ha-card when tap_action is none
         (source: `disabled: !this._cardClickable`), and that carries
         `pointer-events: none` — with it, no tap ever reaches the rows. Give the
         pointer events back; the card itself stays silent. */
      ha-card.disabled { pointer-events: auto !important; cursor: default !important; }
  # ─────────────────────────────────────────────────────────────────────────
  #  aurora_view_title — the heading of a view, with a way back.
  #  The chip on the right is marked `data-aurora-nav`; aurora-effects.js
  #  turns that into a jump (pushState + location-changed, no reload). The
  #  target is built from the dashboard this card is rendered in, so it keeps
  #  working whatever you called it. Set `variables.back: false` on the view
  #  that IS the overview — it should not offer a way to itself.
  # ─────────────────────────────────────────────────────────────────────────
  aurora_view_title:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: false
    show_label: true
    size: 30px
    tap_action:
      action: none
    variables:
      accent: "#cba6f7"
    custom_fields:
      b: |
        [[[
          if (variables.back === false) return '';
          const dash = '/' + (location.pathname.split('/')[1] || 'aurora-dashboard');
          const target = variables.back_target || (dash + '/home');
          return '<div class="back" data-aurora-nav="' + target + '"' +
            ' onclick="window.auroraNav&&window.auroraNav(this)" role="button" tabindex="0"' +
            ' aria-label="Back to the overview">' +
            '<ha-icon icon="mdi:chevron-left"></ha-icon><span>Overview</span></div>';
        ]]]
    styles:
      grid:
      - grid-template-areas: "'i n b' 'i l b'"
      - grid-template-columns: 56px 1fr auto
      - grid-template-rows: min-content min-content
      card:
      - padding: 10px 18px 14px 14px
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: 0
      img_cell:
      - grid-area: i
      - justify-self: start
      - align-self: center
      - width: 48px
      - height: 48px
      icon:
      - color: |
          [[[ return variables.accent; ]]]
      - filter: |
          [[[ return 'drop-shadow(0 0 12px ' + variables.accent + '99)'; ]]]
      name:
      - grid-area: n
      - justify-self: start
      - align-self: end
      - font-size: clamp(22px, 4.4vw, 34px)
      - font-weight: 800
      - letter-spacing: -.01em
      - line-height: 1.05
      - color: "#cdd6f4"
      - text-shadow: |
          [[[ return '0 0 26px ' + variables.accent + '55'; ]]]
      label:
      - grid-area: l
      - justify-self: start
      - align-self: start
      - margin-top: 3px
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: 10px
      - font-weight: 700
      - letter-spacing: .22em
      - text-transform: uppercase
      - color: |
          [[[ return variables.accent; ]]]
      - opacity: .75
      custom_fields:
        b:
        - grid-area: b
        - justify-self: end
        - align-self: center
        - padding-left: 10px
    extra_styles: |
      /* Back to the overview. Measured: the label still fits next to the
         longest title at 320 px, so it stays on a phone; the chip only grows
         taller on touch so it is easy to hit. */
      .back {
        display: inline-flex; align-items: center; gap: 1px;
        padding: 6px 11px 6px 6px; border-radius: 11px;
        background: rgba(205,214,244,.07);
        border: 1px solid rgba(205,214,244,.10);
        color: #a6adc8; cursor: pointer;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 10px; font-weight: 700; letter-spacing: .14em;
        text-transform: uppercase; white-space: nowrap;
        touch-action: manipulation;
        -webkit-tap-highlight-color: rgba(205,214,244,.14);
        transition: background .14s ease, color .14s ease, border-color .14s ease;
      }
      .back ha-icon { --mdc-icon-size: 16px; flex: 0 0 auto; }
      .back:hover { background: rgba(205,214,244,.13); color: #cdd6f4;
                    border-color: rgba(205,214,244,.18); }
      .back:active { background: rgba(205,214,244,.18); }
      .back:focus-visible { outline: 2px solid var(--tone, #89b4fa); outline-offset: 2px; }
      @media (hover: none) { .back { padding: 9px 13px 9px 9px; }
        .back:hover { background: rgba(205,214,244,.07); color: #a6adc8;
                      border-color: rgba(205,214,244,.10); } }
      /* tap_action: none puts `disabled` on the ha-card, and that carries
         pointer-events: none — without this the chip cannot be tapped. */
      ha-card.disabled { pointer-events: auto !important; cursor: default !important; }

  # ─────────────────────────────────────────────────────────────────────────
  #  aurora_skymode — switch for the sky scene.
  #  Tapping steps through: Auto → Day → Dusk → Night → Auto.
  # ─────────────────────────────────────────────────────────────────────────
  aurora_skymode:
    template: aurora_chip
    entity: input_select.sky_mode
    triggers_update:
    - input_select.sky_mode
    - sun.sun
    label: Sky
    name: |
      [[[
        const s = states['input_select.sky_mode'];
        return s ? s.state : '—';
      ]]]
    icon: |
      [[[
        const s = states['input_select.sky_mode'];
        const m = s ? s.state : 'Auto';
        if (m === 'Day') return 'mdi:weather-sunny';
        if (m === 'Dusk') return 'mdi:weather-sunset';
        if (m === 'Night') return 'mdi:weather-night';
        return 'mdi:theme-light-dark';
      ]]]
    tap_action:
      action: call-service
      service: input_select.select_next
      service_data:
        entity_id: input_select.sky_mode
        cycle: true
    styles:
      icon:
      - color: |
          [[[
            const s = states['input_select.sky_mode'];
            const m = s ? s.state : 'Auto';
            if (m === 'Day') return '#f9e2af';
            if (m === 'Dusk') return '#fab387';
            if (m === 'Night') return '#b4befe';
            return '#94e2d5';
          ]]]

views:

  # ═════════════════════════ 1 · ÜBERSICHT ═════════════════════════
- title: Overview
  path: home
  icon: mdi:view-dashboard-variant
  theme: Aurora
  type: sections
  max_columns: 3
  sections:

  - type: grid
    column_span: 3
    cards:
    - type: custom:button-card
      template: aurora_sky
      grid_options:
        columns: full
    - type: custom:button-card
      template: aurora_view_title
      name: Overview
      icon: mdi:view-dashboard-variant
      label: Home · at a glance
      variables:
        accent: "#fab387"
        # This IS the overview — no way back to itself.
        back: false
      grid_options:
        columns: full
          # House traffic light: right at the top, because it is the only card
          # that tells you whether anything needs doing.
          # Bind it to the entities it reads — `triggers_update: all` would
          # re-render it on every state change anywhere in Home Assistant.
    - type: custom:button-card
      template: aurora_status
      grid_options:
        columns: full
      triggers_update:
      - binary_sensor.window_living_room
      - binary_sensor.window_kitchen
      - binary_sensor.window_bedroom
      - binary_sensor.window_office
      - binary_sensor.window_bathroom
      - climate.trv_living_room
      - climate.trv_kitchen
      - climate.trv_bedroom
      - climate.trv_office
      - climate.trv_bathroom
      - sensor.outdoor_temperature
      - sensor.total_power
          # Visible button row for the sky — right under the status card, so you
          # find it without looking for it.
    - type: grid
      grid_options:
        columns: full
      columns: 4
      square: false
      cards:
      - type: custom:button-card
        template: aurora_sky_btn
        icon: mdi:theme-light-dark
        variables:
          option: Auto
          accent: "#94e2d5"
        tap_action:
          action: call-service
          service: input_select.select_option
          service_data:
            entity_id: input_select.sky_mode
            option: Auto
      - type: custom:button-card
        template: aurora_sky_btn
        icon: mdi:weather-sunny
        variables:
          option: Day
          accent: "#f9e2af"
        tap_action:
          action: call-service
          service: input_select.select_option
          service_data:
            entity_id: input_select.sky_mode
            option: Day
      - type: custom:button-card
        template: aurora_sky_btn
        icon: mdi:weather-sunset
        variables:
          option: Dusk
          accent: "#fab387"
        tap_action:
          action: call-service
          service: input_select.select_option
          service_data:
            entity_id: input_select.sky_mode
            option: Dusk
      - type: custom:button-card
        template: aurora_sky_btn
        icon: mdi:weather-night
        variables:
          option: Night
          accent: "#b4befe"
        tap_action:
          action: call-service
          service: input_select.select_option
          service_data:
            entity_id: input_select.sky_mode
            option: Night
    - type: grid
      grid_options:
        columns: full
      columns: 3
      square: false
      cards:
              # Same card twice: animated weather icon on a desktop, a still one
              # on a phone. The animated icons are SVG images that animate inside
              # their own image document — neither CSS nor JavaScript can stop
              # them, and they repaint continuously (measured: ~20 % CPU on a
              # phone, permanently). `conditional` only builds the matching one.
      - type: conditional
        conditions:
        - condition: screen
          media_query: "(min-width: 700px)"
        card:
          type: custom:clock-weather-card
          entity: weather.forecast_home
          sun_entity: sun.sun
          locale: de
          time_format: 24
          forecast_rows: 4
          animated_icon: true
      - type: conditional
        conditions:
        - condition: screen
          media_query: "(max-width: 699px)"
        card:
          type: custom:clock-weather-card
          entity: weather.forecast_home
          sun_entity: sun.sun
          locale: de
          time_format: 24
          forecast_rows: 4
          animated_icon: false
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:lightbulb-group
          label: Lights on
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('light.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('light.') && s.state === 'on').length);
            ]]]
          tap_action:
            action: navigate
            navigation_path: /aurora-home/licht
          styles:
            icon:
            - color: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('light.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('light.') && s.state === 'on').length;
                  return n > 0 ? '#f9e2af' : '#585b70';
                ]]]
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:window-open-variant
          label: Windows open
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('binary_sensor.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('binary_sensor.') &&
                ['door','window','opening','garage_door'].includes(s.attributes.device_class) &&
                s.state === 'on').length);
            ]]]
          tap_action:
            action: navigate
            navigation_path: /aurora-home/klima
          styles:
            icon:
            - color: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('binary_sensor.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('binary_sensor.') &&
                    ['door','window','opening','garage_door'].includes(s.attributes.device_class) &&
                    s.state === 'on').length;
                  return n > 0 ? '#fab387' : '#585b70';
                ]]]
            - animation: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('binary_sensor.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('binary_sensor.') &&
                    ['door','window','opening','garage_door'].includes(s.attributes.device_class) &&
                    s.state === 'on').length;
                  return n > 0 ? 'aurora-pulse 1.8s ease-in-out infinite' : 'none';
                ]]]
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:account-group
          label: At home
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('person.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('person.') && s.state === 'home').length);
            ]]]
          styles:
            icon:
            - color: "#a6e3a1"
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:battery-alert-variant-outline
          label: Batteries ≤ 20 %
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('sensor.') &&
                s.attributes.device_class === 'battery' &&
                parseFloat(s.state) <= 20).length);
            ]]]
          tap_action:
            action: navigate
            navigation_path: /aurora-home/system
          styles:
            icon:
            - color: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('sensor.') &&
                    s.attributes.device_class === 'battery' &&
                    parseFloat(s.state) <= 20).length;
                  return n > 0 ? '#f38ba8' : '#585b70';
                ]]]
            - animation: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('sensor.') &&
                    s.attributes.device_class === 'battery' &&
                    parseFloat(s.state) <= 20).length;
                  return n > 0 ? 'aurora-pulse 1.2s ease-in-out infinite' : 'none';
                ]]]
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:package-up
          label: Updates
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('update.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('update.') && s.state === 'on').length);
            ]]]
          tap_action:
            action: navigate
            navigation_path: /aurora-home/system
          styles:
            icon:
            - color: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('update.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('update.') && s.state === 'on').length;
                  return n > 0 ? '#89b4fa' : '#585b70';
                ]]]
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:music
          label: Media playing
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('media_player.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('media_player.') && s.state === 'playing').length);
            ]]]
          styles:
            icon:
            - color: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('media_player.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('media_player.') && s.state === 'playing').length;
                  return n > 0 ? '#cba6f7' : '#585b70';
                ]]]
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:toggle-switch
          label: Switches on
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('switch.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('switch.') && s.state === 'on').length);
            ]]]
          styles:
            icon:
            - color: "#a6e3a1"
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:home-thermometer
          label: Ø indoor
          name: |
            [[[
              const vals = Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.room_temp_')).map(_i=>hass.states[_i])
                .filter(s => s.entity_id.startsWith('sensor.room_temp_'))
                .map(s => parseFloat(s.state)).filter(v => !isNaN(v));
              if (!vals.length) return '–';
              return (vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(1) + ' °C';
            ]]]
          tap_action:
            action: navigate
            navigation_path: /aurora-home/klima
          styles:
            icon:
            - color: "#94e2d5"
    - type: vertical-stack
      cards:
      - type: custom:auto-entities
        card:
          type: grid
          columns: 3
          square: false
        card_param: cards
        filter:
          include:
          - domain: person
            options:
              type: custom:button-card
              template: aurora_person
      - type: custom:auto-entities
        show_empty: false
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
          - domain: media_player
            state: playing
            options:
              type: custom:mushroom-media-player-card
              use_media_info: true
              media_controls:
              - play_pause_stop

      grid_options:
        columns: full
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Now
      heading_style: title
      icon: mdi:pulse
    - type: grid
      grid_options:
        columns: full
      columns: 6
      square: false
      cards:
      - type: custom:button-card
        template: aurora_metric
        entity: sensor.total_power
        name: Power
        icon: mdi:flash
        variables:
          accent: "#fab387"
          accent_bg: "rgba(250,179,135,0.10)"
      - type: custom:button-card
        template: aurora_metric
        entity: sensor.total_energy_today
        name: Energy today
        icon: mdi:lightning-bolt-circle
        variables:
          accent: "#94e2d5"
          accent_bg: "rgba(148,226,213,0.10)"
      - type: custom:button-card
        template: aurora_metric
        entity: sensor.total_cost_today
        name: Cost today
        icon: mdi:currency-eur
        variables:
          accent: "#f9e2af"
          accent_bg: "rgba(249,226,175,0.10)"
      - type: custom:button-card
        template: aurora_metric
        entity: sensor.outdoor_temperature
        name: Outdoor
        icon: mdi:thermometer
        variables:
          accent: "#89dceb"
          accent_bg: "rgba(137,220,235,0.10)"
      - type: custom:button-card
        template: aurora_metric
        entity: sensor.wan_download_rate
        name: WAN ↓
        icon: mdi:download
        variables:
          accent: "#89b4fa"
          accent_bg: "rgba(137,180,250,0.10)"
      - type: custom:button-card
        template: aurora_metric
        entity: sensor.wan_upload_rate
        name: WAN ↑
        icon: mdi:upload
        variables:
          accent: "#f5c2e7"
          accent_bg: "rgba(245,194,231,0.10)"
    - type: grid
      grid_options:
        columns: full
      columns: 2
      square: false
      cards:
      - type: custom:stack-in-card
        mode: vertical
        cards:
        - type: custom:button-card
          template: aurora_plot_header
          entity: sensor.total_power
          name: Power · 12 h
          label: "The home's current draw, in watts"
          state_display: |
            [[[ const v = parseFloat(entity.state); return isNaN(v) ? '—' : Math.round(v) + ' W'; ]]]
          variables:
            accent: "#fab387"
        - type: custom:apexcharts-card
          graph_span: 12h
          header:
            show: false
          apex_config:
            chart:
              height: 190
              animations: *apex_anim
              dropShadow:
                enabled: true
                top: 0
                left: 0
                blur: 6
                opacity: 0.7
                color: "#fab387"
            grid: *apex_grid
            fill: *apex_fill2
            legend:
              show: false
          all_series_config:
            type: area
            curve: stepline
            stroke_width: 2
            group_by:
              func: avg
              duration: 5min
          series:
          - entity: sensor.total_power
            name: Power
            color: "#fab387"
            show:
              legend_value: false
          - entity: sensor.total_power
            name: scan
            type: line
            color: "#fab387"
            stroke_width: 3
            show:
              in_legend: false
              in_header: false
              legend_value: false
      - type: custom:stack-in-card
        mode: vertical
        cards:
        - type: custom:button-card
          template: aurora_plot_header
          entity: sensor.wan_download_rate
          triggers_update:
          - sensor.wan_download_rate
          - sensor.wan_upload_rate
          name: WAN ↓ ↑ · 6 h
                    # The big figure shows TOTAL throughput (down + up), not just
                    # the download of the header entity.
          state_display: |
            [[[
              const d = parseFloat((states['sensor.wan_download_rate'] || {}).state);
              const u = parseFloat((states['sensor.wan_upload_rate'] || {}).state);
              const t = (isNaN(d) ? 0 : d) + (isNaN(u) ? 0 : u);
              return t.toFixed(1) + ' Mbit/s';
            ]]]
          variables:
            accent: "#89b4fa"
        - type: custom:apexcharts-card
          graph_span: 6h
          header:
            show: false
          apex_config:
            chart:
              height: 190
              animations: *apex_anim
              dropShadow:
                enabled: true
                top: 0
                left: 0
                blur: 6
                opacity: 0.7
                color: "#89b4fa"
            grid: *apex_grid
