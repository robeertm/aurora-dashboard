# ═══════════════════════════════════════════════════════════════════════════
#  Aurora Dashboard — generic English template
#  All logic runs CLIENT-side (button-card JS / auto-entities patterns).
#  Deliberately NO Jinja card templates (render_template) — see README.
#  Layout rule: max_columns 3, sections column_span 3 (full width),
#  columns come from inner grid cards -> deterministic on any desktop.
#  Search for "sensor." placeholders and adapt them to your install (see README).
# ═══════════════════════════════════════════════════════════════════════════
title: Aurora

# Wiederverwendbare Plot-Bausteine (Cockpit-Look: Neon-Glow, Scan-Puls, Animationen)
aurora_defs:
  apex_anim: &apex_anim
    enabled: true
    easing: easeinout
    speed: 900
    dynamicAnimation:
      enabled: true
      speed: 600
  apex_grid: &apex_grid
    borderColor: "rgba(180,190,254,0.07)"
    strokeDashArray: 3
  apex_fill2: &apex_fill2
    type: ["gradient", "solid"]
    opacity: [1, 1]
    gradient:
      opacityFrom: 0.4
      opacityTo: 0.03
  apex_fill3: &apex_fill3
    type: ["gradient", "gradient", "solid"]
    opacity: [1, 1, 1]
    gradient:
      opacityFrom: 0.4
      opacityTo: 0.03

button_card_templates:

  aurora_base:
    show_state: false
    show_label: false
    tap_action:
      action: none
    styles:
      card:
      - padding: 12px
      name:
      - font-weight: 600
    # KEINE extra_styles: button-card kopiert sie in JEDE erbende Karte.
    # Alle Keyframes liegen zentral im geteilten Stylesheet des Helfers.

  aurora_chip:
    template: aurora_base
    show_icon: true
    show_name: true
    show_label: true
    # These chips count across all entities, so they do need broad updates.
    # If your instance has many fast-changing sensors, replace `all` with an
    # explicit entity list per chip — that alone took one dashboard from
    # 120 re-renders/s down to a handful.
    triggers_update: all
    size: 22px
    styles:
      grid:
      - grid-template-areas: "'i n' 'i l'"
      - grid-template-columns: 48px 1fr
      - grid-template-rows: min-content min-content
      card:
      - padding: 10px 12px
      - height: 66px
      img_cell:
      - grid-area: i
      - width: 40px
      - height: 40px
      - border-radius: 12px
      - background: "rgba(137,180,250,0.08)"
      - align-self: center
      icon:
      - animation: |
          [[[
            const d = ((entity ? entity.entity_id.length : 3) % 5) * 0.6;
            return 'aurora-float 6.5s ease-in-out ' + d + 's infinite';
          ]]]
      name:
      - grid-area: n
      - justify-self: start
      - align-self: end
      - font-size: 19px
      - font-weight: 700
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - line-height: 1.1
      label:
      - grid-area: l
      - justify-self: start
      - align-self: start
      - font-size: 10.5px
      - letter-spacing: .08em
      - text-transform: uppercase
      - color: "#a6adc8"
      - margin-top: 2px

  aurora_metric:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: true
    size: 20px
    tap_action:
      action: more-info
    variables:
      accent: "#89b4fa"
      accent_bg: "rgba(137,180,250,0.10)"
    # Raw values like 4.57999992370605 kWh would overflow the tile → round them.
    state_display: |
      [[[
        const st = entity ? entity.state : null;
        if (st === null || st === undefined) return '—';
        if (entity.attributes.device_class === 'timestamp') {
          const d = new Date(st);
          return isNaN(d) ? st : d.toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit'});
        }
        if (st === 'unknown' || st === 'unavailable' || st === 'none') return '—';
        const v = parseFloat(st);
        if (isNaN(v)) {
          // let HA translate enum states (appliance programs etc.)
          try { return hass.formatEntityState(entity); } catch (e) { return st; }
        }
        const a = Math.abs(v);
        const dec = a >= 100 ? 0 : a >= 10 ? 1 : 2;
        const u = entity.attributes.unit_of_measurement;
        return parseFloat(v.toFixed(dec)) + (u ? ' ' + u : '');
      ]]]
    styles:
      grid:
      - grid-template-areas: "'i s' 'i n'"
      - grid-template-columns: 48px 1fr
      - grid-template-rows: min-content min-content
      card:
      - padding: 10px 12px
      - height: 66px
      img_cell:
      - grid-area: i
      - width: 40px
      - height: 40px
      - border-radius: 12px
      - background: "[[[ return variables.accent_bg; ]]]"
      - align-self: center
      icon:
      - color: "[[[ return variables.accent; ]]]"
      - animation: |
          [[[
            const d = ((entity ? entity.entity_id.length : 3) % 6) * 0.55;
            return 'aurora-float 7.5s ease-in-out ' + d + 's infinite';
          ]]]
      state:
      - grid-area: s
      - justify-self: start
      - align-self: end
      - font-size: "clamp(13px, 1.15vw, 18px)"
      - font-weight: 700
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - line-height: 1.1
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      name:
      - grid-area: n
      - justify-self: start
      - align-self: start
      - font-size: 10.5px
      - letter-spacing: .08em
      - text-transform: uppercase
      - color: "#a6adc8"
      - margin-top: 2px
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%

  # A trend nobody can read is decoration. Every plot carries a plain-language
  # line under its title saying what the curve means and in which unit — that is
  # what `label` is for, and why the grid has a second row for it.
  aurora_plot_header:
    template: aurora_base
    show_icon: false
    show_name: true
    show_state: true
    show_label: true
    tap_action:
      action: more-info
    variables:
      accent: "#89b4fa"
    styles:
      grid:
      - grid-template-areas: "'n s' 'l s'"
      - grid-template-columns: 1fr auto
      card:
      - padding: 12px 18px 2px 18px
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: 0
      name:
      - justify-self: start
      - align-self: center
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: "clamp(9px, 3vw, 12px)"
      - font-weight: 600
      - letter-spacing: .14em
      - text-transform: uppercase
      - color: "#a6adc8"
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - min-width: 0
      label:
      - grid-area: l
      - justify-self: start
      - text-align: left
      - font-size: "clamp(10px, 2.9vw, 12.5px)"
      - font-weight: 500
      - letter-spacing: "0"
      - text-transform: none
      - color: "#a6adc8"
      - opacity: ".7"
      - line-height: "1.35"
      - white-space: normal
      - padding: 2px 0 2px 0
      - min-width: 0
      state:
      - justify-self: end
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: "clamp(15px, 5.5vw, 24px)"
      - font-weight: 800
      - color: "[[[ return variables.accent; ]]]"
      - text-shadow: "[[[ return '0 0 14px ' + variables.accent + '80'; ]]]"

  # ─────────────────────────────────────────────────────────────────────────
  #  aurora_plot_tile — the same header squeezed for the sensor explorer, where
  #  two plots sit side by side: the name gets the full width (two lines), the
  #  time window and the value share the row below it. Same colours, no new tone.
  # ─────────────────────────────────────────────────────────────────────────
  aurora_plot_tile:
    template: aurora_plot_header
    styles:
      grid:
      - grid-template-areas: "'n n' 'l s'"
      - grid-template-columns: auto 1fr
      - row-gap: 1px
      card:
      - padding: 10px 12px 0 12px
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: 0
      name:
      - grid-area: n
      - justify-self: start
      - text-align: left
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: "clamp(9px, 2.6vw, 11px)"
      - font-weight: 600
      - letter-spacing: .08em
      - text-transform: uppercase
      - color: "#a6adc8"
      - white-space: normal
      - line-height: "1.25"
      - min-height: 2.5em
      - display: "-webkit-box"
      - "-webkit-line-clamp": "2"
      - "-webkit-box-orient": vertical
      - overflow: hidden
      - min-width: 0
      label:
      - grid-area: l
      - align-self: end
      - justify-self: start
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: 10px
      - letter-spacing: .06em
      - text-transform: none
      - color: "#a6adc8"
      - opacity: ".55"
      - white-space: nowrap
      state:
      - grid-area: s
      - justify-self: end
      - align-self: end
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: "clamp(12px, 3.6vw, 17px)"
      - font-weight: 800
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - color: "[[[ return variables.accent; ]]]"
      - text-shadow: "[[[ return '0 0 12px ' + variables.accent + '70'; ]]]"

  # ─────────────────────────────────────────────────────────────────────────
  #  aurora_sky — the drawn sky behind everything.
  #  Three scenes (Day / Dusk / Night), all drawn from scratch: plain CSS
  #  gradients and hand-placed SVG shapes. NO third-party image files.
  #
  #  What decides the scene:
  #   · switch     input_select.sky_mode (Auto/Day/Dusk/Night)
  #   · Auto       sun elevation: > 6° Day, -8°…6° Dusk, < -8° Night
  #   · sun spot   azimuth → left/right, elevation → up/down (real values)
  #   · WEATHER    weather.forecast_home: the palette follows the local
  #                conditions, the number of clouds follows the cloud cover and
  #                their speed the real wind; rain/snow/fog/lightning are drawn
  #                on top and the sun fades out behind thick cover
  #   · SEASON     the ground is a meadow — fresh in spring, deep green with
  #                poppies in summer, golden with falling leaves in autumn and
  #                snow-covered in winter (month → season, or force one via
  #                the `season` variable)
  #
  #  Performance: only ONE scene ever exists in the DOM, every animation runs
  #  on transform/opacity only (compositor). Measured figures: see README.
  # ─────────────────────────────────────────────────────────────────────────
  aurora_sky:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    variables:
      weather: weather.forecast_home
      # empty = season from the month; otherwise force one of
      # spring|summer|autumn|winter
      season: ""
    triggers_update:
    - sun.sun
    - input_select.sky_mode
    - weather.forecast_home
    custom_fields:
      scene: |
        [[[
          const V = variables;
          const S = states;
          // ── Szene bestimmen ────────────────────────────────────────────
          const sel = S['input_select.aurora_himmel'];
          let mode = sel ? sel.state : 'Automatik';
          const sun  = S['sun.sun'];
          const elev = sun ? Number(sun.attributes.elevation) : -30;
          const azi  = sun ? Number(sun.attributes.azimuth)   : 180;
          if (mode === 'Automatik' || !['Tag','Dämmerung','Nacht'].includes(mode)) {
            mode = elev > 6 ? 'Tag' : (elev > -8 ? 'Dämmerung' : 'Nacht');
          }

          // ── Wetter am Ort ─────────────────────────────────────────────
          const w    = S[V.weather];
          const cond = w ? String(w.state) : 'partlycloudy';
          const att  = w ? w.attributes : {};
          const cover = att.cloud_coverage != null ? Number(att.cloud_coverage)
                      : (cond === 'sunny' || cond === 'clear-night') ? 5
                      : cond === 'cloudy' ? 90 : 50;
          const wind = Number(att.wind_speed) || 8;
          const rain  = ['rainy','pouring','lightning-rainy','snowy-rainy','hail'].includes(cond);
          const heavy = ['pouring','lightning-rainy','hail'].includes(cond);
          const snow  = ['snowy','snowy-rainy'].includes(cond);
          const fog   = ['fog','exceptional'].includes(cond);
          const storm = ['lightning','lightning-rainy'].includes(cond);
          const clear = ['sunny','clear-night'].includes(cond);
          // Wolkenzahl folgt der Bedeckung, Tempo dem echten Wind
          const nClouds = Math.max(0, Math.min(6, Math.round(cover / 17)));
          const sail    = Math.max(80, Math.round(430 - wind * 9));

          // ── Jahreszeit (Nordhalbkugel) ────────────────────────────────
          const m = new Date().getMonth();
          const season = ['spring','summer','autumn','winter'].includes(V.season) ? V.season
                       : (m >= 2 && m <= 4) ? 'spring'
                       : (m >= 5 && m <= 7) ? 'summer'
                       : (m >= 8 && m <= 10) ? 'autumn' : 'winter';

          // ── Bausteine ─────────────────────────────────────────────────
          const clouds = (cls) => {
            let out = '';
            for (let i = 0; i < nClouds; i++) {
              const top   = 9 + i * 9;
              const scale = (i % 3 === 0) ? 1.25 : (i % 3 === 1) ? 1 : .8;
              const dur   = Math.round(sail * (1 + i * 0.22));
              const delay = -Math.round(dur * (i * 0.31 % 1));
              out += `<div class="cloud ${cls}" style="top:${top}%;`
                   + `width:${Math.round(230 * scale)}px;height:${Math.round(78 * scale)}px;`
                   + `animation-duration:${dur}s;animation-delay:${delay}s;`
                   + `opacity:${(clear ? .26 : rain || cond === 'cloudy' ? .62 : .42).toFixed(2)}"></div>`;
            }
            return out;
          };
          const weatherFx = () => {
            let out = '';
            if (rain)  out += `<div class="rain${heavy ? ' heavy' : ''}"></div><div class="rain far"></div>`;
            if (snow)  out += '<div class="snow"></div><div class="snow s2"></div><div class="snow s3"></div>';
            if (fog)   out += '<div class="fogband f1"></div><div class="fogband f2"></div>';
            if (storm) out += '<div class="flash"></div>';
            return out;
          };
          const ground = (variant) => {
            let extra = '';
            if (season === 'autumn' && variant !== 'night') {
              extra = '<div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div>';
            }
            if (season === 'summer' && variant === 'night') {
              extra = '<div class="firefly f1"></div><div class="firefly f2"></div>'
                    + '<div class="firefly f3"></div><div class="firefly f4"></div>';
            }
            return `<div class="ground ${season} ${variant}">
              <div class="treeline"></div>
              <div class="meadow"></div>
              <div class="flowers"></div>
              <div class="grass"></div>
              ${extra}
            </div>`;
          };

          // ── Mond: echte Bahn + echte Phase ────────────────────────────
          // Vereinfachte Mondposition (Meeus, Genauigkeit ~0,3° — reicht fuer ein Bild)
          // und der beleuchtete Anteil, gezeichnet als Lune. Standort kommt aus HA.
          const moonHTML = () => {
            const D = Math.PI / 180;
            const lat = (hass.config && hass.config.latitude) || 50;
            const lon = (hass.config && hass.config.longitude) || 10;
            const d = Date.now() / 86400000 + 2440587.5 - 2451545.0;
            const L = (218.316 + 13.176396 * d) * D;
            const M = (134.963 + 13.064993 * d) * D;
            const F = (93.272 + 13.229350 * d) * D;
            const lam = L + 6.289 * D * Math.sin(M);
            const bet = 5.128 * D * Math.sin(F);
            const eps = 23.4397 * D;
            const ra = Math.atan2(Math.sin(lam) * Math.cos(eps) - Math.tan(bet) * Math.sin(eps), Math.cos(lam));
            const dec = Math.asin(Math.sin(bet) * Math.cos(eps) + Math.cos(bet) * Math.sin(eps) * Math.sin(lam));
            const phi = lat * D;
            const th = (280.16 + 360.9856235 * d) * D + lon * D;
            const H = th - ra;
            const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H)) / D;
            let az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi)) / D + 180;
            az = (az + 360) % 360;
            // Sonne (grob) fuer die Phase
            const Ms = (357.5291 + 0.98560028 * d) * D;
            const Ls = (280.459 + 0.98564736 * d) * D + (1.9148 * Math.sin(Ms) + 0.0200 * Math.sin(2 * Ms)) * D;
            const elong = Math.acos(Math.cos(bet) * Math.cos(lam - Ls));
            const k = (1 - Math.cos(elong)) / 2;                 // beleuchteter Anteil 0..1
            const waxing = Math.sin(lam - Ls) > 0;               // zunehmend?
            if (alt < -3) return '';                              // unter dem Horizont
            const mx = Math.max(2, Math.min(92, ((az - 60) / 240) * 90 + 2));
            const my = Math.max(4, Math.min(78, 74 - (Math.max(alt, -3) / 55) * 68));
            const r = 46, rx = (r * Math.abs(1 - 2 * k)).toFixed(1);
            const s1 = waxing ? 1 : 0;
            const s2 = (k > 0.5) ? (waxing ? 1 : 0) : (waxing ? 0 : 1);
            const lit = `M0,${-r} A${r},${r} 0 0,${s1} 0,${r} A${rx},${r} 0 0,${s2} 0,${-r} Z`;
            const dim = Math.min(1, Math.max(0.25, 0.35 + k));    // schmale Sichel leuchtet schwaecher
            const NAMES = ['Neumond','zunehmende Sichel','erstes Viertel','zunehmender Mond',
                           'Vollmond','abnehmender Mond','letztes Viertel','abnehmende Sichel'];
            const idx = k < 0.04 ? 0 : k > 0.96 ? 4
                      : (Math.abs(k - 0.5) < 0.06 ? (waxing ? 2 : 6) : (k < 0.5 ? (waxing ? 1 : 7) : (waxing ? 3 : 5)));
            return `<div class="moonwrap" style="left:${mx.toFixed(1)}%;top:${my.toFixed(1)}%;opacity:${dim.toFixed(2)}"
                         title="${NAMES[idx]} · ${Math.round(k * 100)} % beleuchtet">
              <svg viewBox="-52 -52 104 104" class="moondisc">
                <defs>
                  <radialGradient id="mg" cx="38%" cy="34%" r="72%">
                    <stop offset="0%" stop-color="#fffdf2"/>
                    <stop offset="62%" stop-color="#f2ead4"/>
                    <stop offset="100%" stop-color="#d9cfb4"/>
                  </radialGradient>
                  <clipPath id="mclip"><path d="${lit}"/></clipPath>
                </defs>
                <circle r="46" fill="rgba(205,214,244,.07)"/>
                <g clip-path="url(#mclip)">
                  <circle r="46" fill="url(#mg)"/>
                  <circle cx="-14" cy="-12" r="8"  fill="rgba(140,132,110,.30)"/>
                  <circle cx="12"  cy="6"   r="11" fill="rgba(140,132,110,.24)"/>
                  <circle cx="-6"  cy="20"  r="6"  fill="rgba(140,132,110,.26)"/>
                  <circle cx="20"  cy="-20" r="5"  fill="rgba(140,132,110,.22)"/>
                </g>
              </svg>
            </div>`;
          };

          // ── Nacht ─────────────────────────────────────────────────────
          if (mode === 'Nacht') {
            const starDim = Math.max(.18, 1 - cover / 120);
            return `<div class="sky sky-night">
              <div class="stars" style="opacity:${(0.75 * starDim).toFixed(2)}"></div>
              <div class="stars2" style="opacity:${starDim.toFixed(2)}"></div>
              ${cover < 85 ? moonHTML() : ''}
              ${clouds('night')}
              ${weatherFx()}
              ${ground('night')}
            </div>`;
          }

          // Sonne dorthin setzen, wo sie steht: Azimut 60°–300° auf 2 %–92 %,
          // Höhe 0°–55° auf 72 %–6 % (tief stehend = knapp über dem Horizont).
          const x = Math.max(2, Math.min(92, ((azi - 60) / 240) * 90 + 2));
          const y = Math.max(6, Math.min(74, 72 - (Math.max(elev, -6) / 55) * 66));
          const pos = `left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;`;
          // Bei dichter Bedeckung verschwindet die Sonne hinter den Wolken
          const sunOp = Math.max(0, 1 - cover / 105).toFixed(2);
          const dusk  = mode === 'Dämmerung';
          const paletteFor = () => {
            if (dusk) return 'sky-dusk';
            if (rain || cond === 'cloudy') return 'sky-day wet';
            if (snow) return 'sky-day snowy';
            if (fog)  return 'sky-day foggy';
            if (clear) return 'sky-day clear';
            return 'sky-day';
          };
          return `<div class="sky ${paletteFor()}">
            <div class="rays${dusk ? ' dusk' : ''}" style="${pos}opacity:${sunOp}"></div>
            <div class="sun${dusk ? ' dusk' : ''}" style="${pos}opacity:${sunOp}"></div>
            ${dusk ? '<div class="stars2 faint"></div>' : ''}
            ${dusk && cover < 85 ? moonHTML() : ''}
            <div class="haze"></div>
            ${clouds(dusk ? 'warm' : '')}
            ${!rain && !snow && !fog && !dusk ? '<div class="bird b1"></div><div class="bird b2"></div>' : ''}
            ${weatherFx()}
            ${ground(dusk ? 'dusk' : 'day')}
          </div>`;
        ]]]
    styles:
      card:
      - position: fixed
      - inset: "0"
      - z-index: "0"
      - pointer-events: none
      - border: none
      - border-radius: "0"
      - box-shadow: none
      - background: none
      - backdrop-filter: none
      - overflow: hidden
      grid:
      - position: absolute
      - inset: "0"
      custom_fields:
        scene:
        - position: absolute
        - inset: "0"
    extra_styles: |
      /* fixed statt absolute: die Karte ist zwar bildschirmfüllend, ihr
         Inhalts-Grid nicht — eine absolute Ebene darin wäre nur so hoch wie
         der (leere) Karteninhalt und die Szene klebte oben am Rand. */
      .sky { position: fixed; inset: 0; overflow: hidden; }

      /* ══ HIMMEL-PALETTEN ══ folgen der Wetterlage am Ort ══════════════ */
      .sky-day        { background: linear-gradient(180deg, #12253f 0%, #1d4a75 26%, #2e7aa8 58%, #4aa3cc 100%); }
      .sky-day.clear  { background: linear-gradient(180deg, #0d2c52 0%, #1a5c92 30%, #3390c2 62%, #6fbde0 100%); }
      .sky-day.wet    { background: linear-gradient(180deg, #222c3a 0%, #3b4b5e 30%, #566a80 62%, #73879b 100%); }
      .sky-day.snowy  { background: linear-gradient(180deg, #2c3a49 0%, #4c6072 30%, #74899c 62%, #a3b5c4 100%); }
      .sky-day.foggy  { background: linear-gradient(180deg, #363d45 0%, #5e666e 30%, #868d94 62%, #aab1b8 100%); }
      .sky-dusk       { background: linear-gradient(180deg, #12122a 0%, #241f45 26%, #4a3059 52%, #7c4460 74%, #a8583f 100%); }
      .sky-night      { background: radial-gradient(120% 80% at 50% 108%, rgba(49,50,68,.5), transparent 62%); }

      /* Schleier: hält den oberen Bildbereich dunkel genug für die hellen
         Sektions-Überschriften, lässt die Wiese unten aber hell bleiben. */
      .sky-day::after, .sky-dusk::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(180deg,
          rgba(17,17,27,.16) 0%, rgba(17,17,27,.34) 42%,
          rgba(17,17,27,.28) 72%, rgba(17,17,27,.08) 100%);
      }

      /* ══ NACHT ══ Sternbilder + Streulicht. Gedriftet wird per transform
         auf einer überdimensionierten Ebene — background-position wäre eine
         Paint-Eigenschaft und ließe den Blur aller Glaskarten darüber jeden
         Frame neu rechnen. */
      .stars, .stars2 { position: absolute; inset: -30%; background-repeat: repeat; will-change: transform; }
      .stars {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><g fill='none' stroke='rgba(180,190,254,0.12)' stroke-width='0.7'><path d='M60,80 L140,58 L204,122 L298,96 L344,150'/><path d='M420,178 L502,140 L558,210 L622,188'/><path d='M118,418 L182,378 L262,430 L252,520 L176,548'/><path d='M478,478 L542,430 L612,470 L590,560 L518,584'/><path d='M320,260 L362,300 L330,360 L320,260'/><path d='M560,60 L610,96 L664,72'/></g><g fill='%23b4befe'><circle cx='60' cy='80' r='1.4' opacity='.8'/><circle cx='140' cy='58' r='1.1' opacity='.7'/><circle cx='204' cy='122' r='1.5' opacity='.9'/><circle cx='298' cy='96' r='1' opacity='.6'/><circle cx='344' cy='150' r='1.2' opacity='.7'/><circle cx='420' cy='178' r='1.3' opacity='.8'/><circle cx='502' cy='140' r='1' opacity='.6'/><circle cx='558' cy='210' r='1.5' opacity='.9'/><circle cx='622' cy='188' r='1.1' opacity='.7'/><circle cx='118' cy='418' r='1.2' opacity='.7'/><circle cx='182' cy='378' r='1.4' opacity='.85'/><circle cx='262' cy='430' r='1' opacity='.6'/><circle cx='252' cy='520' r='1.3' opacity='.8'/><circle cx='176' cy='548' r='1' opacity='.6'/><circle cx='478' cy='478' r='1.4' opacity='.8'/><circle cx='542' cy='430' r='1.1' opacity='.65'/><circle cx='612' cy='470' r='1.5' opacity='.9'/><circle cx='590' cy='560' r='1' opacity='.6'/><circle cx='518' cy='584' r='1.2' opacity='.7'/><circle cx='320' cy='260' r='1.3' opacity='.75'/><circle cx='362' cy='300' r='1' opacity='.6'/><circle cx='330' cy='360' r='1.2' opacity='.7'/><circle cx='560' cy='60' r='1.2' opacity='.7'/><circle cx='610' cy='96' r='1.4' opacity='.85'/><circle cx='664' cy='72' r='1' opacity='.6'/></g><g fill='%23cdd6f4'><circle cx='40' cy='240' r='0.8' opacity='.35'/><circle cx='96' cy='300' r='0.7' opacity='.3'/><circle cx='230' cy='210' r='0.9' opacity='.4'/><circle cx='390' cy='60' r='0.7' opacity='.3'/><circle cx='470' cy='300' r='0.8' opacity='.35'/><circle cx='540' cy='330' r='0.7' opacity='.3'/><circle cx='640' cy='320' r='0.9' opacity='.4'/><circle cx='60' cy='620' r='0.8' opacity='.35'/><circle cx='340' cy='560' r='0.7' opacity='.3'/><circle cx='400' cy='640' r='0.9' opacity='.4'/><circle cx='660' cy='620' r='0.8' opacity='.35'/><circle cx='300' cy='400' r='0.7' opacity='.3'/></g></svg>");
        background-size: 700px 700px;
        animation: sky-drift-a 420s linear infinite alternate;
      }
      .stars2 {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><g fill='%23cdd6f4'><circle cx='30' cy='50' r='1' opacity='.55'/><circle cx='120' cy='24' r='0.8' opacity='.45'/><circle cx='210' cy='90' r='1.1' opacity='.6'/><circle cx='330' cy='40' r='0.8' opacity='.45'/><circle cx='390' cy='140' r='1' opacity='.55'/><circle cx='70' cy='180' r='0.9' opacity='.5'/><circle cx='170' cy='230' r='0.7' opacity='.4'/><circle cx='280' cy='190' r='1' opacity='.55'/><circle cx='350' cy='280' r='0.8' opacity='.45'/><circle cx='40' cy='330' r='1.1' opacity='.6'/><circle cx='150' cy='370' r='0.8' opacity='.45'/><circle cx='250' cy='330' r='0.9' opacity='.5'/><circle cx='330' cy='390' r='1' opacity='.55'/><circle cx='390' cy='350' r='0.7' opacity='.4'/></g></svg>");
        background-size: 420px 420px;
        animation: sky-drift-b 300s linear infinite alternate, sky-twinkle 7s ease-in-out infinite alternate;
      }
      .stars2.faint { opacity: .45 !important; animation: sky-twinkle 9s ease-in-out infinite alternate; }
      .moon {
        /* Steht der Mond hinter einer Glaskarte, verwischt deren backdrop-filter
           ihn zu einem Lichtfleck — deshalb groß, kontrastreich und knapp unter
           dem Kopfbereich, wo meist eine Lücke bleibt. */
        position: absolute; top: 4.5%; right: 7%;
        width: 88px; height: 88px; border-radius: 50%;
        background: radial-gradient(circle at 36% 33%, #f8f4e6 0%, #e6e0cf 52%, #c6c2b1 100%);
        box-shadow: 0 0 26px 3px rgba(246,242,226,.14),
                    inset -7px -5px 13px rgba(88,86,78,.30);
        will-change: transform;
        animation: sky-breath 40s ease-in-out infinite;
      }
      .moon::after {
        content: ""; position: absolute; inset: 0; border-radius: 50%;
        background:
          radial-gradient(circle at 63% 29%, rgba(126,124,110,.30) 0 8px, transparent 9px),
          radial-gradient(circle at 39% 61%, rgba(126,124,110,.26) 0 12px, transparent 13px),
          radial-gradient(circle at 69% 68%, rgba(126,124,110,.20) 0 7px, transparent 8px);
      }

      /* ══ SONNE ══ Position kommt aus Azimut/Höhe, Deckkraft aus der Bewölkung */
      .sun {
        position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #fffae8 0%, #ffdf9a 34%, rgba(255,199,102,.42) 58%, rgba(255,199,102,0) 72%);
        will-change: opacity;
        animation: sky-breath 22s ease-in-out infinite;
      }
      .sun.dusk { background: radial-gradient(circle at 50% 50%, #ffe9c9 0%, #ffab68 32%, rgba(240,124,88,.40) 58%, rgba(240,124,88,0) 74%); }
      .rays {
        position: absolute; width: 460px; height: 460px; margin: -230px 0 0 -230px;
        border-radius: 50%;
        background: repeating-conic-gradient(rgba(255,214,130,.13) 0deg 3deg, rgba(255,214,130,0) 3deg 22deg);
        -webkit-mask: radial-gradient(circle, transparent 12%, #000 22%, #000 62%, transparent 74%);
        mask: radial-gradient(circle, transparent 12%, #000 22%, #000 62%, transparent 74%);
        will-change: transform;
        animation: sky-spin 190s linear infinite;
      }
      .rays.dusk { background: repeating-conic-gradient(rgba(255,163,110,.11) 0deg 3deg, rgba(255,163,110,0) 3deg 22deg); }

      /* Dunstband über dem Horizont — lässt die Ferne zurücktreten */
      .haze {
        position: absolute; left: 0; right: 0; bottom: 24%; height: 18%;
        background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.14) 100%);
      }

      /* ══ WOLKEN ══ drei weiche Kreise über flacher Unterkante — gezeichnet,
         nicht fotografiert. Anzahl = Bedeckungsgrad, Tempo = echter Wind. */
      .cloud {
        position: absolute;
        background:
          radial-gradient(circle at 28% 62%, rgba(205,214,244,.80) 0 30px, rgba(205,214,244,0) 31px),
          radial-gradient(circle at 52% 44%, rgba(205,214,244,.86) 0 39px, rgba(205,214,244,0) 40px),
          radial-gradient(circle at 76% 64%, rgba(205,214,244,.74) 0 27px, rgba(205,214,244,0) 28px),
          linear-gradient(to top, rgba(205,214,244,.68) 0 15px, rgba(205,214,244,0) 16px);
        background-size: cover;
        filter: blur(1.5px);
        will-change: transform;
        animation-name: sky-sail;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .cloud.warm {
        background:
          radial-gradient(circle at 28% 62%, rgba(255,196,158,.72) 0 30px, rgba(255,196,158,0) 31px),
          radial-gradient(circle at 52% 44%, rgba(255,206,172,.78) 0 39px, rgba(255,206,172,0) 40px),
          radial-gradient(circle at 76% 64%, rgba(255,186,150,.66) 0 27px, rgba(255,186,150,0) 28px),
          linear-gradient(to top, rgba(255,196,158,.60) 0 15px, rgba(255,196,158,0) 16px);
      }
      .cloud.night {
        background:
          radial-gradient(circle at 28% 62%, rgba(120,130,165,.55) 0 30px, rgba(120,130,165,0) 31px),
          radial-gradient(circle at 52% 44%, rgba(126,136,172,.62) 0 39px, rgba(126,136,172,0) 40px),
          radial-gradient(circle at 76% 64%, rgba(114,124,158,.50) 0 27px, rgba(114,124,158,0) 28px),
          linear-gradient(to top, rgba(120,130,165,.46) 0 15px, rgba(120,130,165,0) 16px);
      }

      /* Zwei Vögel, nur bei ruhigem Wetter am Tag */
      .bird {
        position: absolute; width: 26px; height: 13px;
        background-color: rgba(30,40,60,.55);
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='13'><path d='M2 9 C6 2 9 2 13 8 C17 2 20 2 24 9' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>") no-repeat center / contain;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='13'><path d='M2 9 C6 2 9 2 13 8 C17 2 20 2 24 9' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>") no-repeat center / contain;
        will-change: transform;
      }
      .bird.b1 { top: 21%; animation: sky-fly 128s linear infinite; }
      .bird.b2 { top: 25%; transform: scale(.72); animation: sky-fly 155s linear infinite; animation-delay: -44s; }

      /* ══ NIEDERSCHLAG ══ eine Ebene, nur verschoben (Compositor) ═══════ */
      .rain {
        position: absolute; inset: -25% -12%;
        background-image: repeating-linear-gradient(101deg, rgba(205,214,244,.40) 0 1px, rgba(205,214,244,0) 1px 9px);
        opacity: .5; will-change: transform;
        animation: sky-rain .55s linear infinite;
      }
      .rain.far {
        background-image: repeating-linear-gradient(99deg, rgba(205,214,244,.24) 0 1px, rgba(205,214,244,0) 1px 15px);
        opacity: .34; animation-duration: .95s;
      }
      .rain.heavy { opacity: .72; animation-duration: .38s; }
      .snow {
        position: absolute; inset: -25%;
        background-image: radial-gradient(circle, rgba(255,255,255,.9) 0 1.7px, rgba(255,255,255,0) 2.4px);
        background-size: 95px 95px; will-change: transform;
        animation: sky-snow 15s linear infinite;
      }
      .snow.s2 { background-size: 140px 140px; opacity: .7; animation-duration: 22s; }
      .snow.s3 { background-size: 62px 62px; opacity: .45; animation-duration: 10s; }
      .fogband {
        position: absolute; left: -20%; right: -20%; height: 22%;
        background: linear-gradient(180deg, rgba(226,232,240,0), rgba(226,232,240,.30), rgba(226,232,240,0));
        will-change: transform;
      }
      .fogband.f1 { top: 38%; animation: sky-fog 90s ease-in-out infinite alternate; }
      .fogband.f2 { top: 58%; opacity: .7; animation: sky-fog 130s ease-in-out infinite alternate-reverse; }
      .flash {
        position: absolute; inset: 0;
        background: radial-gradient(58% 42% at 62% 16%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%);
        opacity: 0; will-change: opacity;
        animation: sky-flash 11s linear infinite;
      }

      /* ══ BODEN ══ leichte Wiese, Farbe folgt der Jahreszeit ═══════════ */
      .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 27%; }
      .ground.spring { --meadow-far: #6f9f57; --meadow-near: #8fc76c; --grass: #7ab760; --tree: #3f6b3a; }
      .ground.summer { --meadow-far: #55913f; --meadow-near: #7cb654; --grass: #6aa94a; --tree: #2f5c31; }
      .ground.autumn { --meadow-far: #8a7538; --meadow-near: #c69d50; --grass: #ae9249; --tree: #6b4a24; }
      .ground.winter { --meadow-far: #b3c1d0; --meadow-near: #e7eef5; --grass: #a6b6c3; --tree: #3d4a58; }

      /* Baumreihe am Horizont — von Hand gezeichnete Kronen, als Maske
         eingefärbt, damit eine SVG-Form für alle Jahreszeiten reicht. */
      .ground .treeline {
        position: absolute; left: 0; right: 0; top: -46px; height: 74px;
        background-color: var(--tree); opacity: .92;
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='74'><g fill='white'><path d='M0 74 L0 58 C10 58 12 44 22 44 C32 44 34 56 44 57 L44 74Z'/><ellipse cx='72' cy='50' rx='26' ry='19'/><rect x='68' y='52' width='8' height='22'/><path d='M112 74 L104 74 L108 40 L112 74Z'/><path d='M96 52 L108 26 L120 52Z'/><path d='M100 62 L108 40 L116 62Z'/><ellipse cx='152' cy='54' rx='30' ry='21'/><rect x='148' y='56' width='9' height='18'/><ellipse cx='206' cy='48' rx='22' ry='17'/><rect x='202' y='50' width='7' height='24'/><path d='M244 74 L236 74 L240 34 L244 74Z'/><path d='M228 50 L240 20 L252 50Z'/><path d='M232 62 L240 38 L248 62Z'/><ellipse cx='288' cy='53' rx='28' ry='20'/><rect x='284' y='55' width='8' height='19'/><ellipse cx='336' cy='49' rx='20' ry='16'/><rect x='333' y='51' width='7' height='23'/><path d='M380 74 L372 74 L376 42 L380 74Z'/><path d='M364 54 L376 28 L388 54Z'/><ellipse cx='412' cy='55' rx='24' ry='18'/></g></svg>") repeat-x bottom / 420px 74px;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='74'><g fill='white'><path d='M0 74 L0 58 C10 58 12 44 22 44 C32 44 34 56 44 57 L44 74Z'/><ellipse cx='72' cy='50' rx='26' ry='19'/><rect x='68' y='52' width='8' height='22'/><path d='M112 74 L104 74 L108 40 L112 74Z'/><path d='M96 52 L108 26 L120 52Z'/><path d='M100 62 L108 40 L116 62Z'/><ellipse cx='152' cy='54' rx='30' ry='21'/><rect x='148' y='56' width='9' height='18'/><ellipse cx='206' cy='48' rx='22' ry='17'/><rect x='202' y='50' width='7' height='24'/><path d='M244 74 L236 74 L240 34 L244 74Z'/><path d='M228 50 L240 20 L252 50Z'/><path d='M232 62 L240 38 L248 62Z'/><ellipse cx='288' cy='53' rx='28' ry='20'/><rect x='284' y='55' width='8' height='19'/><ellipse cx='336' cy='49' rx='20' ry='16'/><rect x='333' y='51' width='7' height='23'/><path d='M380 74 L372 74 L376 42 L380 74Z'/><path d='M364 54 L376 28 L388 54Z'/><ellipse cx='412' cy='55' rx='24' ry='18'/></g></svg>") repeat-x bottom / 420px 74px;
      }
      .ground .meadow {
        position: absolute; inset: 0;
        background:
          radial-gradient(120% 60% at 30% 0%, rgba(255,255,255,.14), transparent 60%),
          linear-gradient(180deg, var(--meadow-far) 0%, var(--meadow-near) 100%);
      }
      /* Blumen: gestreute Punkte, je Jahreszeit andere Farben */
      .ground .flowers { position: absolute; inset: 0; opacity: .85; }
      .ground.spring .flowers {
        background-image:
          radial-gradient(circle, #ffffff 0 2.2px, transparent 3px),
          radial-gradient(circle, #f9e2af 0 2px, transparent 2.8px),
          radial-gradient(circle, #f5c2e7 0 1.8px, transparent 2.6px);
        background-size: 96px 62px, 138px 84px, 172px 108px;
        background-position: 14px 26px, 62px 12px, 110px 48px;
      }
      .ground.summer .flowers {
        background-image:
          radial-gradient(circle, #f38ba8 0 2.4px, transparent 3.2px),
          radial-gradient(circle, #ffffff 0 2px, transparent 2.8px),
          radial-gradient(circle, #f9e2af 0 1.8px, transparent 2.6px);
        background-size: 118px 70px, 88px 56px, 164px 96px;
        background-position: 22px 30px, 54px 16px, 96px 54px;
      }
      .ground.autumn .flowers {
        background-image:
          radial-gradient(circle, #e8b45c 0 2px, transparent 2.8px),
          radial-gradient(circle, #d08b4a 0 1.6px, transparent 2.4px);
        background-size: 132px 78px, 186px 112px;
        background-position: 26px 34px, 88px 60px;
        opacity: .6;
      }
      .ground.winter .flowers { opacity: 0; }
      /* Grashalme an der Unterkante, ganz leicht im Wind */
      .ground .grass {
        position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
        background-color: var(--grass);
        transform-origin: bottom center; will-change: transform;
        animation: sky-sway 11s ease-in-out infinite;
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='210' height='44'><g fill='white'><path d='M6 44 C9 30 3 22 11 8 C8 24 12 32 12 44Z'/><path d='M24 44 C26 34 22 26 28 16 C26 28 30 34 30 44Z'/><path d='M44 44 C48 28 40 20 50 4 C45 22 52 32 50 44Z'/><path d='M66 44 C68 36 64 28 70 20 C68 30 72 36 72 44Z'/><path d='M86 44 C90 30 82 22 92 10 C87 26 94 34 92 44Z'/><path d='M108 44 C110 34 106 26 112 14 C110 28 114 34 114 44Z'/><path d='M128 44 C132 32 124 24 134 12 C129 28 136 34 134 44Z'/><path d='M150 44 C152 36 148 28 154 18 C152 30 156 36 156 44Z'/><path d='M170 44 C174 28 166 20 176 6 C171 24 178 32 176 44Z'/><path d='M192 44 C194 34 190 26 196 16 C194 28 198 34 198 44Z'/></g></svg>") repeat-x bottom / 210px 44px;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='210' height='44'><g fill='white'><path d='M6 44 C9 30 3 22 11 8 C8 24 12 32 12 44Z'/><path d='M24 44 C26 34 22 26 28 16 C26 28 30 34 30 44Z'/><path d='M44 44 C48 28 40 20 50 4 C45 22 52 32 50 44Z'/><path d='M66 44 C68 36 64 28 70 20 C68 30 72 36 72 44Z'/><path d='M86 44 C90 30 82 22 92 10 C87 26 94 34 92 44Z'/><path d='M108 44 C110 34 106 26 112 14 C110 28 114 34 114 44Z'/><path d='M128 44 C132 32 124 24 134 12 C129 28 136 34 134 44Z'/><path d='M150 44 C152 36 148 28 154 18 C152 30 156 36 156 44Z'/><path d='M170 44 C174 28 166 20 176 6 C171 24 178 32 176 44Z'/><path d='M192 44 C194 34 190 26 196 16 C194 28 198 34 198 44Z'/></g></svg>") repeat-x bottom / 210px 44px;
      }
      .ground.winter .grass { height: 30px; opacity: .75; }
      /* Abend/Nacht legen sich als ruhige Decke über die Wiese */
      .ground.dusk::after, .ground.night::after {
        content: ""; position: absolute; left: 0; right: 0; top: -46px; bottom: 0;
        pointer-events: none;
      }
      .ground.dusk::after  { background: linear-gradient(180deg, rgba(74,38,58,.60), rgba(26,16,32,.78)); }
      .ground.night::after { background: linear-gradient(180deg, rgba(12,14,30,.82), rgba(8,9,20,.93)); }

      /* Fallende Blätter im Herbst */
      .leaf {
        position: absolute; width: 9px; height: 6px; border-radius: 60% 40% 55% 45%;
        background: #d08b4a; opacity: .8; will-change: transform;
      }
      .leaf.l1 { left: 18%; top: -50%; animation: sky-leaf 17s linear infinite; }
      .leaf.l2 { left: 52%; top: -50%; background: #c2703c; animation: sky-leaf 23s linear infinite; animation-delay: -9s; }
      .leaf.l3 { left: 78%; top: -50%; background: #e8b45c; animation: sky-leaf 20s linear infinite; animation-delay: -15s; }
      /* Glühwürmchen in Sommernächten */
      .firefly {
        position: absolute; width: 5px; height: 5px; border-radius: 50%;
        background: radial-gradient(circle, #f9e2af 0%, rgba(249,226,175,0) 70%);
        will-change: transform, opacity;
      }
      .firefly.f1 { left: 16%; bottom: 34%; animation: sky-blink 5.5s ease-in-out infinite, sky-hover 19s ease-in-out infinite; }
      .firefly.f2 { left: 38%; bottom: 20%; animation: sky-blink 7s ease-in-out infinite 1.5s, sky-hover 24s ease-in-out infinite reverse; }
      .firefly.f3 { left: 63%; bottom: 41%; animation: sky-blink 6.2s ease-in-out infinite .8s, sky-hover 21s ease-in-out infinite; }
      .firefly.f4 { left: 84%; bottom: 26%; animation: sky-blink 8s ease-in-out infinite 2.4s, sky-hover 27s ease-in-out infinite reverse; }

      @keyframes sky-drift-a { from { transform: translate3d(0,0,0); }     to { transform: translate3d(-180px,-70px,0); } }
      @keyframes sky-drift-b { from { transform: translate3d(0,0,0); }     to { transform: translate3d(120px,60px,0); } }
      @keyframes sky-twinkle { from { opacity: .25; }                      to { opacity: .8; } }
      @keyframes sky-breath  { 0%,100% { opacity: .85; }                   50% { opacity: 1; } }
      @keyframes sky-spin    { to { transform: rotate(360deg); } }
      @keyframes sky-sail    { from { transform: translate3d(-32vw,0,0); } to { transform: translate3d(114vw,0,0); } }
      @keyframes sky-fly     { from { transform: translate3d(-10vw,0,0); } to { transform: translate3d(112vw,-40px,0); } }
      @keyframes sky-rain    { to { transform: translate3d(-44px, 210px, 0); } }
      @keyframes sky-snow    { to { transform: translate3d(34px, 340px, 0); } }
      @keyframes sky-fog     { from { transform: translate3d(-6%,0,0); }   to { transform: translate3d(6%,0,0); } }
      @keyframes sky-flash   { 0%,92%,100% { opacity: 0; } 93% { opacity: .85; } 94% { opacity: .12; } 95% { opacity: .65; } 96.5% { opacity: 0; } }
      @keyframes sky-sway    { 0%,100% { transform: skewX(0deg); }         50% { transform: skewX(2.2deg); } }
      @keyframes sky-leaf    { from { transform: translate3d(0,0,0) rotate(0deg); } to { transform: translate3d(-70px, 150vh, 0) rotate(540deg); } }
      @keyframes sky-blink   { 0%,100% { opacity: .15; }                   50% { opacity: 1; } }
      @keyframes sky-hover   { 0%,100% { transform: translate3d(0,0,0); }  50% { transform: translate3d(26px,-18px,0); } }

      @media (prefers-reduced-motion: reduce) {
        .stars, .stars2, .moon, .sun, .rays, .cloud, .bird,
        .rain, .snow, .fogband, .flash, .grass, .leaf, .firefly { animation: none !important; }
      }
      /* Schutz vor dem Glas-Helfer: der Himmel bleibt eine feste Ebene ohne Glanz */
      ha-card { position: fixed !important; }
      ha-card::before { content: none !important; }

        .moonwrap {
          position: absolute;
          width: 92px; height: 92px;
          margin: -46px 0 0 -46px;
          pointer-events: none;
          filter: drop-shadow(0 0 18px rgba(249,226,175,.28));
          transition: left 2s linear, top 2s linear;
        }
        .moondisc { width: 100%; height: 100%; display: block; }

  aurora_light:
    template: aurora_base
    show_state: true
    show_name: true
    size: 28px
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    state_display: |
      [[[
        if (entity && entity.state === 'on') {
          const b = entity.attributes.brightness;
          return b ? Math.round(b / 2.55) + ' %' : 'ON';
        }
        return entity && entity.state === 'unavailable' ? '—' : 'OFF';
      ]]]
    styles:
      grid:
      - grid-template-areas: "'i' 'n' 's'"
      - grid-template-rows: 1fr min-content min-content
      card:
      - height: 118px
      - padding: 12px 8px
      - transition: all .25s ease
      img_cell:
      - width: 46px
      - height: 46px
      - margin: 0 auto
      - border-radius: 50%
      - background: "rgba(88,91,112,0.18)"
      - transition: background .3s ease
      icon:
      - color: "#585b70"
      - transition: color .3s ease
      name:
      - font-size: 12px
      - margin-top: 6px
      - white-space: normal
      - line-height: 1.15
      state:
      - font-size: 10.5px
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - color: "#a6adc8"
      - letter-spacing: .06em
    state:
    - value: "on"
      styles:
        card:
        - "--aurora-glow": "#f9e2af"
        - border: 1px solid rgba(249,226,175,0.35)
        - box-shadow: "0 0 30px -8px rgba(249,226,175,0.45), 0 10px 40px -12px rgba(0,0,0,0.65)"
        - "--aurora-halo-anim": "aurora-halo-strong 2.4s ease-out infinite"
        - "--aurora-halo-width": "3px"
        img_cell:
        - background: "rgba(249,226,175,0.12)"
        icon:
        - color: "#f9e2af"
        - animation: |
            [[[
              const d = (entity.entity_id.length % 4) * 0.5;
              const f = (entity.entity_id.length % 7) * 1.3;
              return 'aurora-breathe 2.8s ease-in-out ' + d + 's infinite, aurora-flicker 9s ease-in-out -' + f + 's infinite';
            ]]]

  aurora_switch:
    template: aurora_light
    state:
    - value: "on"
      styles:
        card:
        - "--aurora-glow": "#a6e3a1"
        - border: 1px solid rgba(166,227,161,0.35)
        - box-shadow: "0 0 30px -8px rgba(166,227,161,0.4), 0 10px 40px -12px rgba(0,0,0,0.65)"
        - "--aurora-halo-anim": "aurora-halo-strong 2.4s ease-out infinite"
        - "--aurora-halo-width": "3px"
        img_cell:
        - background: "rgba(166,227,161,0.12)"
        icon:
        - color: "#a6e3a1"
        - animation: aurora-breathe 2.8s ease-in-out infinite

  aurora_scene:
    template: aurora_base
    show_icon: true
    show_name: true
    icon: mdi:palette
    size: 20px
    tap_action:
      action: toggle
    styles:
      grid:
      - grid-template-areas: "'i n'"
      - grid-template-columns: 32px 1fr
      card:
      - min-height: 54px
      - padding: 8px 12px
      icon:
      - color: "#cba6f7"
      - animation: |
          [[[
            const d = (entity.entity_id.length % 9) * 0.8;
            return 'aurora-shimmer 6s ease-in-out ' + d + 's infinite';
          ]]]
      name:
      - justify-self: start
      - text-align: left
      - font-size: 11.5px
      - white-space: normal
      - line-height: 1.2

  aurora_person:
    template: aurora_base
    show_entity_picture: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    state_display: |
      [[[
        if (entity.state === 'home') return 'Home';
        if (entity.state === 'not_home') return 'Away';
        return entity.state;
      ]]]
    styles:
      grid:
      - grid-template-areas: "'i' 'n' 's'"
      - grid-template-rows: 1fr min-content min-content
      card:
      - height: 132px
      - padding: 14px 8px
      entity_picture:
      - width: 58px
      - height: 58px
      - border-radius: 50%
      - border: "2px solid #585b70"
      - transition: all .3s ease
      name:
      - font-size: 13px
      - margin-top: 8px
      state:
      - font-size: 10.5px
      - color: "#a6adc8"
      - letter-spacing: .06em
      - text-transform: uppercase
    state:
    - value: home
      styles:
        entity_picture:
        - border: "2px solid #a6e3a1"
        - box-shadow: 0 0 18px -2px rgba(166,227,161,0.55)
        state:
        - color: "#a6e3a1"
    - value: not_home
      styles:
        entity_picture:
        - filter: grayscale(60%)

  aurora_window:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: true
    size: 24px
    tap_action:
      action: more-info
    state_display: |
      [[[ return entity.state === 'on' ? 'OPEN' : 'CLOSED'; ]]]
    styles:
      grid:
      - grid-template-areas: "'i n' 'i s'"
      - grid-template-columns: 44px 1fr
      card:
      - height: 62px
      - padding: 8px 12px
      icon:
      - color: "#a6e3a1"
      - animation: aurora-float 8s ease-in-out infinite
      name:
      - justify-self: start
      - align-self: end
      - text-align: left
      - font-size: 12px
      - white-space: normal
      - line-height: 1.1
      state:
      - justify-self: start
      - align-self: start
      - font-size: 10px
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - color: "#a6adc8"
      - letter-spacing: .1em
    state:
    - value: "on"
      styles:
        card:
        - border: 1px solid rgba(250,179,135,0.4)
        icon:
        - color: "#fab387"
        - animation: aurora-pulse 1.6s ease-in-out infinite
        state:
        - color: "#fab387"

  aurora_battery:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: true
    size: 24px
    tap_action:
      action: more-info
    styles:
      grid:
      - grid-template-areas: "'i s' 'i n'"
      - grid-template-columns: 44px 1fr
      card:
      - height: 62px
      - padding: 8px 12px
      icon:
      - color: |
          [[[
            const v = parseFloat(entity.state);
            if (isNaN(v)) return '#585b70';
            return v <= 20 ? '#f38ba8' : v <= 40 ? '#f9e2af' : '#a6e3a1';
          ]]]
      - animation: |
          [[[
            const v = parseFloat(entity.state);
            if (v <= 20) return 'aurora-pulse 1.2s ease-in-out infinite';
            if (v <= 40) return 'aurora-blink 3.4s ease-in-out infinite';
            const d = (entity.entity_id.length % 5) * 0.6;
            return 'aurora-float 8s ease-in-out ' + d + 's infinite';
          ]]]
      state:
      - justify-self: start
      - align-self: end
      - font-size: 16px
      - font-weight: 700
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      name:
      - justify-self: start
      - align-self: start
      - text-align: left
      - font-size: 10.5px
      - color: "#a6adc8"
      - white-space: normal
      - line-height: 1.1

  # Room header: icon + room name (mono uppercase) left, big glowing temperature
  # right, plus a pulsing "window open" line fed by a second entity (variables.window).
  aurora_room:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: true
    size: 22px
    # No `triggers_update: all` — that would re-render this card on EVERY state
    # change in the whole system. Bind the window sensor per instance instead.
    tap_action:
      action: more-info
    variables:
      accent: "#cba6f7"
      accent_bg: "rgba(203,166,247,0.10)"
      window: ""
    state_display: |
      [[[
        const v = parseFloat(entity ? entity.state : NaN);
        return isNaN(v) ? '' : v.toFixed(1) + ' °C';
      ]]]
    custom_fields:
      win: |
        [[[
          if (!variables.window) return '';
          const w = states[variables.window];
          return (w && w.state === 'on') ? '● WINDOW OPEN' : '';
        ]]]
    styles:
      grid:
      - grid-template-areas: "'i n s' 'i win s'"
      - grid-template-columns: 46px 1fr auto
      - grid-template-rows: min-content min-content
      card:
      - padding: 14px 16px 6px 16px
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: 0
      img_cell:
      - grid-area: i
      - width: 38px
      - height: 38px
      - border-radius: 12px
      - background: "[[[ return variables.accent_bg; ]]]"
      - align-self: center
      icon:
      - color: "[[[ return variables.accent; ]]]"
      - animation: aurora-bob 7s ease-in-out infinite
      name:
      - grid-area: n
      - justify-self: start
      - align-self: center
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: "clamp(11px, 3vw, 14px)"
      - font-weight: 700
      - letter-spacing: .14em
      - text-transform: uppercase
      - color: "#cdd6f4"
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - min-width: 0
      state:
      - grid-area: s
      - justify-self: end
      - align-self: center
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: "clamp(16px, 5vw, 24px)"
      - font-weight: 800
      - color: "[[[ return variables.accent; ]]]"
      - text-shadow: "[[[ return '0 0 14px ' + variables.accent + '80'; ]]]"
      custom_fields:
        win:
        - grid-area: win
        - justify-self: start
        - margin-top: 2px
        - font-size: 9.5px
        - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
        - letter-spacing: .12em
        - color: "#fab387"
          # own compositor layer — otherwise every pulse frame makes the browser
          # recompute the backdrop-filter of the whole room card
        - will-change: transform, opacity
          # Only pulse when a window is actually open. A permanent animation in
          # this large glass card measured ~9 % CPU on its own.
        - animation: |
            [[[
              if (!variables.window) return 'none';
              const w = states[variables.window];
              return (w && w.state === 'on') ? 'aurora-pulse 1.6s ease-in-out infinite' : 'none';
            ]]]

  # Small group header inside a room card (mono label + count).
    # On a phone the big temperature eats the room name ("LIVING ROOM" →
    # "LIV…"). Dial back letter-spacing and font sizes there. !important is
    # required because button-card writes these styles inline.
    extra_styles: |
      @media (max-width: 620px) {
        #name {
          font-size: 10px !important;
          letter-spacing: .02em !important;
          white-space: normal !important;
          overflow: visible !important;
          line-height: 1.15 !important;
        }
        #state { font-size: 17px !important; }
        #img-cell { width: 32px !important; height: 32px !important; }
      }

  aurora_group_header:
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    size: 15px
    tap_action:
      action: none
    variables:
      accent: "#cba6f7"
    styles:
      grid:
      - grid-template-areas: "'i n l'"
      - grid-template-columns: 26px 1fr auto
      card:
      - padding: 12px 16px 2px 16px
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: 0
      img_cell:
      - grid-area: i
      - justify-self: start
      icon:
      - color: "[[[ return variables.accent; ]]]"
      - animation: aurora-float 6s ease-in-out infinite
      name:
      - grid-area: n
      - justify-self: start
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: 10.5px
      - font-weight: 700
      - letter-spacing: .16em
      - text-transform: uppercase
      - color: "#a6adc8"
      label:
      - grid-area: l
      - justify-self: end
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: 11px
      - font-weight: 700
      - color: "[[[ return variables.accent; ]]]"
      - opacity: "0.85"

  # Automation tile: on = green robot with a gentle wobble, off = grey.
  aurora_automation:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: true
    size: 20px
    icon: mdi:robot
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    variables:
      accent: "#a6e3a1"
    state_display: |
      [[[ return entity.state === 'on' ? 'ACTIVE' : 'OFF'; ]]]
    name: |
      [[[
        return (entity.attributes.friendly_name || entity.entity_id)
          .replace(/^[A-Za-zÄÖÜäöü ]{3,18}[:·\-—]\s+/, '');
      ]]]
    styles:
      grid:
      - grid-template-areas: "'i n' 'i s'"
      - grid-template-columns: 38px 1fr
      card:
      - min-height: 58px
      - padding: 8px 12px
      - transition: all .25s ease
      img_cell:
      - grid-area: i
      - justify-self: start
      icon:
      - color: "#585b70"
      - transition: color .3s ease
      name:
      - grid-area: n
      - justify-self: start
      - align-self: end
      - text-align: left
      - font-size: 11.5px
      - line-height: 1.15
      - white-space: normal
      - overflow: hidden
      state:
      - grid-area: s
      - justify-self: start
      - align-self: start
      - font-size: 9px
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - letter-spacing: .14em
      - color: "#6c7086"
    state:
    - value: "on"
      styles:
        card:
        - "--aurora-glow": "[[[ return variables.accent; ]]]"
        - border: "[[[ return '1px solid ' + variables.accent + '38'; ]]]"
        icon:
        - color: "[[[ return variables.accent; ]]]"
        - animation: |
            [[[
              const d = (entity.entity_id.length % 5) * 0.7;
              return 'aurora-wobble 4.5s ease-in-out ' + d + 's infinite';
            ]]]
        state:
        - color: "[[[ return variables.accent; ]]]"

  # Valve position: the icon spins while the valve is open (faster = wider).
  aurora_valve:
    template: aurora_metric
    styles:
      icon:
      - color: |
          [[[
            const v = parseFloat(entity.state);
            if (isNaN(v) || v <= 0) return '#585b70';
            return v >= 60 ? '#f38ba8' : v >= 25 ? '#fab387' : '#f9e2af';
          ]]]
      - animation: |
          [[[
            const v = parseFloat(entity.state);
            if (isNaN(v) || v <= 0) return 'none';
            const dur = Math.max(1.2, 6 - (v / 20));
            return 'aurora-spin ' + dur.toFixed(1) + 's linear infinite';
          ]]]

  # Script / action tile: tap runs it, the icon swings while it is running.
  aurora_action:
    template: aurora_metric
    show_state: true
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    state_display: |
      [[[ return entity.state === 'on' ? 'RUNNING …' : 'RUN'; ]]]
    variables:
      accent: "#89dceb"
      accent_bg: "rgba(137,220,235,0.10)"
    styles:
      icon:
      - animation: |
          [[[
            return entity.state === 'on'
              ? 'aurora-swing 1.1s ease-in-out infinite'
              : 'aurora-float 7s ease-in-out infinite';
          ]]]
      state:
      - font-size: 13px

  # Signal tile: dBm value with traffic-light color + bar icon, pulses when
  # the signal is very weak. For any BLE / Thread / WiFi RSSI sensor.
  aurora_signal:
    template: aurora_base
    show_icon: true
    show_name: true
    show_state: true
    size: 22px
    tap_action:
      action: more-info
    state_display: |
      [[[
        const v = parseFloat(entity.state);
        return isNaN(v) ? '—' : Math.round(v) + ' dBm';
      ]]]
    icon: |
      [[[
        const v = parseFloat(entity.state);
        if (isNaN(v)) return 'mdi:signal-off';
        return v >= -60 ? 'mdi:signal-cellular-3' : v >= -75 ? 'mdi:signal-cellular-2' : 'mdi:signal-cellular-1';
      ]]]
    name: |
      [[[
        return (entity.attributes.friendly_name || entity.entity_id)
          .replace(/ Signal strength$/, '');
      ]]]
    styles:
      grid:
      - grid-template-areas: "'i s' 'i n'"
      - grid-template-columns: 44px 1fr
      card:
      - height: 62px
      - padding: 8px 12px
      icon:
      - color: |
          [[[
            const v = parseFloat(entity.state);
            if (isNaN(v)) return '#585b70';
            return v >= -60 ? '#a6e3a1' : v >= -75 ? '#f9e2af' : '#f38ba8';
          ]]]
      - animation: |
          [[[
            return parseFloat(entity.state) < -85 ? 'aurora-pulse 1.4s ease-in-out infinite' : 'none';
          ]]]
      state:
      - justify-self: start
      - align-self: end
      - font-size: 15px
      - font-weight: 700
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - color: |
          [[[
            const v = parseFloat(entity.state);
            if (isNaN(v)) return '#585b70';
            return v >= -60 ? '#a6e3a1' : v >= -75 ? '#f9e2af' : '#f38ba8';
          ]]]
      name:
      - justify-self: start
      - align-self: start
      - text-align: left
      - font-size: 10.5px
      - color: "#a6adc8"
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - line-height: 1.1

  # Radar tile: aurora_metric with a rotating radar sweep behind the icon and
  # a halo pulse. For BLE scanners / sources.
  aurora_radar:
    template: aurora_metric
    extra_styles: |
      @keyframes aurora-spin { to { transform: rotate(360deg); } }
      @keyframes aurora-halo {
        0%       { box-shadow: 0 0 0 0 color-mix(in srgb, var(--aurora-glow,#94e2d5) 45%, transparent); }
        70%,100% { box-shadow: 0 0 0 12px transparent; }
      }
      @keyframes aurora-pulse {
        0%,100% { transform: scale(1); opacity: 1; }
        50%     { transform: scale(1.22); opacity: .6; }
      }
      #img-cell { position: relative; overflow: hidden; }
      #img-cell::before {
        content: "";
        position: absolute;
        inset: -35%;
        background: conic-gradient(from 0deg, transparent 62%, var(--aurora-glow, #94e2d5) 100%);
        animation: aurora-spin 3.5s linear infinite;
        opacity: .4;
      }
      @media (prefers-reduced-motion: reduce) {
        #img-cell::before { animation: none; }
      }
    styles:
      card:
      - "--aurora-glow": "[[[ return variables.accent; ]]]"
      - "--aurora-halo-anim": "aurora-halo 2.6s ease-out infinite"
      icon:
      - z-index: "1"

  # ─────────────────────────────────────────────────────────────────────────
  #  aurora_sky_btn — ONE button of the sky switch.
  #  Four of them side by side make a visible button row: the active setting
  #  lights up, the others stay grey. Deliberately NOT a cycle-through tile —
  #  that was simply not recognised as a switch.
  #  Each card sets variables.option AND its own service_data.option.
  # ─────────────────────────────────────────────────────────────────────────
  aurora_sky_btn:
    template: aurora_base
    show_icon: true
    show_name: true
    show_label: false
    show_state: false
    size: 21px
    entity: input_select.sky_mode
    triggers_update:
    - input_select.sky_mode
    - sun.sun
    variables:
      option: Auto
      accent: "#94e2d5"
    name: |
      [[[ return variables.option; ]]]
    styles:
      grid:
      - grid-template-areas: "'i' 'n'"
      - grid-template-rows: min-content min-content
      - justify-items: center
      card:
      - padding: 10px 6px
      - height: 68px
      - cursor: pointer
      - border: |
          [[[
            const a = states['input_select.sky_mode'];
            return (a && a.state === variables.option)
              ? '1px solid ' + variables.accent
              : '1px solid rgba(180,190,254,0.10)';
          ]]]
      - background: |
          [[[
            const a = states['input_select.sky_mode'];
            return (a && a.state === variables.option)
              ? 'color-mix(in srgb, ' + variables.accent + ' 16%, transparent)'
              : 'transparent';
          ]]]
      img_cell:
      - width: 34px
      - height: 34px
      icon:
      - color: |
          [[[
            const a = states['input_select.sky_mode'];
            return (a && a.state === variables.option) ? variables.accent : '#6c7086';
          ]]]
      name:
      - font-family: "ui-monospace, 'SF Mono', Menlo, monospace"
      - font-size: 11.5px
      - font-weight: 700
      - letter-spacing: .06em
      - margin-top: 3px
      - color: |
          [[[
            const a = states['input_select.sky_mode'];
            return (a && a.state === variables.option) ? '#cdd6f4' : '#7f849c';
          ]]]

  # ─────────────────────────────────────────────────────────────────────────
  #  aurora_status — the house traffic light.
  #  Shows what needs attention rather than what is always the same. When
  #  everything is quiet it simply says "All clear".
  #  Every check runs client-side in JavaScript — not a single Jinja template
  #  that Home Assistant would have to re-render on every state change.
  #  Message order: red → orange → yellow → blue.
  # ─────────────────────────────────────────────────────────────────────────
  aurora_status:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    variables:
      rooms:
      - name: Living Room
        window: binary_sensor.window_living_room
        climate: climate.trv_living_room
      - name: Kitchen
        window: binary_sensor.window_kitchen
        climate: climate.trv_kitchen
      - name: Bedroom
        window: binary_sensor.window_bedroom
        climate: climate.trv_bedroom
      - name: Office
        window: binary_sensor.window_office
        climate: climate.trv_office
      - name: Bathroom
        window: binary_sensor.window_bathroom
        climate: climate.trv_bathroom
      persons: []
      power: sensor.total_power
      power_limit: 4500
      outside: sensor.outdoor_temperature
      laundry: []
      holiday: ""
      batt_limit: 20
      # Phones, watches and laptops stay out — they are not a house problem
      batt_ignore: []
      # Deliberately EXPLICIT instead of "everything with device_class problem":
      # "…since boot" flags would stay red forever, and "notification active"
      # is not a fault at all.
      problems: []
    custom_fields:
      body: |
        [[[
          const V = variables;
          const S = states;
          const nm = (id, fb) => {
            const s = S[id];
            return (s && s.attributes && s.attributes.friendly_name) ? s.attributes.friendly_name : (fb || id);
          };
          const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };
          const items = [];
          const add = (rank, icon, text) => items.push({ rank, icon, text });

          // ── 1. Window open while the room is heating (red) ──────────────
          const openRooms = [];
          (V.rooms || []).forEach((r) => {
            const w = S[r.window];
            if (!w || w.state !== 'on') return;
            openRooms.push(r.name);
            const c = S[r.climate];
            const heating = c && c.state !== 'off' && c.state !== 'unavailable' &&
              (c.attributes.hvac_action === 'heating' ||
               (num(c.attributes.temperature) !== null && num(c.attributes.current_temperature) !== null &&
                num(c.attributes.temperature) > num(c.attributes.current_temperature) + 0.2));
            if (heating) add(0, 'mdi:radiator-off', r.name + ': window open, heating running');
          });

          // ── 2. Window open while it is cold outside (orange) ────────────
          const out = num((S[V.outside] || {}).state);
          if (openRooms.length) {
            const cold = out !== null && out < 15;
            add(cold ? 1 : 3,
                cold ? 'mdi:snowflake-alert' : 'mdi:window-open-variant',
                (openRooms.length === 1 ? 'Window open: ' : openRooms.length + ' windows open: ') +
                openRooms.join(', ') + (cold ? ' — ' + out.toFixed(1) + ' °C outside' : ''));
          }

          // ── 3. Device fault (red) ──────────────────────────────────────
          (V.problems || []).forEach((id) => {
            const s = S[id];
            if (s && s.state === 'on') add(0, 'mdi:alert-octagon', nm(id) + ' reports a fault');
          });

          // ── 4. Laundry finished (yellow) ───────────────────────────────
          (V.laundry || []).forEach((id) => {
            const s = S[id];
            if (!s) return;
            const st = String(s.state).toLowerCase();
            if (st.includes('end') || st.includes('finish') || st === 'programme_ended') {
              add(2, 'mdi:washing-machine', nm(id) + ' has finished');
            }
          });

          // ── 5. Nobody home but lights on (yellow) ──────────────────────
          const away = (V.persons || []).length > 0 &&
                       (V.persons || []).every((p) => S[p] && S[p].state !== 'home');
          const lightsOn = Object.values(S).filter((s) =>
            s.entity_id.startsWith('light.') && s.state === 'on');
          if (away && lightsOn.length) {
            add(1, 'mdi:lightbulb-alert',
                'Nobody home, but ' + lightsOn.length + ' light' + (lightsOn.length > 1 ? 's' : '') + ' still on');
          }

          // ── 6. Unusually high power draw (yellow) ──────────────────────
          const p = num((S[V.power] || {}).state);
          if (p !== null && p > Number(V.power_limit)) {
            add(2, 'mdi:flash-alert', 'Power draw unusually high: ' + Math.round(p) + ' W');
          }

          // ── 7. Low batteries (yellow) ──────────────────────────────────
          const ignore = V.batt_ignore || [];
          const weak = Object.values(S).filter((s) => {
            if (s.attributes.device_class !== 'battery') return false;
            if (ignore.includes(s.entity_id)) return false;
            const v = num(s.state);
            return v !== null && v <= Number(V.batt_limit);
          });
          if (weak.length) {
            const names = weak.slice(0, 2).map((s) => nm(s.entity_id).replace(/ Battery.*$/i, ''));
            add(2, 'mdi:battery-alert-variant',
                (weak.length === 1 ? 'Low battery: ' : weak.length + ' low batteries: ') +
                names.join(', ') + (weak.length > 2 ? ' …' : ''));
          }

          // ── 8. Updates (blue) ──────────────────────────────────────────
          const ups = Object.values(S).filter((s) =>
            s.entity_id.startsWith('update.') && s.state === 'on');
          if (ups.length) {
            add(3, 'mdi:package-up',
                ups.length + ' update' + (ups.length > 1 ? 's' : '') + ' available: ' +
                ups.slice(0, 2).map((s) => nm(s.entity_id).replace(/ Firmware.*| Update.*/i, '')).join(', ') +
                (ups.length > 2 ? ' …' : ''));
          }

          // ── 9. Holiday mode (blue, pure info) ──────────────────────────
          const hol = S[V.holiday];
          if (hol && hol.state === 'on') add(3, 'mdi:beach', 'Holiday mode is active');

          items.sort((a, b) => a.rank - b.rank);
          const TONE = ['#f38ba8', '#fab387', '#f9e2af', '#89b4fa'];

          if (!items.length) {
            return `<div class="ampel ok">
              <div class="badge"><ha-icon icon="mdi:shield-check"></ha-icon></div>
              <div class="txt"><div class="head">All clear</div>
              <div class="sub">No open windows, no flat batteries, nothing to do.</div></div>
            </div>`;
          }
          const worst = items[0].rank;
          const rows = items.slice(0, 6).map((it) =>
            `<div class="row"><ha-icon icon="${it.icon}" style="color:${TONE[it.rank]}"></ha-icon>` +
            `<span>${it.text}</span></div>`).join('');
          const more = items.length > 6 ? `<div class="row muted"><ha-icon icon="mdi:dots-horizontal"></ha-icon><span>and ${items.length - 6} more</span></div>` : '';
          return `<div class="ampel" style="--tone:${TONE[worst]}">
            <div class="badge"><ha-icon icon="mdi:alert-decagram"></ha-icon></div>
            <div class="txt">
              <div class="head">${items.length} ${items.length === 1 ? 'thing needs' : 'things need'} you</div>
              <div class="rows">${rows}${more}</div>
            </div>
          </div>`;
        ]]]
    styles:
      card:
      - padding: "0"
      grid:
      - grid-template-areas: "'body'"
    extra_styles: |
      .ampel {
        display: grid;
        grid-template-columns: 64px 1fr;
        gap: 14px;
        align-items: start;
        padding: 16px 18px;
        text-align: left;
      }
      .badge {
        width: 52px; height: 52px; border-radius: 16px;
        display: grid; place-items: center;
        background: color-mix(in srgb, var(--tone, #a6e3a1) 16%, transparent);
        color: var(--tone, #a6e3a1);
        --mdc-icon-size: 30px;
        position: relative;
      }
      /* The ring only pulses when something is actually pending — and it scales
         a pseudo element instead of animating a shadow (which would force the
         card's blur to be recomputed on every frame). */
      .badge::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit;
        box-shadow: 0 0 0 2px var(--tone, #a6e3a1);
        opacity: 0; will-change: transform, opacity;
        animation: aurora-halo 2.6s ease-out infinite;
      }
      .ampel.ok { --tone: #a6e3a1; }
      .ampel.ok .badge::after { animation: none; }
      .head {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 20px; font-weight: 700; color: #cdd6f4;
        letter-spacing: .01em; margin-bottom: 6px;
      }
      .sub { font-size: 13px; color: #a6adc8; }
      .rows { display: grid; gap: 6px; }
      .row {
        display: grid; grid-template-columns: 22px 1fr; gap: 10px;
        align-items: center; font-size: 13.5px; color: #cdd6f4;
        --mdc-icon-size: 19px;
      }
      /* button-card sets card text to nowrap — without this, long device names
         are simply cut off on a phone. */
      .row span {
        min-width: 0; white-space: normal; overflow-wrap: anywhere;
        line-height: 1.35; text-align: left;
      }
      .row.muted, .row.muted ha-icon { color: #7f849c; }
      @media (max-width: 520px) {
        .ampel { grid-template-columns: 52px 1fr; gap: 10px; padding: 14px; }
        .badge { width: 44px; height: 44px; --mdc-icon-size: 25px; }
        .head { font-size: 17px; }
        .row { font-size: 12.5px; }
      }

  # ─────────────────────────────────────────────────────────────────────────
  #  aurora_skymode — switch for the sky scene.
  #  Tapping steps through: Auto → Day → Dusk → Night → Auto.
  # ─────────────────────────────────────────────────────────────────────────
  aurora_skymode:
    template: aurora_chip
    entity: input_select.sky_mode
    triggers_update:
    - input_select.sky_mode
    - sun.sun
    label: Sky
    name: |
      [[[
        const s = states['input_select.sky_mode'];
        return s ? s.state : '—';
      ]]]
    icon: |
      [[[
        const s = states['input_select.sky_mode'];
        const m = s ? s.state : 'Auto';
        if (m === 'Day') return 'mdi:weather-sunny';
        if (m === 'Dusk') return 'mdi:weather-sunset';
        if (m === 'Night') return 'mdi:weather-night';
        return 'mdi:theme-light-dark';
      ]]]
    tap_action:
      action: call-service
      service: input_select.select_next
      service_data:
        entity_id: input_select.sky_mode
        cycle: true
    styles:
      icon:
      - color: |
          [[[
            const s = states['input_select.sky_mode'];
            const m = s ? s.state : 'Auto';
            if (m === 'Day') return '#f9e2af';
            if (m === 'Dusk') return '#fab387';
            if (m === 'Night') return '#b4befe';
            return '#94e2d5';
          ]]]

views:

  # ═════════════════════════ 1 · ÜBERSICHT ═════════════════════════
- title: Overview
  path: home
  icon: mdi:view-dashboard-variant
  theme: Aurora
  type: sections
  max_columns: 3
  sections:

  - type: grid
    column_span: 3
    cards:
    - type: custom:button-card
      template: aurora_sky
      grid_options:
        columns: full
          # House traffic light: right at the top, because it is the only card
          # that tells you whether anything needs doing.
          # Bind it to the entities it reads — `triggers_update: all` would
          # re-render it on every state change anywhere in Home Assistant.
    - type: custom:button-card
      template: aurora_status
      grid_options:
        columns: full
      triggers_update:
      - binary_sensor.window_living_room
      - binary_sensor.window_kitchen
      - binary_sensor.window_bedroom
      - binary_sensor.window_office
      - binary_sensor.window_bathroom
      - climate.trv_living_room
      - climate.trv_kitchen
      - climate.trv_bedroom
      - climate.trv_office
      - climate.trv_bathroom
      - sensor.outdoor_temperature
      - sensor.total_power
          # Visible button row for the sky — right under the status card, so you
          # find it without looking for it.
    - type: grid
      grid_options:
        columns: full
      columns: 4
      square: false
      cards:
      - type: custom:button-card
        template: aurora_sky_btn
        icon: mdi:theme-light-dark
        variables:
          option: Auto
          accent: "#94e2d5"
        tap_action:
          action: call-service
          service: input_select.select_option
          service_data:
            entity_id: input_select.sky_mode
            option: Auto
      - type: custom:button-card
        template: aurora_sky_btn
        icon: mdi:weather-sunny
        variables:
          option: Day
          accent: "#f9e2af"
        tap_action:
          action: call-service
          service: input_select.select_option
          service_data:
            entity_id: input_select.sky_mode
            option: Day
      - type: custom:button-card
        template: aurora_sky_btn
        icon: mdi:weather-sunset
        variables:
          option: Dusk
          accent: "#fab387"
        tap_action:
          action: call-service
          service: input_select.select_option
          service_data:
            entity_id: input_select.sky_mode
            option: Dusk
      - type: custom:button-card
        template: aurora_sky_btn
        icon: mdi:weather-night
        variables:
          option: Night
          accent: "#b4befe"
        tap_action:
          action: call-service
          service: input_select.select_option
          service_data:
            entity_id: input_select.sky_mode
            option: Night
    - type: grid
      grid_options:
        columns: full
      columns: 3
      square: false
      cards:
              # Same card twice: animated weather icon on a desktop, a still one
              # on a phone. The animated icons are SVG images that animate inside
              # their own image document — neither CSS nor JavaScript can stop
              # them, and they repaint continuously (measured: ~20 % CPU on a
              # phone, permanently). `conditional` only builds the matching one.
      - type: conditional
        conditions:
        - condition: screen
          media_query: "(min-width: 700px)"
        card:
          type: custom:clock-weather-card
          entity: weather.forecast_home
          sun_entity: sun.sun
          locale: de
          time_format: 24
          forecast_rows: 4
          animated_icon: true
      - type: conditional
        conditions:
        - condition: screen
          media_query: "(max-width: 699px)"
        card:
          type: custom:clock-weather-card
          entity: weather.forecast_home
          sun_entity: sun.sun
          locale: de
          time_format: 24
          forecast_rows: 4
          animated_icon: false
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:lightbulb-group
          label: Lights on
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('light.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('light.') && s.state === 'on').length);
            ]]]
          tap_action:
            action: navigate
            navigation_path: /aurora-home/licht
          styles:
            icon:
            - color: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('light.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('light.') && s.state === 'on').length;
                  return n > 0 ? '#f9e2af' : '#585b70';
                ]]]
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:window-open-variant
          label: Windows open
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('binary_sensor.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('binary_sensor.') &&
                ['door','window','opening','garage_door'].includes(s.attributes.device_class) &&
                s.state === 'on').length);
            ]]]
          tap_action:
            action: navigate
            navigation_path: /aurora-home/klima
          styles:
            icon:
            - color: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('binary_sensor.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('binary_sensor.') &&
                    ['door','window','opening','garage_door'].includes(s.attributes.device_class) &&
                    s.state === 'on').length;
                  return n > 0 ? '#fab387' : '#585b70';
                ]]]
            - animation: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('binary_sensor.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('binary_sensor.') &&
                    ['door','window','opening','garage_door'].includes(s.attributes.device_class) &&
                    s.state === 'on').length;
                  return n > 0 ? 'aurora-pulse 1.8s ease-in-out infinite' : 'none';
                ]]]
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:account-group
          label: At home
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('person.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('person.') && s.state === 'home').length);
            ]]]
          styles:
            icon:
            - color: "#a6e3a1"
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:battery-alert-variant-outline
          label: Batteries ≤ 20 %
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('sensor.') &&
                s.attributes.device_class === 'battery' &&
                parseFloat(s.state) <= 20).length);
            ]]]
          tap_action:
            action: navigate
            navigation_path: /aurora-home/system
          styles:
            icon:
            - color: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('sensor.') &&
                    s.attributes.device_class === 'battery' &&
                    parseFloat(s.state) <= 20).length;
                  return n > 0 ? '#f38ba8' : '#585b70';
                ]]]
            - animation: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('sensor.') &&
                    s.attributes.device_class === 'battery' &&
                    parseFloat(s.state) <= 20).length;
                  return n > 0 ? 'aurora-pulse 1.2s ease-in-out infinite' : 'none';
                ]]]
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:package-up
          label: Updates
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('update.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('update.') && s.state === 'on').length);
            ]]]
          tap_action:
            action: navigate
            navigation_path: /aurora-home/system
          styles:
            icon:
            - color: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('update.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('update.') && s.state === 'on').length;
                  return n > 0 ? '#89b4fa' : '#585b70';
                ]]]
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:music
          label: Media playing
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('media_player.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('media_player.') && s.state === 'playing').length);
            ]]]
          styles:
            icon:
            - color: |
                [[[
                  const n = Object.keys(hass.states).filter(_i=>_i.startsWith('media_player.')).map(_i=>hass.states[_i]).filter(s =>
                    s.entity_id.startsWith('media_player.') && s.state === 'playing').length;
                  return n > 0 ? '#cba6f7' : '#585b70';
                ]]]
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:toggle-switch
          label: Switches on
          name: |
            [[[
              return String(Object.keys(hass.states).filter(_i=>_i.startsWith('switch.')).map(_i=>hass.states[_i]).filter(s =>
                s.entity_id.startsWith('switch.') && s.state === 'on').length);
            ]]]
          styles:
            icon:
            - color: "#a6e3a1"
        - type: custom:button-card
          template: aurora_chip
          icon: mdi:home-thermometer
          label: Ø indoor
          name: |
            [[[
              const vals = Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.room_temp_')).map(_i=>hass.states[_i])
                .filter(s => s.entity_id.startsWith('sensor.room_temp_'))
                .map(s => parseFloat(s.state)).filter(v => !isNaN(v));
              if (!vals.length) return '–';
              return (vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(1) + ' °C';
            ]]]
          tap_action:
            action: navigate
            navigation_path: /aurora-home/klima
          styles:
            icon:
            - color: "#94e2d5"
      - type: vertical-stack
        cards:
        - type: custom:auto-entities
          card:
            type: grid
            columns: 3
            square: false
          card_param: cards
          filter:
            include:
            - domain: person
              options:
                type: custom:button-card
                template: aurora_person
        - type: custom:auto-entities
          show_empty: false
          card:
            type: vertical-stack
          card_param: cards
          filter:
            include:
            - domain: media_player
              state: playing
              options:
                type: custom:mushroom-media-player-card
                use_media_info: true
                media_controls:
                - play_pause_stop

  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Now
      heading_style: title
      icon: mdi:pulse
    - type: grid
      grid_options:
        columns: full
      columns: 6
      square: false
      cards:
      - type: custom:button-card
        template: aurora_metric
        entity: sensor.total_power
        name: Power
        icon: mdi:flash
        variables:
          accent: "#fab387"
          accent_bg: "rgba(250,179,135,0.10)"
      - type: custom:button-card
        template: aurora_metric
        entity: sensor.total_energy_today
        name: Energy today
        icon: mdi:lightning-bolt-circle
        variables:
          accent: "#94e2d5"
          accent_bg: "rgba(148,226,213,0.10)"
      - type: custom:button-card
        template: aurora_metric
        entity: sensor.total_cost_today
        name: Cost today
        icon: mdi:currency-eur
        variables:
          accent: "#f9e2af"
          accent_bg: "rgba(249,226,175,0.10)"
      - type: custom:button-card
        template: aurora_metric
        entity: sensor.outdoor_temperature
        name: Outdoor
        icon: mdi:thermometer
        variables:
          accent: "#89dceb"
          accent_bg: "rgba(137,220,235,0.10)"
      - type: custom:button-card
        template: aurora_metric
        entity: sensor.wan_download_rate
        name: WAN ↓
        icon: mdi:download
        variables:
          accent: "#89b4fa"
          accent_bg: "rgba(137,180,250,0.10)"
      - type: custom:button-card
        template: aurora_metric
        entity: sensor.wan_upload_rate
        name: WAN ↑
        icon: mdi:upload
        variables:
          accent: "#f5c2e7"
          accent_bg: "rgba(245,194,231,0.10)"
    - type: grid
      grid_options:
        columns: full
      columns: 2
      square: false
      cards:
      - type: custom:stack-in-card
        mode: vertical
        cards:
        - type: custom:button-card
          template: aurora_plot_header
          entity: sensor.total_power
          name: Power · 12 h
          label: "The home's current draw, in watts"
          state_display: |
            [[[ const v = parseFloat(entity.state); return isNaN(v) ? '—' : Math.round(v) + ' W'; ]]]
          variables:
            accent: "#fab387"
        - type: custom:apexcharts-card
          graph_span: 12h
          header:
            show: false
          apex_config:
            chart:
              height: 190
              animations: *apex_anim
              dropShadow:
                enabled: true
                top: 0
                left: 0
                blur: 6
                opacity: 0.7
                color: "#fab387"
            grid: *apex_grid
            fill: *apex_fill2
            legend:
              show: false
          all_series_config:
            type: area
            curve: stepline
            stroke_width: 2
            group_by:
              func: avg
              duration: 5min
          series:
          - entity: sensor.total_power
            name: Power
            color: "#fab387"
            show:
              legend_value: false
          - entity: sensor.total_power
            name: scan
            type: line
            color: "#fab387"
            stroke_width: 3
            show:
              in_legend: false
              in_header: false
              legend_value: false
      - type: custom:stack-in-card
        mode: vertical
        cards:
        - type: custom:button-card
          template: aurora_plot_header
          entity: sensor.wan_download_rate
          triggers_update:
          - sensor.wan_download_rate
          - sensor.wan_upload_rate
          name: WAN ↓ ↑ · 6 h
                    # The big figure shows TOTAL throughput (down + up), not just
                    # the download of the header entity.
          state_display: |
            [[[
              const d = parseFloat((states['sensor.wan_download_rate'] || {}).state);
              const u = parseFloat((states['sensor.wan_upload_rate'] || {}).state);
              const t = (isNaN(d) ? 0 : d) + (isNaN(u) ? 0 : u);
              return t.toFixed(1) + ' Mbit/s';
            ]]]
          variables:
            accent: "#89b4fa"
        - type: custom:apexcharts-card
          graph_span: 6h
          header:
            show: false
          apex_config:
            chart:
              height: 190
              animations: *apex_anim
              dropShadow:
                enabled: true
                top: 0
                left: 0
                blur: 6
                opacity: 0.7
                color: "#89b4fa"
            grid: *apex_grid
            fill: *apex_fill3
            legend:
              show: false
          all_series_config:
            type: area
            curve: stepline
            stroke_width: 2
            group_by:
              func: avg
              duration: 5min
          series:
          - entity: sensor.wan_download_rate
            name: Download
            color: "#89b4fa"
            show:
              legend_value: false
          - entity: sensor.wan_upload_rate
            name: Upload
            color: "#f5c2e7"
            show:
              legend_value: false
          - entity: sensor.wan_download_rate
            name: scan
            type: line
            color: "#89b4fa"
            stroke_width: 3
            show:
              in_legend: false
              in_header: false
              legend_value: false

