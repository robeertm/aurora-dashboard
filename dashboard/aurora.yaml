  # ═════════════════════════ 3 · KLIMA ═════════════════════════
- title: Climate
  path: klima
  icon: mdi:thermostat
  theme: Aurora
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:button-card
      template: aurora_sky
      grid_options:
        columns: full
    - type: custom:button-card
      template: aurora_view_title
      name: Climate
      icon: mdi:thermometer
      label: Warmth · air · humidity
      variables:
        accent: "#f38ba8"
      grid_options:
        columns: full
    - type: heading
      heading: Room temperatures · 24 h
      heading_style: title
      icon: mdi:chart-bell-curve-cumulative
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      graph_span: 24h
      header:
        show: true
        show_states: true
        colorize_states: true
      apex_config:
        chart:
          height: 340
          animations: *apex_anim
          dropShadow:
            enabled: true
            top: 0
            left: 0
            blur: 6
            opacity: 0.7
            color: "#89dceb"
        grid: *apex_grid
        legend:
          show: true
      all_series_config:
        stroke_width: 2
        curve: smooth
        group_by:
          func: avg
          duration: 15min
      series:
      - entity: sensor.outdoor_temperature
        name: Outdoor
        color: "#89dceb"
        stroke_width: 3
      - entity: sensor.outdoor_temperature
        name: scan
        type: line
        color: "#89dceb"
        stroke_width: 3
        show:
          in_legend: false
          in_header: false
          legend_value: false
      - entity: sensor.room_temp_living_room
        name: Living room
        color: "#cba6f7"
      - entity: sensor.room_temp_kitchen
        name: Kitchen
        color: "#fab387"
      - entity: sensor.room_temp_office
        name: Office
        color: "#89b4fa"
      - entity: sensor.room_temp_bedroom
        name: Bedroom
        color: "#b4befe"
      - entity: sensor.room_temp_bathroom
        name: Bathroom
        color: "#94e2d5"
      - entity: sensor.room_temp_kids_room_2
        name: Kids room 2
        color: "#f5c2e7"
      - entity: sensor.room_temp_kids_room_1
        name: Kids room 1
        color: "#a6e3a1"
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Thermostats
      heading_style: title
      icon: mdi:radiator
    - type: custom:auto-entities
      grid_options:
        columns: full
      card:
        type: grid
        columns: 4
        square: false
      card_param: cards
      sort:
        method: friendly_name
      filter:
        include:
        - domain: climate
          options:
            type: custom:mushroom-climate-card
            show_temperature_control: true
            hvac_modes:
            - heat
            - "off"
            collapsible_controls: true
  - type: grid
    column_span: 3
    cards:
    - type: grid
      grid_options:
        columns: full
      columns: 3
      square: false
      cards:
      - type: vertical-stack
        cards:
        - type: heading
          heading: Windows & Doors
          heading_style: title
          icon: mdi:window-closed-variant
        - type: custom:auto-entities
          card:
            type: grid
            columns: 2
            square: false
          card_param: cards
          sort:
            method: state
            reverse: true
          filter:
            include:
            - domain: binary_sensor
              attributes:
                device_class: window
              options:
                type: custom:button-card
                template: aurora_window
                icon: mdi:window-closed-variant
            - domain: binary_sensor
              attributes:
                device_class: door
              options:
                type: custom:button-card
                template: aurora_window
                icon: mdi:door
            - domain: binary_sensor
              attributes:
                device_class: opening
              options:
                type: custom:button-card
                template: aurora_window
                icon: mdi:door-open
      - type: vertical-stack
        cards:
        - type: heading
          heading: Humidity · 24 h
          heading_style: title
          icon: mdi:water-percent
        - type: custom:apexcharts-card
          graph_span: 24h
          header:
            show: false
          apex_config:
            chart:
              height: 200
              animations: *apex_anim
              dropShadow:
                enabled: true
                top: 0
                left: 0
                blur: 6
                opacity: 0.7
                color: "#89dceb"
            grid: *apex_grid
            fill: *apex_fill3
            legend:
              show: false
          all_series_config:
            type: area
            stroke_width: 2
            curve: stepline
            group_by:
              func: avg
              duration: 30min
          series:
          - entity: sensor.living_room_humidity
            name: Living room
            color: "#89dceb"
            show:
              legend_value: false
          - entity: sensor.kitchen_humidity
            name: Kitchen
            color: "#94e2d5"
            show:
              legend_value: false
          - entity: sensor.living_room_humidity
            name: scan
            type: line
            color: "#89dceb"
            stroke_width: 3
            show:
              in_legend: false
              in_header: false
              legend_value: false
      - type: vertical-stack
        cards:
        - type: heading
          heading: All temperature sensors
          heading_style: title
          icon: mdi:thermometer-lines
        - type: custom:auto-entities
          card:
            type: entities
          sort:
            method: state
            numeric: true
            reverse: true
          filter:
            include:
            - domain: sensor
              attributes:
                device_class: temperature
            exclude:
            - state: unavailable
            - state: unknown

  # ═════════════════════════ 4 · ENERGIE ═════════════════════════
- title: Energy
  path: energie
