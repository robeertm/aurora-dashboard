      - type: custom:button-card
        template: aurora_chip
        icon: mdi:script-text-play
        label: "Scripts"
        name: |
          [[[ return String(Object.keys(hass.states).filter(_i=>_i.startsWith('script.')).map(_i=>hass.states[_i]).filter(s=>s.entity_id.startsWith('script.')).length); ]]]
        styles:
