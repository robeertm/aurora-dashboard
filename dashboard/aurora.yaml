          - type: custom:button-card
            template: aurora_sky
            grid_options:
              columns: full
          - type: heading
            heading: WAN
            heading_style: title
            icon: mdi:wan
          - type: grid
            grid_options:
              columns: full
            columns: 2
            square: false
            cards:
              - type: custom:stack-in-card
                mode: vertical
                cards:
                  - type: custom:button-card
                    template: aurora_plot_header
                    entity: sensor.wan_download_rate
                    name: WAN throughput · 12 h
                    state_display: |
                      [[[ return parseFloat(entity.state).toFixed(1) + ' Mbit/s'; ]]]
                    variables:
                      accent: "#89b4fa"
                  - type: custom:apexcharts-card
                    graph_span: 12h
                    header:
                      show: false
                    apex_config:
                      chart:
                        height: 230
                        animations: *apex_anim
                        dropShadow:
                          enabled: true
                          top: 0
                          left: 0
                          blur: 6
                          opacity: 0.7
                          color: "#89b4fa"
                      grid: *apex_grid
                      fill: *apex_fill3
                      legend:
                        show: false
                    all_series_config:
                      type: area
                      stroke_width: 2
                      curve: stepline
                      group_by:
                        func: avg
                        duration: 5min
                    series:
                      - entity: sensor.wan_download_rate
                        name: Download
                        color: "#89b4fa"
                        show:
                          legend_value: false
                      - entity: sensor.wan_upload_rate
                        name: Upload
                        color: "#f5c2e7"
                        show:
                          legend_value: false
                      - entity: sensor.wan_download_rate
                        name: scan
                        type: line
                        color: "#89b4fa"
                        stroke_width: 3
                        show:
                          in_legend: false
                          in_header: false
                          legend_value: false
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:button-card
                    template: aurora_metric
                    entity: sensor.wan_download_today
                    name: Today ↓
                    icon: mdi:download
                    state_display: |
                      [[[ return (parseFloat(entity.state) / 1024).toFixed(1) + ' GB'; ]]]
                    variables:
                      accent: "#89b4fa"
                      accent_bg: "rgba(137,180,250,0.10)"
                  - type: custom:button-card
                    template: aurora_metric
                    entity: sensor.wan_upload_today
                    name: Today ↑
                    icon: mdi:upload
                    state_display: |
                      [[[ return (parseFloat(entity.state) / 1024).toFixed(1) + ' GB'; ]]]
                    variables:
                      accent: "#f5c2e7"
                      accent_bg: "rgba(245,194,231,0.10)"
                  - type: custom:button-card
                    template: aurora_metric
                    entity: sensor.wan_download_week
                    name: Week ↓
                    icon: mdi:calendar-week
                    state_display: |
                      [[[ return (parseFloat(entity.state) / 1024).toFixed(0) + ' GB'; ]]]
                    variables:
                      accent: "#74c7ec"
                      accent_bg: "rgba(116,199,236,0.10)"
                  - type: custom:button-card
                    template: aurora_metric
                    entity: sensor.wan_upload_week
                    name: Week ↑
                    icon: mdi:calendar-week
                    state_display: |
                      [[[ return (parseFloat(entity.state) / 1024).toFixed(0) + ' GB'; ]]]
                    variables:
                      accent: "#cba6f7"
                      accent_bg: "rgba(203,166,247,0.10)"
                  - type: custom:button-card
                    template: aurora_metric
                    entity: sensor.wan_download_month
                    name: Month ↓
                    icon: mdi:calendar-month
                    state_display: |
                      [[[ return (parseFloat(entity.state) / 1024).toFixed(0) + ' GB'; ]]]
                    variables:
                      accent: "#89dceb"
                      accent_bg: "rgba(137,220,235,0.10)"
                  - type: custom:button-card
                    template: aurora_metric
                    entity: sensor.wan_upload_month
                    name: Month ↑
                    icon: mdi:calendar-month
                    state_display: |
                      [[[ return (parseFloat(entity.state) / 1024).toFixed(0) + ' GB'; ]]]
                    variables:
                      accent: "#b4befe"
                      accent_bg: "rgba(180,190,254,0.10)"
      - type: grid
        column_span: 3
        cards:
          - type: grid
            grid_options:
              columns: full
            columns: 2
            square: false
            cards:
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Top devices today
                    heading_style: title
                    icon: mdi:podium-gold
                  - type: custom:auto-entities
                    card:
                      type: entities
                    sort:
                      method: state
                      numeric: true
                      reverse: true
                    filter:
                      include:
                        - entity_id: sensor.devtraffic_*
                      exclude:
                        - entity_id: "sensor.devtraffic_*_v4*"
                        - entity_id: "sensor.devtraffic_*_v6*"
                        - state: "0.0"
                        - state: unavailable
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Radio signal (RSSI)
                    heading_style: title
                    icon: mdi:signal
                  - type: custom:auto-entities
                    card:
                      type: entities
                    sort:
                      method: state
                      numeric: true
                    filter:
                      include:
                        - domain: sensor
                          attributes:
                            device_class: signal_strength
                      exclude:
                        - state: unavailable
      - type: grid
        column_span: 3
        cards:
          - type: grid
            grid_options:
              columns: full
            columns: 2
            square: false
            cards:
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: PoE power
                    heading_style: title
                    icon: mdi:ethernet
                  - type: custom:auto-entities
                    card:
                      type: entities
                    sort:
                      method: state
                      numeric: true
                      reverse: true
                    filter:
                      include:
                        - entity_id: "sensor.*_poe_power"
                        - entity_id: sensor.your_router_poe_power
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Router
                    heading_style: title
                    icon: mdi:router-network
                  - type: custom:auto-entities
                    card:
                      type: entities
                    sort:
                      method: friendly_name
                    filter:
                      include:
                        - entity_id: sensor.your_router_*
                      exclude:
                        - entity_id: "sensor.your_router_*poe*"
                        - state: unavailable

  # ═════════════════════════ 6 · SYSTEM ═════════════════════════
  - title: System
    path: system
    icon: mdi:heart-pulse
    theme: Aurora
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: aurora_sky
            grid_options:
              columns: full
          - type: heading
            heading: Batteries
            heading_style: title
            icon: mdi:battery-heart-variant
          - type: custom:auto-entities
            grid_options:
              columns: full
            card:
              type: grid
              columns: 6
              square: false
            card_param: cards
            sort:
              method: state
              numeric: true
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: battery
                  options:
                    type: custom:button-card
                    template: aurora_battery
              exclude:
                - state: unavailable
                - state: unknown
      - type: grid
        column_span: 3
        cards:
          - type: grid
            grid_options:
              columns: full
            columns: 4
            square: false
            cards:
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Updates & Automations
                    heading_style: title
                    icon: mdi:package-up
                  - type: custom:auto-entities
                    show_empty: false
                    card:
                      type: entities
                      title: Pending updates
                    sort:
                      method: friendly_name
                    filter:
                      include:
                        - domain: update
                          state: "on"
                  - type: custom:auto-entities
                    show_empty: false
                    card:
                      type: entities
                      title: Paused automations
                    filter:
                      include:
                        - domain: automation
                          state: "off"
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Server / Pi
                    heading_style: title
                    icon: mdi:raspberry-pi
                  - type: custom:auto-entities
                    card:
                      type: entities
                    sort:
                      method: friendly_name
                    filter:
                      include:
                        - entity_id: sensor.your_server*
                      exclude:
                        - state: unavailable
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Device trackers
                    heading_style: title
                    icon: mdi:radar
                  - type: custom:auto-entities
                    card:
                      type: entities
                    sort:
                      method: state
                    filter:
                      include:
                        - domain: device_tracker
                      exclude:
                        - state: unavailable
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Uptimes & timestamps
                    heading_style: title
                    icon: mdi:timer-outline
                  - type: custom:auto-entities
                    card:
                      type: entities
                    sort:
                      method: friendly_name
                    filter:
                      include:
                        - domain: sensor
                          attributes:
                            device_class: uptime
                        - domain: sensor
                          attributes:
                            device_class: duration
                        - domain: sensor
                          attributes:
                            device_class: timestamp
                      exclude:
                        - state: unavailable
                        - state: unknown

  # ═════════════════════════ 7 · EXPLORER ═════════════════════════
  - title: Explorer
    path: explorer
    icon: mdi:telescope
    theme: Aurora
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: aurora_sky
            grid_options:
              columns: full
          - type: heading
            heading: Sensor explorer — every single entity, grouped by class
            heading_style: title
            icon: mdi:telescope
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: Temperature
            sort: {method: state, numeric: true, reverse: true}
            filter:
              include: [{domain: sensor, attributes: {device_class: temperature}}]
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: Humidity & Pressure
            sort: {method: state, numeric: true, reverse: true}
            filter:
              include:
                - {domain: sensor, attributes: {device_class: humidity}}
                - {domain: sensor, attributes: {device_class: pressure}}
                - {domain: sensor, attributes: {device_class: illuminance}}
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: Power
            sort: {method: state, numeric: true, reverse: true}
            filter:
              include: [{domain: sensor, attributes: {device_class: power}}]
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: Energy & Kosten
            sort: {method: state, numeric: true, reverse: true}
            filter:
              include:
                - {domain: sensor, attributes: {device_class: energy}}
                - {domain: sensor, attributes: {device_class: monetary}}
                - {domain: sensor, attributes: {device_class: water}}
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: Voltage · Current · Frequency
            sort: {method: friendly_name}
            filter:
              include:
                - {domain: sensor, attributes: {device_class: voltage}}
                - {domain: sensor, attributes: {device_class: current}}
                - {domain: sensor, attributes: {device_class: frequency}}
                - {domain: sensor, attributes: {device_class: power_factor}}
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: Battery
            sort: {method: state, numeric: true}
            filter:
              include: [{domain: sensor, attributes: {device_class: battery}}]
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: Radio (RSSI)
            sort: {method: state, numeric: true}
            filter:
              include: [{domain: sensor, attributes: {device_class: signal_strength}}]
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: Data rate
            sort: {method: state, numeric: true, reverse: true}
            filter:
              include: [{domain: sensor, attributes: {device_class: data_rate}}]
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: Data volume
            sort: {method: state, numeric: true, reverse: true}
            filter:
              include: [{domain: sensor, attributes: {device_class: data_size}}]
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: Times & uptimes
            sort: {method: friendly_name}
            filter:
              include:
                - {domain: sensor, attributes: {device_class: timestamp}}
                - {domain: sensor, attributes: {device_class: duration}}
                - {domain: sensor, attributes: {device_class: uptime}}
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: Status (enum)
            sort: {method: friendly_name}
            filter:
              include: [{domain: sensor, attributes: {device_class: enum}}]
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: No device class
            sort: {method: friendly_name}
            filter:
              include: [{domain: sensor}]
              exclude:
                - attributes: {device_class: "*"}
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
              title: Binary sensors
            sort: {method: state, reverse: true}
            filter:
              include: [{domain: binary_sensor}]
