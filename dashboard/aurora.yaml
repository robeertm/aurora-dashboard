- title: "Bedroom"
  path: room-bedroom
  icon: mdi:bed-king
  theme: Aurora
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:button-card
      template: aurora_sky
      grid_options:
        columns: full
    - type: custom:button-card
      template: aurora_view_title
      name: "Bedroom"
      icon: mdi:bed-king
      label: Room
      variables:
        accent: "#cba6f7"
      grid_options:
        columns: full
    - type: grid
      grid_options:
        columns: full
      columns: 3
      square: false
      cards:
      - type: custom:stack-in-card
        mode: vertical
        cards:
        - type: custom:button-card
          template: aurora_room
          entity: sensor.room_temp_bedroom
          name: "Bedroom"
          icon: mdi:bed-king
          variables:
            accent: "#b4befe"
            accent_bg: "rgba(180,190,254,0.10)"
            window: binary_sensor.window_bedroom
        - type: thermostat
          entity: climate.trv_bedroom
          show_current_as_primary: true
          features:
          - type: climate-hvac-modes
            style: icons
            hvac_modes:
            - heat
            - "off"
                  # Optional: a room-setpoint helper (input_number) shown as a slider.
        - type: custom:mushroom-number-card
          entity: input_number.room_setpoint_bedroom
          name: Room setpoint
          icon: mdi:target
          display_mode: slider
          fill_container: true
        - type: grid
          columns: 2
          square: false
          cards:
          - type: custom:button-card
            template: aurora_valve
            entity: sensor.trv_bedroom_valve
            name: Valve
            icon: mdi:pipe-valve
            variables:
              accent: "#b4befe"
              accent_bg: "rgba(180,190,254,0.10)"
          - type: custom:button-card
            template: aurora_battery
            entity: sensor.trv_bedroom_battery
            name: Thermostat
          - type: custom:button-card
            template: aurora_battery
            entity: sensor.window_bedroom_battery
            name: Window sensor
        - type: custom:button-card
          template: aurora_window
          entity: binary_sensor.window_bedroom
          name: Window
          icon: mdi:window-closed-variant
      - type: custom:stack-in-card
        mode: vertical
        cards:
        - type: custom:button-card
          template: aurora_group_header
          name: Light
          icon: mdi:lightbulb-group
          variables:
            accent: "#b4befe"
        - type: custom:auto-entities
          card:
            type: grid
            columns: 3
            square: false
          card_param: cards
          sort:
            method: friendly_name
          filter:
            include:
            - domain: light
              area: "Bedroom"
              options:
                type: custom:button-card
                template: aurora_light
            exclude:
            - entity_id: light.bedroom               # room GROUP entity (Hue) — would duplicate the room
        - type: custom:button-card
          template: aurora_group_header
          name: Scenes
          icon: mdi:palette
          variables:
            accent: "#b4befe"
        - type: custom:auto-entities
          card:
            type: grid
            columns: 2
            square: false
          card_param: cards
          sort:
            method: friendly_name
          filter:
            include:
            - domain: scene
              entity_id: "scene.bedroom_*"
              options:
                type: custom:button-card
                template: aurora_scene
      - type: custom:stack-in-card
        mode: vertical
        cards:
        - type: custom:button-card
          template: aurora_group_header
          name: Switches
          icon: mdi:power-socket-eu
          variables:
            accent: "#b4befe"
        - type: custom:auto-entities
          card:
            type: grid
            columns: 2
            square: false
          card_param: cards
          sort:
            method: friendly_name
          filter:
            include:
            - domain: switch
              area: "Bedroom"
              options:
                type: custom:button-card
                template: aurora_switch
        - type: custom:button-card
          template: aurora_group_header
          name: Media
          icon: mdi:play-circle
          variables:
            accent: "#b4befe"
        - type: custom:mushroom-media-player-card
          entity: media_player.bedroom_speaker
          use_media_info: true
          fill_container: true
          collapsible_controls: true
          media_controls:
          - play_pause_stop
          volume_controls:
          - volume_set
        - type: custom:button-card
          template: aurora_group_header
          name: Automations
          icon: mdi:robot
          variables:
            accent: "#b4befe"
                  # Matches automations whose entity_id mentions the room.
        - type: custom:auto-entities
          card:
            type: grid
            columns: 1
            square: false
          card_param: cards
          sort:
            method: friendly_name
          filter:
            include:
            - entity_id: "automation.*bedroom*"
              options:
                type: custom:button-card
                template: aurora_automation
                variables:
                  accent: "#b4befe"

  # ═════════════════════════ ROOM · OFFICE ═════════════════════════
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Trends
      heading_style: title
      icon: mdi:chart-areaspline
    - type: grid
      grid_options:
        columns: full
      columns: 2
      square: false
      cards:
      - type: custom:stack-in-card
        mode: vertical
        cards:
        - type: custom:button-card
          template: aurora_plot_header
          entity: sensor.room_temp_bedroom
          name: Temperature · 24 h
          label: "Measured temperature against the set point, in °C"
          state_display: |
            [[[ const v = parseFloat(entity.state); return isNaN(v) ? '—' : v.toFixed(1) + ' °C'; ]]]
          variables:
            accent: "#89b4fa"
        - type: custom:mini-graph-card
          entities:
          - entity: sensor.room_temp_bedroom
            name: Actual
            color: "#89b4fa"
          - entity: input_number.room_setpoint_bedroom
            name: Target
            color: "#a6adc8"
          hours_to_show: 24
          points_per_hour: 30
          line_width: 1.5
          animate: false
          hour24: true
          show:
            name: false
            icon: false
            state: false
            legend: true
            fill: fade
            labels: true
            extrema: true
          smoothing: true
          height: 146
      - type: custom:stack-in-card
        mode: vertical
        cards:
        - type: custom:button-card
          template: aurora_plot_header
          entity: sensor.trv_bedroom_valve
          name: Valve position · 24 h
          label: "How far the radiator valve was open — 100 % is full heat, 0 % is shut"
          state_display: |
            [[[ const v = parseFloat(entity.state); return isNaN(v) ? '—' : Math.round(v) + ' %'; ]]]
          variables:
            accent: "#fab387"
        - type: custom:mini-graph-card
          entities:
          - entity: sensor.trv_bedroom_valve
            name: Valve
            color: "#fab387"
          hours_to_show: 24
          points_per_hour: 30
          line_width: 1.5
          animate: false
          hour24: true
          show:
            name: false
            icon: false
            state: false
            legend: false
            fill: fade
            labels: true
            extrema: true
          smoothing: true
          height: 170
