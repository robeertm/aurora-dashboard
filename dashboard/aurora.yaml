  # ═════════════════════════ RADIO (Bluetooth / Thread / RSSI) ═════════════════════════
  # The signal-tile grid below is fully generic (it discovers every sensor with
  # device_class signal_strength). The scanner cards + charts reference
  # placeholder entities — swap in your own BLE scanner / mesh sensors, or
  # delete those cards if you don't track scanners.
- title: Radio
  path: radio
  icon: mdi:bluetooth-audio
  theme: Aurora
  type: sections
  max_columns: 3
  sections:

  - type: grid
    column_span: 3
    cards:
    - type: custom:button-card
      template: aurora_sky
      grid_options:
        columns: full
    - type: custom:button-card
      template: aurora_view_title
      name: Radio
      icon: mdi:access-point
      label: Radio · batteries · signal
      variables:
        accent: "#b4befe"
      grid_options:
        columns: full
    - type: grid
      grid_options:
        columns: full
      columns: 3
      square: false
      cards:
      - type: custom:button-card
        template: aurora_chip
        icon: mdi:bluetooth-audio
        label: Signal sensors
        name: |
          [[[
            return String(Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.')).map(_i=>hass.states[_i]).filter(s =>
              s.entity_id.startsWith('sensor.') &&
              s.attributes.device_class === 'signal_strength' &&
              !isNaN(parseFloat(s.state))).length);
          ]]]
        styles:
          icon:
          - color: "#89dceb"
          - animation: aurora-pulse 2.4s ease-in-out infinite
      - type: custom:button-card
        template: aurora_chip
        icon: mdi:signal-cellular-3
        label: Strongest
        name: |
          [[[
            const vs = Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.')).map(_i=>hass.states[_i]).filter(s =>
              s.entity_id.startsWith('sensor.') &&
              s.attributes.device_class === 'signal_strength' &&
              !isNaN(parseFloat(s.state))).map(s => parseFloat(s.state));
            return vs.length ? Math.round(Math.max(...vs)) + ' dBm' : '—';
          ]]]
        styles:
          icon:
          - color: "#a6e3a1"
      - type: custom:button-card
        template: aurora_chip
        icon: mdi:signal-cellular-1
        label: Weakest
        name: |
          [[[
            const vs = Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.')).map(_i=>hass.states[_i]).filter(s =>
              s.entity_id.startsWith('sensor.') &&
              s.attributes.device_class === 'signal_strength' &&
              !isNaN(parseFloat(s.state))).map(s => parseFloat(s.state));
            return vs.length ? Math.round(Math.min(...vs)) + ' dBm' : '—';
          ]]]
        styles:
          icon:
          - color: |
              [[[
                const vs = Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.')).map(_i=>hass.states[_i]).filter(s =>
                  s.entity_id.startsWith('sensor.') &&
                  s.attributes.device_class === 'signal_strength' &&
                  !isNaN(parseFloat(s.state))).map(s => parseFloat(s.state));
                if (!vs.length) return '#585b70';
                return Math.min(...vs) < -90 ? '#f38ba8' : '#f9e2af';
              ]]]
          - animation: |
              [[[
                const vs = Object.keys(hass.states).filter(_i=>_i.startsWith('sensor.')).map(_i=>hass.states[_i]).filter(s =>
                  s.entity_id.startsWith('sensor.') &&
                  s.attributes.device_class === 'signal_strength' &&
                  !isNaN(parseFloat(s.state))).map(s => parseFloat(s.state));
                return (vs.length && Math.min(...vs) < -90) ? 'aurora-pulse 1.4s ease-in-out infinite' : 'none';
              ]]]

